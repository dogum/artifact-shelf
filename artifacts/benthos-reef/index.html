<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Benthos reef</title>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  --abyss:#031018; --ink:#eae6dc; --muted:#a3b0b1; --amber:#e0a75e; --coral:#e27a62;
  --chip:rgba(3,16,24,.66); --chip-line:rgba(234,230,220,.16);
  --panel:#eef2f0; --panel-ink:#10222a; --panel-muted:#4f626a; --panel-line:rgba(16,34,42,.14); --choice:#fff; --lock:rgba(16,34,42,.35);
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --panel:#0c1c23; --panel-ink:#eae6dc; --panel-muted:#9eabac; --panel-line:rgba(234,230,220,.14); --choice:#12262f; --lock:rgba(234,230,220,.3); } }
:root[data-theme="dark"]{ --panel:#0c1c23; --panel-ink:#eae6dc; --panel-muted:#9eabac; --panel-line:rgba(234,230,220,.14); --choice:#12262f; --lock:rgba(234,230,220,.3); }
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0;overflow:hidden;background:var(--abyss);color:var(--ink);font-family:var(--serif);-webkit-font-smoothing:antialiased}
body{position:relative;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#gl,#ui{position:fixed;top:0;left:0;width:100vw;height:100vh;height:100dvh;display:block}
#gl{touch-action:none}
#ui{pointer-events:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.hud{position:absolute;left:0;right:0;display:flex;justify-content:space-between;gap:12px;padding:12px 14px;pointer-events:none}
.hud.top{top:0;align-items:flex-start}
.hud.bottom{bottom:0;align-items:flex-end}
.play-only{transition:opacity .3s}
body:not(.playing) .play-only{opacity:0;pointer-events:none}
.clock{font-size:clamp(36px,8vw,54px);line-height:.95;font-variant-numeric:tabular-nums;letter-spacing:-.02em;text-shadow:0 1px 12px rgba(0,0,0,.5)}
.goal{margin-top:8px;width:150px}
.goal span{font-size:15px;font-style:italic;color:var(--muted)}
.goal .track{height:3px;border-radius:2px;background:var(--chip-line);margin-top:5px;overflow:hidden}
.goal .track i{display:block;height:100%;width:0;background:var(--amber);transition:width .25s}
.goal.done span{color:var(--amber)}
.tr{display:flex;flex-direction:column;align-items:flex-end;gap:8px;pointer-events:auto}
.icon{width:40px;height:40px;border-radius:50%;background:var(--chip);border:1px solid var(--chip-line);font-size:14px;font-style:italic}
.perf{font:11px/1.55 var(--mono);color:var(--muted);text-align:right;background:var(--chip);border:1px solid var(--chip-line);border-radius:7px;padding:6px 9px;min-width:92px}
.perf b{color:var(--ink);font-weight:500}
.perf[hidden]{display:none}
.cams{display:flex;background:var(--chip);border:1px solid var(--chip-line);border-radius:999px;padding:3px;pointer-events:auto}
.cams button{background:none;border:0;border-radius:999px;padding:8px 14px;font-size:15px;line-height:1}
.cams button[aria-pressed="true"]{background:var(--amber);color:#1d1407}
.acts{display:flex;align-items:flex-end;gap:12px;pointer-events:auto}
.act{position:relative;width:70px;height:70px;border-radius:50%;background:var(--chip);border:1px solid var(--chip-line);font-size:14px;font-style:italic;display:grid;place-items:center;touch-action:none}
.act.big{width:78px;height:78px;font-size:15px}
.act::before{content:"";position:absolute;inset:-4px;border-radius:50%;background:conic-gradient(var(--amber) calc(var(--p,1)*360deg),transparent 0);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2px));mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2px))}
.act.on{background:var(--amber);color:#1d1407}
.act.wait{color:var(--muted)}
.status{position:absolute;left:50%;top:14px;transform:translateX(-50%);pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:6px;width:max-content;max-width:60vw}
.tag{font-size:14px;font-style:italic;padding:6px 12px;border-radius:999px;background:var(--chip);border:1px solid var(--chip-line);opacity:0;transition:opacity .25s}
.tag.on{opacity:1}
.tag.warn{border-color:rgba(226,122,98,.55);color:#f2b3a3}
.tag.safe{border-color:rgba(224,167,94,.5);color:#f0cf9f}
.toasts{position:absolute;left:50%;top:36%;transform:translateX(-50%);pointer-events:none;text-align:center}
.toast{font-size:20px;font-style:italic;color:var(--amber);text-shadow:0 1px 10px rgba(0,0,0,.6);animation:rise 1.1s ease-out forwards;white-space:nowrap}
@keyframes rise{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-38px)}}
#flash{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,rgba(226,122,98,0) 35%,rgba(226,122,98,.55) 100%);opacity:0;transition:opacity .6s}
#flash.on{opacity:1;transition:opacity .05s}
#dread{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,rgba(226,122,98,0) 55%,rgba(170,60,50,.45) 100%);opacity:0}
.eaten{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);font-size:clamp(24px,5vw,34px);font-style:italic;color:#f7c9bb;opacity:0;pointer-events:none;transition:opacity .3s;text-shadow:0 2px 16px rgba(0,0,0,.7);white-space:nowrap}
.eaten.on{opacity:1}
.joy{position:fixed;width:124px;height:124px;margin:-62px 0 0 -62px;border-radius:50%;border:1px solid rgba(234,230,220,.28);pointer-events:none;display:none}
.joy i{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:rgba(234,230,220,.22)}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:18px;background:rgba(3,16,24,.4);overflow-y:auto}
.overlay[hidden]{display:none}
.card{width:100%;max-width:440px;background:var(--panel);color:var(--panel-ink);border-radius:16px;padding:22px 20px 20px;box-shadow:0 20px 60px rgba(0,0,0,.45);margin:auto}
.card h1{font-size:34px;line-height:1.05;margin:0 0 8px;font-weight:600;letter-spacing:-.02em}
.card h2{font-size:15px;font-weight:600;margin:16px 0 8px;color:var(--panel-muted);font-style:italic}
.card p{margin:0 0 4px;color:var(--panel-muted);font-size:16px;line-height:1.5}
.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.choice{display:block;text-align:left;background:var(--choice);border:1px solid var(--panel-line);border-radius:10px;padding:9px 11px}
.choice b{font-size:16px;font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.choice span{font-size:14px;color:var(--panel-muted);line-height:1.4;display:block;margin-top:2px}
.choice[aria-pressed="true"]{border-color:var(--amber);box-shadow:inset 0 0 0 1px var(--amber)}
.levels{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.about{font-size:15px!important;margin-top:10px!important;min-height:3em}
.lvl{background:var(--choice);border:1px solid var(--panel-line);border-radius:10px;padding:10px 8px;text-align:center}
.lvl b{display:block;font-size:16px;font-weight:600}
.lvl small{display:block;font-size:13px;color:var(--panel-muted);margin-top:2px}
.lvl .st{font-size:15px;letter-spacing:2px;color:var(--amber);margin-top:4px;display:block}
.lvl[aria-pressed="true"]{border-color:var(--amber);box-shadow:inset 0 0 0 1px var(--amber)}
.lvl:disabled{opacity:.45;cursor:not-allowed}
.go{width:100%;border:0;border-radius:10px;padding:14px;font-size:18px;font-weight:600;background:var(--amber);color:#1d1407;margin-top:16px}
.go:disabled{opacity:.45;cursor:progress}
.bar{height:3px;border-radius:2px;background:var(--panel-line);margin:10px 0 2px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--amber);transition:width .15s}
.fine{font-size:13px;color:var(--panel-muted);margin:12px 0 0;line-height:1.45}
.stars{font-size:40px;letter-spacing:6px;color:var(--amber);line-height:1;margin:6px 0 10px}
.stars s{text-decoration:none;color:var(--lock)}
.score{font-size:19px;margin:0 0 6px}
.sum{font-size:16px;line-height:1.55;color:var(--panel-muted)}
.sum div{margin-bottom:4px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.row2 .go{margin-top:0}
.ghost{width:100%;border:1px solid var(--panel-line);border-radius:10px;padding:13px;font-size:17px;background:none;color:var(--panel-ink)}
.ghost[hidden],.go[hidden]{display:none}
.saved{font-size:13px;color:var(--panel-muted);text-align:center;margin-top:8px;min-height:1em}
@media (prefers-reduced-motion:reduce){.toast{animation:none;opacity:0}#flash{transition:none}}
@media (max-width:520px){.choices{grid-template-columns:repeat(2,1fr)}.levels{grid-template-columns:repeat(2,1fr)}.cams button{padding:8px 11px;font-size:14px}.status{top:104px}.perf{font-size:10px}.card h1{font-size:30px}}
</style>
</head>
<body>
<canvas id="gl" aria-label="Reef scene"></canvas>
<canvas id="ui" aria-hidden="true"></canvas>
<div id="dread"></div>

<div class="hud top">
  <div class="play-only">
    <div class="clock" id="clock">1:00</div>
    <div class="goal" id="goal"><span id="goaltxt">0 of 8 points</span><div class="track"><i id="goalbar"></i></div></div>
  </div>
  <div class="tr">
    <button class="icon" id="mute" aria-label="Sound off">off</button>
    <div class="perf" id="perf" hidden>—</div>
  </div>
</div>
<div class="status play-only"><div class="tag warn" id="hunted"></div><div class="tag safe" id="hidden"></div></div>

<div class="hud bottom play-only">
  <div class="cams" role="group" aria-label="Camera">
    <button data-cam="chase" aria-pressed="true">Chase</button>
    <button data-cam="side" aria-pressed="false">Side</button>
    <button data-cam="top" aria-pressed="false">Top</button>
  </div>
  <div class="acts">
    <button class="act" id="dash" aria-label="Dash">dash</button>
    <button class="act big" id="ability">flare</button>
  </div>
</div>
<div class="joy" id="joy"><i></i></div>

<div class="overlay" id="menu">
  <div class="card">
    <h1>Benthos reef</h1>
    <p>Every animal here is drawn live from the gallery’s own code. Eat what you can, hide from what can eat you, one minute at a time.</p>
    <div class="bar"><i id="load"></i></div>
    <h2>Play as</h2>
    <div class="choices" id="choices"></div>
    <p class="about" id="about"></p>
    <h2>Reef</h2>
    <div class="levels" id="levels"></div>
    <button class="go" id="go" disabled>Preparing the reef…</button>
    <div class="fine" id="howto">Drag anywhere to steer. Hold dash to sprint. Every animal has its own move.</div>
  </div>
</div>

<div class="overlay" id="over" hidden>
  <div class="card">
    <h1 id="resTitle">Reef cleared</h1>
    <div class="stars" id="stars"></div>
    <div class="score" id="score"></div>
    <div class="sum" id="sum"></div>
    <div class="row2"><button class="go" id="next">Next reef</button><button class="ghost" id="again">Try again</button></div>
    <div class="row2"><button class="ghost" id="card">Save result card</button><button class="ghost" id="back">Change animal</button></div>
    <div class="saved" id="saved"></div>
  </div>
</div>
<script>
/* ---- the gallery's own code, verbatim ---- */
var TAU = Math.PI * 2, HP = Math.PI / 2;

function crv(P) {
  var n = P.length;
  return function (s) {
    var f = s * (n - 1), i = Math.min(n - 2, Math.floor(f)), u = f - i;
    var p0 = P[Math.max(0, i - 1)], p1 = P[i], p2 = P[i + 1], p3 = P[Math.min(n - 1, i + 2)];
    var u2 = u * u, u3 = u2 * u, o = [0, 0, 0];
    for (var k = 0; k < 3; k++) {
      o[k] = 0.5 * ((2 * p1[k]) + (-p0[k] + p2[k]) * u +
        (2 * p0[k] - 5 * p1[k] + 4 * p2[k] - p3[k]) * u2 +
        (-p0[k] + 3 * p1[k] - 3 * p2[k] + p3[k]) * u3);
    }
    return o;
  };
}

function limb(st, path, rad, NS, NA, boost, arc) {
  var ns = Math.max(7, Math.round(NS / st.step)), h = 0.004;
  var a0 = arc ? arc[0] : 0, a1 = arc ? arc[1] : TAU;
  for (var a = 0; a < ns; a++) {
    var s = a / (ns - 1), p = path(s);
    var p1 = path(Math.min(1, s + h)), p0 = path(Math.max(0, s - h));
    var tx = p1[0] - p0[0], ty = p1[1] - p0[1], tz = p1[2] - p0[2];
    var tl = Math.sqrt(tx * tx + ty * ty + tz * tz) || 1; tx /= tl; ty /= tl; tz /= tl;
    var ux = 0, uy = 1, uz = 0;
    if (Math.abs(ty) > 0.94) { ux = 1; uy = 0; uz = 0; }
    var ex = ty * uz - tz * uy, ey = tz * ux - tx * uz, ez = tx * uy - ty * ux;
    var el = Math.sqrt(ex * ex + ey * ey + ez * ez) || 1; ex /= el; ey /= el; ez /= el;
    var fx = ty * ez - tz * ey, fy = tz * ex - tx * ez, fz = tx * ey - ty * ex;
    for (var b = 0; b < NA; b++) {
      var w = a0 + (a1 - a0) * (b / NA), c = Math.cos(w), n = Math.sin(w), r = rad(s, w);
      var bo = (typeof boost === 'function') ? boost(s, w) : boost;
      st.cast(p[0] + r * (c * ex + n * fx), p[1] + r * (c * ey + n * fy),
              p[2] + r * (c * ez + n * fz), bo);
    }
  }
}

function blade(st, N, fn, boost) {
  var n = Math.max(6, Math.round(N / st.step));
  for (var a = 0; a < n; a++) {
    for (var b = 0; b < 13; b++) {
      var p = fn(a / (n - 1), b / 12);
      st.cast(p[0], p[1], p[2], boost);
    }
  }
}

function ball(st, cx, cy, cz, r, N, boost, sq) {
  var n = Math.max(80, Math.round(N / st.step));
  for (var i = 0; i < n; i++) {
    var u = i * 2.399963229728653, v = 1 - 2 * (i + 0.5) / n;
    var sr = Math.sqrt(1 - v * v);
    st.cast(cx + r * sr * Math.cos(u), cy + r * v * (sq || 1), cz + r * sr * Math.sin(u), boost);
  }
}

function hsh(k) { var x = Math.sin(k * 12.9898 + 78.233) * 43758.5453; return x - Math.floor(x); }

function perp2(d) {
  var ux = 0, uy = 1, uz = 0;
  if (Math.abs(d[1]) > 0.94) { ux = 1; uy = 0; uz = 0; }
  var ex = d[1] * uz - d[2] * uy, ey = d[2] * ux - d[0] * uz, ez = d[0] * uy - d[1] * ux;
  var el = Math.sqrt(ex * ex + ey * ey + ez * ez) || 1; ex /= el; ey /= el; ez /= el;
  return [[ex, ey, ez], [d[1] * ez - d[2] * ey, d[2] * ex - d[0] * ez, d[0] * ey - d[1] * ex]];
}

function shark(st, P, T) {
  var s3 = st.step, i, k, g, L = 320, beat = T * 2.4;
  var mid = function (s) { return [-160 + L * s, 0, P.swim * (22 * Math.pow(s, 1.6) + 3) * Math.sin(s * 5.2 - beat) - P.swim * 3 * Math.sin(-beat)]; };
  var Rh = function (s) {
    var r = s < 0.4 ? 36 * Math.pow(Math.sin(HP * Math.min(1, (s + 0.012) / 0.4)), 0.62)
                    : 5 + 31 * Math.pow(Math.cos(HP * Math.min(1, (s - 0.4) / 0.55)), 1.25);
    return r * (0.72 + 0.28 * Math.min(1, s / 0.12));            // flatter snout
  };
  var Rw = function (s) { return Rh(s) * 0.84; };
  var side = function (s) {                                      // lateral unit vector: the tangent turned 90 degrees in plan
    var a = mid(Math.min(1, s + 0.003)), b = mid(Math.max(0, s - 0.003)), tx = a[0] - b[0], tz = a[2] - b[2], l = Math.sqrt(tx * tx + tz * tz) || 1;
    return [-tz / l, tx / l];
  };
  var sp = function (s, w, k) { var c = mid(s), e = side(s); k = k || 1;
    return [c[0] + e[0] * Rw(s) * Math.cos(w) * k, c[1] + Rh(s) * Math.sin(w) * k, c[2] + e[1] * Rw(s) * Math.cos(w) * k]; };
  for (i = 0; i < 30000; i += s3) {                              // skin: golden-angle scatter, pale belly
    var s = (i + 0.5) / 30000, w = i * 2.399963229728653, p = sp(s, w);
    st.cast(p[0], p[1], p[2], Math.sin(w) > -0.15 ? 1.0 : 0.58);
  }
  for (g = -1; g <= 1; g += 2) {
    var we = g > 0 ? 0.3 : Math.PI - 0.3, pe = sp(0.075, we, 1.02);
    ball(st, pe[0], pe[1], pe[2], 3.6, 160, 2.6);                // eyes
    for (k = 0; k < 5; k++) for (i = 0; i < 40; i += s3) {       // five gill slits
      var gw = -0.5 + 0.8 * i / 39, pg = sp(0.165 + k * 0.017, g > 0 ? gw : Math.PI - gw, 1.02);
      st.cast(pg[0], pg[1], pg[2], 1.9);
    }
  }
  for (i = 0; i < 120; i += s3) {                                // mouth, a crescent under the snout
    var mq = i / 119 - 0.5, pm = sp(0.07 + 0.03 * mq * mq * 4, -HP + mq * 2.2, 1.03); st.cast(pm[0], pm[1], pm[2], 1.5);
  }
  var tip = function (v) { return v > 0.8 ? 0.85 + 1.7 * P.tip : 0.85; };   // the black tips, as the brightest points: a photographic negative
  function fin(N, M, fn) {                                        // a planar sheet whose points carry their own brightness
    var n = Math.max(6, Math.round(N / s3));
    for (var a = 0; a < n; a++) for (var b = 0; b < M; b++) { var r = fn(a / (n - 1), b / (M - 1)); st.cast(r[0], r[1], r[2], r[3]); }
  }
  function upright(s0, s1, sA, H, dir) {                          // dorsal / anal: root along the body, apex swept back
    fin(30, 16, function (u, v) { var s = s0 + (s1 - s0) * u, ss = s + (sA - s) * v, c = mid(ss);
      return [c[0] - 4 * v * (1 - v) * u * H / 20, c[1] + dir * (Rh(ss) * 0.95 + H * v * (1 - 0.35 * u)), c[2], tip(v)]; });
  }
  upright(0.33, 0.46, 0.50, 58, 1);                              // first dorsal
  upright(0.72, 0.78, 0.81, 15, 1);                              // second dorsal
  upright(0.73, 0.79, 0.82, 14, -1);                             // anal
  var dl = 0.9 - 0.45 * P.pect + 0.06 * Math.sin(T * 1.3);
  for (g = -1; g <= 1; g += 2) {
    (function (g) {
      var ca = mid(0.43), ea = side(0.43), out = Rw(0.43) + 80 * Math.cos(dl), dn = -Rh(0.43) * 0.5 - 80 * Math.sin(dl);
      var apex = [ca[0] + ea[0] * g * out, ca[1] + dn, ca[2] + ea[1] * g * out];
      fin(34, 18, function (u, v) {                               // pectorals
        var r = sp(0.21 + 0.10 * u, g > 0 ? -0.62 : Math.PI + 0.62, 0.98);
        return [r[0] + (apex[0] - r[0]) * v, r[1] + (apex[1] - r[1]) * v, r[2] + (apex[2] - r[2]) * v, tip(v)];
      });
      var cp = mid(0.58), ep = side(0.58);                        // pelvics
      fin(14, 10, function (u, v) {
        var r = sp(0.55 + 0.06 * u, g > 0 ? -1.0 : Math.PI + 1.0, 0.98);
        return [r[0] + 14 * v, r[1] - 14 * v, r[2] + ep[1] * g * 10 * v, 0.9];
      });
    })(g);
  }
  var c1 = mid(1), h1 = Rh(1);                                   // heterocercal caudal: the long upper lobe carries the spine
  var edge = crv([[66, 66, 0], [48, 36, 0], [32, 6, 0], [40, -18, 0], [42, -38, 0]]);
  fin(60, 18, function (u, v) {
    var e = edge(u), ry = h1 * 0.9 * (1 - 2 * u), lag = P.swim * 16 * Math.sin(5.2 - beat - 0.8) * v;
    var b = (v > 0.8 && (u < 0.12 || u > 0.9)) ? 0.85 + 1.7 * P.tip : (v > 0.94 ? 1.4 : 0.85);
    return [c1[0] + e[0] * v, c1[1] + ry + (e[1] - ry) * v, c1[2] + lag, b];
  });
}

function moray(st, P, T) {
  var s3 = st.step, i, k, g;
  var path = function (u) {
    return [56 * P.swim * Math.sin(u * 5.0 - T * 1.7) * Math.pow(u, 0.65),
            24 * P.swim * Math.sin(u * 3.2 - T * 1.35) * u - 4,
            -172 + 344 * u];
  };

    ux.font = '600 ' + Math.round(H * 0.11) + 'px ' + serif; ux.fillText(overlayCard.title, W / 2, H * 0.46);
    ux.font = 'italic ' + Math.round(H * 0.036) + 'px ' + serif; ux.fillStyle = '#c9d2d2'; ux.fillText(overlayCard.sub, W / 2, H * 0.46 + H * 0.075);
  }
  ux.globalAlpha = 1; ux.textAlign = 'left';
  if (!player || player.dead > 0 || game.state !== 'play' || !VPm) { $('#dread').style.opacity = 0; return; }

  var W = ui.width, H = ui.height, pad = 34 * dpr, hunters = [], prey = [];
  agents.forEach(function (a) {
    if (a.dead > 0) return;
    var d = dist(a.pos, player.pos);

  });

        hunt ? ux.stroke() : ux.fill();
      } else {
        var dx = s.x - cx, dy = s.y - cy; if (s.behind) { dx = -dx; dy = -dy; if (Math.abs(dx) + Math.abs(dy) < 1) dy = 1; }
        var t = Math.min((W / 2 - pad) / Math.abs(dx || 1e-3), (H / 2 - pad) / Math.abs(dy || 1e-3)), ex = cx + dx * t, ey = cy + dy * t, an = Math.atan2(dy, dx);

        ux.moveTo(sz, 0); ux.lineTo(-sz * 0.7, sz * 0.75); ux.lineTo(-sz * 0.3, 0); ux.lineTo(-sz * 0.7, -sz * 0.75); ux.closePath(); ux.fill(); ux.restore();

  draw(prey, 'rgba(224,167,94,0.9)', false);

  ux.globalAlpha = 1;

}

/* ================================================================== sound: all synthesized, no files */
var AC = null, master = null, muted = true, beatT = 0;
function audioInit() {

  var n = AC.sampleRate * 4, buf = AC.createBuffer(1, n, AC.sampleRate), ch = buf.getChannelData(0), last = 0;
  for (var i = 0; i < n; i++) { last = (last + 0.02 * (Math.random() * 2 - 1)) / 1.02; ch[i] = last * 3.5; }   // brown noise: the sea
  var src = AC.createBufferSource(); src.buffer = buf; src.loop = true;
  var lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 380;
  var g = AC.createGain(); g.gain.value = 0.22; src.connect(lp); lp.connect(g); g.connect(master); src.start();
  var lfo = AC.createOscillator(), lg = AC.createGain(); lfo.frequency.value = 0.08; lg.gain.value = 160; lfo.connect(lg); lg.connect(lp.frequency); lfo.start();
}

var events = [];
function logEv(k, v) { events.push({ t: now, k: k, v: v || 1 }); if (events.length > 4000) events.shift(); }
function sfx(k) {
  logEv(k);
  if (k === 'chomp') { tone('sine', 520, 180, 0.12, 0.35); tone('triangle', 900, 300, 0.06, 0.12, 0.02); }
  else if (k === 'eaten') { tone('sine', 110, 38, 0.6, 0.6); tone('sawtooth', 70, 30, 0.4, 0.08); }
  else if (k === 'flare') { tone('triangle', 300, 1200, 0.35, 0.18); }
  else if (k === 'dart') { tone('sine', 400, 900, 0.2, 0.2); }
  else if (k === 'puff') { tone('sine', 160, 420, 0.3, 0.2); }
  else if (k === 'ink') { tone('sine', 220, 70, 0.5, 0.3); tone('triangle', 140, 60, 0.4, 0.12, 0.05); }
  else if (k === 'lunge') { tone('sawtooth', 180, 520, 0.18, 0.12); tone('sine', 300, 700, 0.15, 0.2); }
  else if (k === 'tuck') { tone('sine', 300, 120, 0.25, 0.25); }
  else if (k === 'sting') { tone('square', 1200, 900, 0.12, 0.06); tone('square', 1500, 1100, 0.1, 0.05, 0.08); }
  else if (k === 'close') { tone('triangle', 660, 990, 0.18, 0.18); }
  else if (k === 'win') { [0, 0.12, 0.24].forEach(function (d, i) { tone('sine', [523, 659, 784][i], [523, 659, 784][i], 0.35, 0.22, d); }); }
}
var lastBeatNow = 0;
function heartbeat(danger) {
  var dt = now - lastBeatNow; lastBeatNow = now;
  if (danger <= 0) { beatT = 0; return; }
  beatT -= dt;
  if (beatT <= 0) { beatT = 0.95 - 0.5 * danger; logEv('beat', danger); tone('sine', 62, 40, 0.16, 0.25 + 0.4 * danger); tone('sine', 58, 38, 0.14, 0.18 + 0.3 * danger, 0.18); }
}
$('#mute').addEventListener('click', function () {
  audioInit(); muted = !muted; if (master) master.gain.value = muted ? 0 : 0.8;
  this.textContent = muted ? 'off' : 'on'; this.setAttribute('aria-label', muted ? 'Sound off' : 'Sound on');
});

/* ================================================================== progress (this browser only) */
var SAVE = 'benthos-reef-v1', progress = {};
try { progress = JSON.parse(localStorage.getItem(SAVE) || '{}') || {}; } catch (e) { progress = {}; }
function starsOf(sp, l) { return (progress[sp] && progress[sp][l]) || 0; }
function setStars(sp, l, s) { progress[sp] = progress[sp] || [0, 0, 0]; progress[sp][l] = Math.max(progress[sp][l] || 0, s); try { localStorage.setItem(SAVE, JSON.stringify(progress)); } catch (e) {} }

/* ================================================================== loop */
var last = performance.now(), fps = 60, hudT = 0, showPerf = /perf/.test(location.hash);
var manual = false, pilot = null;
function frame(t) {
  if (manual) return;

  fps += (1 / Math.max(dt, 1e-3) - fps) * 0.05;
  tick(dt, true);
  requestAnimationFrame(frame);
}
function tick(dt, draw) {
  now += dt;
  scenery.forEach(function (o) { if (o.d.K > 1) o.frame = (o.frame + dt / o.d.per * o.d.K) % o.d.K; });
  for (var i = fx.length - 1; i >= 0; i--) { var f = fx[i]; f.age += dt; f.frame = Math.min(f.d.K - 1.001, f.age / f.life * (f.d.K - 1)); if (f.age > f.life) fx.splice(i, 1); }
  swarms.forEach(function (s) { s.t -= dt; if (s.t <= 0 || !s.wp) { s.t = 6 + Math.random() * 6; s.wp = randWater({ y: [140, 420] }); } s.c = add(s.c, scl(nrm(sub(s.wp, s.c)), 14 * dt)); });
  var all = everyone();
  for (i = 0; i < agents.length; i++) think(agents[i], dt, all);
  if (player && game.state === 'play') {
    var wasPuff = player.morph > 0.5;
    if (pilot) pilot(dt);
    updatePlayer(dt);
    if (!wasPuff && player.morph > 0.5) sfx('puff');
    game.time -= dt;
    if (game.time <= 0) endRound();

function heartbeatOnly() {                              // keep danger-driven sound events flowing when not drawing
  if (!player || player.dead > 0 || game.state !== 'play') return;
  var best = 1e9; agents.forEach(function (a) { if (a.target === player) best = Math.min(best, dist(a.pos, player.pos)); });
  heartbeat(best < 1e9 ? clamp(1 - best / 500, 0, 1) : 0);
}
function hud() {
  $('#perf').hidden = !showPerf;
  if (showPerf) $('#perf').innerHTML = '<b>' + Math.round(fps) + '</b> fps<br><b>' + Math.round(stats.pts / 1000) + 'k</b> points<br><b>' + stats.draws + '</b> draws';
  if (!player || game.state === 'menu') return;
  var s = Math.max(0, Math.ceil(game.time)), goal = GOALS[game.species][game.level];
  $('#clock').textContent = Math.floor(s / 60) + ':' + ('0' + s % 60).slice(-2);
  $('#goaltxt').textContent = game.score + ' of ' + goal + ' points';
  $('#goalbar').style.width = Math.min(100, game.score / goal * 100) + '%';
  $('#goal').classList.toggle('done', game.score >= goal);
  var hunted = null;
  if (player.dead <= 0) agents.forEach(function (a) { if (a.target === player && dist(a.pos, player.pos) < 420) hunted = a.d.name; });
  var h = $('#hunted'); h.textContent = hunted ? 'A ' + hunted + ' is after you' : ''; h.classList.toggle('on', !!hunted);
  var z = player.dead <= 0 ? hideZone(player) : null, hz = $('#hidden');
  hz.textContent = z ? 'Safe in the ' + (z.type === 'cave' ? 'cave' : z.type) : player.morph > 0.6 ? 'Too spiky to swallow' : player.flare > 0 ? 'Spines out' : player.tuck > 0 ? 'Tucked in' : inInk(player) ? 'Hidden in ink' : '';
  hz.classList.toggle('on', !!hz.textContent);
  var ab = player.ab, btn = $('#ability'), p;
  if (player.d.id === 'pufferfish') { p = ab.meter; btn.classList.toggle('on', player.morph > 0.5); btn.classList.toggle('wait', ab.meter < 0.05); }
  else { var cdMax = { lionfish: 9, clownfish: 6, octopus: 8, moray: 2.4, seaturtle: 7 }[player.d.id]; p = 1 - ab.cd / cdMax; btn.classList.toggle('on', ab.t > 0 || player.flare > 0 || player.tuck > 0); btn.classList.toggle('wait', ab.cd > 0); }
  btn.style.setProperty('--p', p.toFixed(3));
  $('#dash').style.setProperty('--p', player.stam.toFixed(3));
}

/* ================================================================== rounds */
function startRound() {
  audioInit();
  LV = LEVELS[game.level]; DEEP = LV.deep; SHAL = LV.shal;
  game.state = 'play'; game.time = 60; game.score = 0; game.ate = {}; game.deaths = []; game.combo = 0; game.bestCombo = 0; game.lastEat = -9; game.t0 = now;
  toasts.length = 0; fx.length = 0; events.length = 0; logEv('start');
  swarms.length = 0; for (var i = 0; i < 3; i++) swarms.push({ c: randWater({ y: [160, 380] }), wp: null, t: 0 });
  newPlayer(game.species); populate(LV.mix);
  var mv = PLAYABLE.filter(function (o) { return o.id === game.species; })[0];
  $('#ability').textContent = mv.move.toLowerCase(); $('#ability').setAttribute('aria-label', mv.move);
  eye = add(player.pos, [0, 80, 300]); ctr = player.pos.slice();
  $('#menu').hidden = true; $('#over').hidden = true; document.body.classList.add('playing');
  hud();
}
function endRound() {
  game.state = 'over'; game.time = 0; snapNext = true;
  var goal = GOALS[game.species][game.level], passed = game.score >= goal;
  var stars = passed ? 1 + (game.score >= Math.ceil(goal * 1.5) ? 1 : 0) + (game.deaths.length === 0 ? 1 : 0) : 0;
  game.stars = stars; if (stars) setStars(game.species, game.level, stars);
  if (passed) sfx('win'); else logEv('end');
  $('#resTitle').textContent = passed ? LV.name + ' cleared' : 'Not quite';
  $('#stars').innerHTML = [0, 1, 2].map(function (i) { return i < stars ? '★' : '<s>★</s>'; }).join('');
  $('#score').textContent = game.score + ' of ' + goal + ' points as a ' + SP[game.species].name + '.';
  var parts = Object.keys(game.ate).map(function (k) { var nm = SP[k].name; return game.ate[k] + ' ' + nm + (game.ate[k] > 1 && !/fish|shrimp/.test(nm) ? 's' : ''); });
  var html = '<div>' + (parts.length ? 'Ate ' + parts.join(', ') + '.' : 'Ate nothing this time.') + '</div>';
  if (game.bestCombo > 1) html += '<div>Best combo ×' + Math.min(3, game.bestCombo) + '.</div>';
  html += game.deaths.length ? '<div>Eaten ' + (game.deaths.length === 1 ? 'once' : game.deaths.length + ' times') + ', ' + game.deaths.map(function (x) { var s = Math.max(1, Math.round(x.at)); return 'by a ' + x.by + ' ' + s + 's in'; }).join(', ') + '.</div>' : '<div>Nothing caught you.</div>';
  if (!passed) html += '<div>Stars start at ' + goal + ' points. The third star is for not getting eaten.</div>';

function showMenu() {

  renderMenu();
}

/* ================================================================== result card: a picture worth posting */
var downloads = null;
if (window.claude && window.claude.use) window.claude.use('downloads').then(function (d) { downloads = d; $('#card').hidden = !d; }).catch(function () { $('#card').hidden = true; });
$('#card').hidden = true;
function makeCard() {
  var W = 1080, H = 1350, c = document.createElement('canvas'); c.width = W; c.height = H; var g = c.getContext('2d');
  g.fillStyle = '#031018'; g.fillRect(0, 0, W, H);
  if (snap) { var s = Math.max(W / snap.width, H / snap.height); g.drawImage(snap, (W - snap.width * s) / 2, (H - snap.height * s) / 2, snap.width * s, snap.height * s); }

  g.fillStyle = '#eae6dc'; g.font = 'italic 44px ' + serif; g.fillText('Benthos reef', 72, 110);
  g.fillStyle = '#e0a75e'; g.font = '120px ' + serif; g.fillText([0, 1, 2].map(function (i) { return i < game.stars ? '★' : '☆'; }).join(' '), 66, H - 390);
  g.fillStyle = '#eae6dc'; g.font = '600 76px ' + serif; g.fillText(game.score + ' points', 72, H - 270);
  g.font = 'italic 44px ' + serif; g.fillStyle = '#c9d2d2';
  g.fillText('as a ' + SP[game.species].name + ', ' + LV.name.toLowerCase() + ' reef', 72, H - 200);
  g.font = '34px ' + serif; g.fillStyle = '#9eabac';
  g.fillText(game.deaths.length ? 'Eaten by a ' + game.deaths[game.deaths.length - 1].by + '. Came back anyway.' : 'Nothing caught me.', 72, H - 140);
  g.fillText('Every animal is a few dozen lines of trigonometry.', 72, H - 86);

}
$('#card').addEventListener('click', function () {
  if (!downloads) return;
  var msg = $('#saved'); msg.textContent = 'Preparing…';
  makeCard().then(function (blob) {
    return downloads.save({ filename: 'benthos-reef-' + game.species + '-' + LV.name.toLowerCase() + '.png', data: blob });
  }).then(function () { msg.textContent = 'Card saved.'; }).catch(function (e) {
    msg.textContent = e && e.code === 'declined' ? '' : 'Saving isn’t available here.';
  });

/* ================================================================== controls */
document.querySelectorAll('.cams button').forEach(function (b) { b.addEventListener('click', function () { setCam(b.dataset.cam); }); });
function setCam(c) { cam = c; document.querySelectorAll('.cams button').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.cam === c)); }); }
window.addEventListener('keydown', function (e) {
  if (e.repeat && e.code === 'KeyE') return;
  keys[e.code] = true;
  if (e.code === 'Digit1') setCam('chase'); if (e.code === 'Digit2') setCam('side'); if (e.code === 'Digit3') setCam('top');
  if (e.code === 'KeyE') useAbility(true);

});

var jEl = $('#joy');
cv.addEventListener('pointerdown', function (e) {
  if (joy) { dashing = true; return; }
  joy = { id: e.pointerId, x: e.clientX, y: e.clientY };
  jEl.style.left = e.clientX + 'px'; jEl.style.top = e.clientY + 'px'; jEl.style.display = 'block';
  cv.setPointerCapture(e.pointerId);
});
cv.addEventListener('pointermove', function (e) {
  if (!joy || e.pointerId !== joy.id) return;
  var dx = (e.clientX - joy.x) / 56, dy = -(e.clientY - joy.y) / 56, l = Math.hypot(dx, dy);
  if (l > 1) { dx /= l; dy /= l; }

});
function release(e) {
  if (joy && e.pointerId === joy.id) { joy = null; input = [0, 0]; jEl.style.display = 'none'; jEl.firstElementChild.style.transform = ''; }
  else dashing = false;
}
cv.addEventListener('pointerup', release); cv.addEventListener('pointercancel', release);

holdBtn($('#ability'), function () { useAbility(true); }, function () { useAbility(false); });
$('#go').addEventListener('click', startRound);
$('#again').addEventListener('click', startRound);

$('#back').addEventListener('click', showMenu);
if (matchMedia('(pointer:fine)').matches) $('#howto').textContent = 'Arrow keys or WASD to steer, space to sprint, E for your animal’s move. Keys 1, 2 and 3 switch between chase, side and top views.';

function renderMenu() {
  var ch = $('#choices'); ch.innerHTML = '';

    var b = document.createElement('button'); b.className = 'choice'; b.setAttribute('aria-pressed', String(o.id === game.species));

  });
  var cur = PLAYABLE.filter(function (o) { return o.id === game.species; })[0];
  $('#about').textContent = cur.about + ' Its move, ' + cur.move.toLowerCase() + ', ' + cur.hint + '.';
  var lv = $('#levels'); lv.innerHTML = '';

    b.innerHTML = '<b>' + L.name + '</b><small>' + (open ? GOALS[game.species][i] + ' points, ' + L.note : 'clear ' + LEVELS[i - 1].name.toLowerCase() + ' first') + '</small><span class="st">' +
      [0, 1, 2].map(function (k) { return k < s ? '★' : '☆'; }).join('') + '</span>';

}

/* ================================================================== boot */
(async function boot() {
  renderMenu();
  var ids = Object.keys(SP), t0 = performance.now(), bytes = 0;
  for (var i = 0; i < ids.length; i++) {
    var d = SP[ids[i]];
    d.tex = bake(d, d.P);
    if (d.alt) d.tex2 = bake(d, Object.assign({}, d.P, d.alt), d);
    $('#load').style.width = ((i + 1) / ids.length * 100) + '%';
    $('#go').textContent = 'Preparing ' + (d.name || ids[i]) + '…';
    await new Promise(function (r) { setTimeout(r, 0); });
  }
  window.__bake = { ms: Math.round(performance.now() - t0) };
  for (i = 0; i < 3; i++) swarms.push({ c: randWater({ y: [160, 380] }), wp: null, t: 0 });
  buildReef(); populate(LEVELS[0].mix);
  game.state = 'menu'; $('#go').disabled = false; $('#go').textContent = 'Dive in';
  if (window.__manualBoot) manual = true;
  requestAnimationFrame(frame);
})();

window.__game = { get player() { return player; }, game: game, agents: agents, zones: zones, SP: SP, setCam: setCam, start: startRound, end: endRound, stats: function () { return stats; },
  fps: function () { return fps; }, input: function (x, y) { input = [x, y]; }, dash: function (b) { dashing = b; }, ability: useAbility, card: makeCard,
  manual: function () { manual = true; }, step: function (dt, n, draw) { for (var i = 0; i < n; i++) tick(dt, draw && i === n - 1); },
  setPilot: function (f) { pilot = f; }, overlay: function (o) { overlayCard = o; }, events: events, get now() { return now; },
  hidden: function () { return player ? hideZone(player) || (inInk(player) ? 'ink' : null) : null; }, immune: function () { return player ? immune(player) : false; },
  canHide: canHide, dist: dist };
})();
