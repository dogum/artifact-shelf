:root {
  --c-paper: #d8ddd2; --c-ident: #3a4742; --c-keyword: #8c2d40;
  --c-type: #1f5a86; --c-string: #86610c; --c-number: #a04d10;
  --c-comment: #7c8982; --c-punct: #56645e; --c-space: transparent;
  --c-worm: #c4665f; --c-weevil: #6e4220; --c-beetle: #134a3d;
  --c-moth: #9d8b68; --c-ring: #26332e;
  --c-jumper: #2a2431; --c-weaver: #9a5a22; --c-web: #fdfff9;
  --c-egg: #f2eee0;
  --c-lamp: rgba(255, 218, 150, 0.6); --c-lampfade: rgba(255, 218, 150, 0);
  --card: rgba(232, 236, 227, 0.94); --rule: rgba(38, 51, 46, 0.28);
  --text: #1f2a26; --muted: #56645e;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --c-paper: #131917; --c-ident: #a1aea6; --c-keyword: #f08d99;
    --c-type: #8cc2ec; --c-string: #e3c16a; --c-number: #f2a26a;
    --c-comment: #5d6d65; --c-punct: #7c8b84;
    --c-worm: #f0a09a; --c-weevil: #d8a56b; --c-beetle: #5fd3b0;
    --c-moth: #ebdfc4; --c-ring: #cbd6cf;
    --c-jumper: #c7b6ea; --c-weaver: #eb9f5c; --c-web: #e6eee8;
    --c-egg: #efe8d4;
    --c-lamp: rgba(255, 200, 120, 0.2); --c-lampfade: rgba(255, 200, 120, 0);
    --card: rgba(23, 30, 27, 0.92); --rule: rgba(203, 214, 207, 0.22);
    --text: #dfe7e2; --muted: #93a39b;
  }
}
:root[data-theme="dark"] {
  --c-paper: #131917; --c-ident: #a1aea6; --c-keyword: #f08d99;
  --c-type: #8cc2ec; --c-string: #e3c16a; --c-number: #f2a26a;
  --c-comment: #5d6d65; --c-punct: #7c8b84;
  --c-worm: #f0a09a; --c-weevil: #d8a56b; --c-beetle: #5fd3b0;
  --c-moth: #ebdfc4; --c-ring: #cbd6cf;
  --c-jumper: #c7b6ea; --c-weaver: #eb9f5c; --c-web: #e6eee8;
  --c-egg: #efe8d4;
  --c-lamp: rgba(255, 200, 120, 0.2); --c-lampfade: rgba(255, 200, 120, 0);
  --card: rgba(23, 30, 27, 0.92); --rule: rgba(203, 214, 207, 0.22);
  --text: #dfe7e2; --muted: #93a39b;
}
body { margin: 0; background: var(--c-paper); color: var(--text); }
.inf { position: relative; }
.inf-host { position: relative; }
.inf-glass {
  position: sticky; top: 0; display: block; touch-action: pan-y;
  cursor: crosshair;
}
.notes {
  position: fixed; z-index: 2; left: 12px; right: 12px;
  top: calc(12px + env(safe-area-inset-top, 0px));
  background: var(--card); color: var(--text);
  border: 1px solid var(--rule); outline: 1px solid var(--rule);
  outline-offset: 3px; border-radius: 2px;
  padding: 14px 16px 12px; backdrop-filter: blur(6px);
  font-family: "Instrument Serif", Georgia, "Times New Roman", serif;
  max-height: calc(100vh - 40px); overflow: auto;
}
.notes-head { display: flex; align-items: baseline; gap: 12px; }
.notes h1 {
  margin: 0; font-weight: 400; font-size: 30px; line-height: 1;
  letter-spacing: -0.01em; flex: 1;
}
.notes-body { display: none; }
.notes.is-open .notes-body { display: block; }
.notes-toggle {
  font: inherit; font-size: 15px; background: none; border: 0;
  color: var(--muted); cursor: pointer; padding: 4px 0;
  text-decoration: underline; text-underline-offset: 3px;
}
.lede { font-size: 18px; line-height: 1.35; margin: 12px 0 14px; }
.roster { list-style: none; margin: 0; padding: 0; }
.roster li {
  display: grid; grid-template-columns: 48px 1fr auto;
  grid-template-rows: auto auto; column-gap: 10px; row-gap: 2px;
  padding: 9px 0; border-top: 1px solid var(--rule); align-items: center;
}
.specimen { width: 44px; height: 30px; grid-row: 1 / span 2; }
.names { display: flex; flex-direction: column; line-height: 1.1; }
.common { font-size: 18px; }
.latin { font-size: 15px; color: var(--muted); }

    } else if (c === '/' && next === '*') {
      const end = src.indexOf('*/', i + 2);
      take(end < 0 ? src.length : end + 2, 'comment');
    } else if (c === '"' || c === "'" || c === BACKTICK) {
      let j = i + 1;
      while (j < src.length && src[j] !== c) {
        if (src[j] === '\\n' && c !== BACKTICK) break;
        j += src[j] === '\\\\' ? 2 : 1;
      }
      take(Math.min(j + 1, src.length), 'string');
    } else if (/\\s/.test(c)) {
      take(scan(i, /\\s/), 'space');
    } else if (/[0-9]/.test(c)) {
      take(scan(i, /[\\w.]/), 'number');
    } else if (/[A-Za-z_$]/.test(c)) {
      const end = scan(i, /[\\w$]/);
      const word = src.slice(i, end);
      const kind: TokenKind = KEYWORDS.has(word) ? 'keyword'
        : TYPE_WORDS.has(word) || /^[A-Z]/.test(word) ? 'type' : 'ident';
      take(end, kind);
    } else {
      take(i + 1, 'punct');
    }
  }
  return out;
}

// \u2500\u2500 Glyphs \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
// A glyph is one printed character of the source. Its state is a tagged
// union, so a glyph cannot be "loose" without also having a velocity.

type GlyphState =
  | { tag: 'home' }
  | { tag: 'loose'; x: number; y: number; vx: number; vy: number;
      rot: number; vr: number }            // screen space, falling
  | { tag: 'piled'; x: number; y: number; rot: number } // screen space
  | { tag: 'lost' }                      // eaten somewhere off screen
  | { tag: 'flying'; x0: number; y0: number; r0: number; lift: number;
      t: number; delay: number; x: number; y: number; rot: number };

interface Glyph {
  ch: string;
  kind: Food;
  line: number; col: number;   // position in the file
  vrow: number; vcol: number;  // position after wrapping
  hx: number; hy: number;      // home, in world pixels
  s: GlyphState;
}

const HOME: GlyphState = { tag: 'home' };

interface Parsed {
  glyphs: Glyph[];
  lineLengths: number[];
  byKind: Record<TokenKind, number[]>;
}

function parse(src: string): Parsed {
  const glyphs: Glyph[] = [];
  const lineLengths: number[] = [];
  let line = 0;
  let col = 0;
  for (const tok of tokenize(src.replace(/\\t/g, '  '))) {
    for (const ch of tok.text) {
      if (ch === '\\n') { lineLengths.push(col); line++; col = 0; continue; }
      if (ch !== ' ' && tok.kind !== 'space') {
        glyphs.push({ ch, kind: tok.kind, line, col, vrow: 0, vcol: 0,
          hx: 0, hy: 0, s: HOME });
      }
      col++;
    }
  }
  lineLengths.push(col);
  const byKind = Object.fromEntries(
    TOKEN_KINDS.map((k) => [k, [] as number[]]),
  ) as Record<TokenKind, number[]>;
  glyphs.forEach((g, i) => byKind[g.kind].push(i));
  return { glyphs, lineLengths, byKind };
}

// \u2500\u2500 Bugs \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500

interface BugCore {
  id: number;
  x: number; y: number;  // world pixels
  heading: number;
  energy: number;
  gait: number;          // animation phase
  target: number;        // glyph index being approached, or -1
  chewing: number;       // seconds spent on the current bite
  think: number;         // seconds until it looks around again
  startle: number;       // seconds of alarm left after noticing a hunter
  flee: number;          // direction to run while alarmed
  moving: boolean;       // jumping spiders only see things that move
  playingDead: boolean;
  genes: Traits;
  appetite: Record<Food, number>;
  gen: number;           // generations since the first arrivals
  strain: StrainKey;
  mark: Food | null;     // a diet dot, drawn on bugs of a new strain
  age: number;
  lifespan: number;
}

export type Bug =
  | (BugCore & { species: 'beetle' })
  | (BugCore & { species: 'weevil' })
  | (BugCore & { species: 'moth'; orbit: number })
  | (BugCore & { species: 'worm'; body: Float32Array });

type BugOf<S extends Species> = Extract<Bug, { species: S }>;

function isSpecies<S extends Species>(b: Bug, s: S): b is BugOf<S> {
  return b.species === s;
}

function makeBug(
  id: number, species: Species, x: number, y: number,
  heading: number, u: number, dna?: Dna,
): Bug {
  const genes = dna?.genes ?? ancestralTraits(species);
  const appetite = dna?.appetite ?? ancestralAppetite(species);
  const food = strainFood(species, appetite);
  const strain: StrainKey = food ? \`\${species}:\${food}\` : species;
  const core: BugCore = {
    id, x, y, heading, energy: 3, gait: rand(0, TAU),
    target: -1, chewing: 0, think: rand(0, 0.4),
    startle: 0, flee: 0, moving: true, playingDead: false,
    genes, appetite, gen: dna?.gen ?? 0, strain,
    mark: food, age: 0, lifespan: SPECIES[species].lifespan * rand(0.8, 1.2),
  };
  u *= genes.size;
  switch (species) {
    case 'beetle': return { ...core, species };
    case 'weevil': return { ...core, species };
    case 'moth': return { ...core, species, orbit: rand(0, TAU) };
    case 'worm': {
      const body = new Float32Array(WORM_SEGMENTS * 2);
      for (let i = 0; i < WORM_SEGMENTS; i++) {
        body[2 * i] = x - Math.cos(heading) * i * u * 0.5;
        body[2 * i + 1] = y - Math.sin(heading) * i * u * 0.5;
      }
      return { ...core, species, body };
    }
    default: return assertNever(species);
  }
}

// \u2500\u2500 Spiders \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500

type JumperMode =
  | { m: 'prowl'; hop: number }                 // stop-start walking
  | { m: 'stalk'; prey: number }                // creeping up on a bug id
  | { m: 'crouch'; prey: number; t: number }    // gathering for the jump
  | { m: 'leap'; prey: number; x0: number; y0: number;
      x1: number; y1: number; t: number; dur: number }
  | { m: 'feed'; meal: Bug; t: number }
  | { m: 'rest'; t: number };

type WeaverMode =
  | { m: 'roam'; t: number }                    // looking for a site
  | { m: 'spin'; web: Web }
  | { m: 'wait'; web: Web; idle: number }       // head down on the hub
  | { m: 'fetch'; web: Web; prey: number }
  | { m: 'wrap'; web: Web; meal: Bug; t: number };

interface SpiderCore {
  id: number;
  x: number; y: number;
  heading: number;
  energy: number;
  gait: number;
  grown: number;   // 0.45 as a spiderling, 1 as an adult
  genes: SpiderGenes;
  gen: number;
  age: number;
  lifespan: number;
}

export type Spider =
  | (SpiderCore & { kind: 'jumper'; mode: JumperMode })
  | (SpiderCore & { kind: 'weaver'; mode: WeaverMode });

type SpiderOf<K extends PredatorKind> = Extract<Spider, { kind: K }>;

interface Web {
  id: number;
  x: number; y: number; r: number;
  spokes: number;
  seed: number;
  built: number;    // spinning progress, 0 to 1
  health: number;   // 1 when fresh; the web is gone at 0
  owner: number;    // spider id, or -1 once abandoned
  silk: number;     // stickiness, inherited from the spinner
  stuck: { bug: Bug; t: number }[];
}

interface EggSac {
  x: number; y: number;
  kind: PredatorKind;
  genes: SpiderGenes;
  gen: number;
  t: number; hatchAt: number;
  energy: number;   // shared out among the spiderlings
}

function makeSpider(
  id: number, kind: PredatorKind, x: number, y: number, grown = 1,
  genes: SpiderGenes = ANCESTRAL_SPIDER, gen = 0,
): Spider {
  const core: SpiderCore = {
    id, x, y, heading: rand(0, TAU), energy: 6, gait: rand(0, TAU), grown,
    genes: { ...genes }, gen,
    age: 0, lifespan: PREDATORS[kind].lifespan * rand(0.8, 1.2),
  };
  switch (kind) {
    case 'jumper': return { ...core, kind, mode: { m: 'prowl', hop: rand(0, 1) } };
    case 'weaver': return { ...core, kind, mode: { m: 'roam', t: rand(2, 5) } };
    default: return assertNever(kind);
  }
}

type Effect =
  | { kind: 'pin'; bug: Bug; t: number }
  | { kind: 'husk'; bug: Bug; t: number }
  | { kind: 'pin-spider'; spider: Spider; t: number }
  | { kind: 'spider-husk'; spider: Spider; t: number }
  | { kind: 'silk'; x0: number; y0: number; x1: number; y1: number; t: number }
  | { kind: 'ripple'; x: number; y: number; t: number };

// Indexed access on a union: Effect['kind'] is the union of its tags.
const EFFECT_LIFE: Record<Effect['kind'], number> = {
  pin: 2.2, husk: 2.2, 'pin-spider': 2.2, 'spider-husk': 3,
  silk: 6, ripple: 0.6,
};

interface LogEntry { t: number; text: string }

interface Strain {
  key: StrainKey;
  species: Species;
  food: Food;
  name: string;     // Latin, e.g. Coleoptera punctivora var. nominivora
  blurb: string;    // plain English
  founded: number;
  count: number;
  peak: number;
}

type SpecimenCard =
  | { what: 'bug'; kind: Species; name: string; gen: number;
      genes: Traits; appetite: Record<Food, number>; mark: Food | null }
  | { what: 'spider'; kind: PredatorKind; name: string; gen: number;
      genes: SpiderGenes };

// \u2500\u2500 Layout \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500

interface Layout {
  W: number; viewH: number; H: number;   // canvas, viewport, world
  font: number; cw: number; lh: number; ty: number;
  cols: number; colChars: number; rows: number; gap: number;
  x0: number; y0: number; codeW: number; codeH: number;
  visualRows: number;
  u: number;          // bug drawing unit
  bin: number;        // pile column width
  pileTop: number;    // screen y where the pile canvas begins
  gravity: number;
}

function layout(
  lineLengths: readonly number[], W: number, viewH: number,
  ratio: number, docked: boolean,
): Layout {
  const left = docked ? 340 : 0;
  const top = docked ? 28 : 116;
  const pad = 20;
  const font = clamp(W / 200, 6.5, 8.5);
  const cw = font * ratio;
  const lh = Math.round(font * 1.32 * 10) / 10;
  const gap = cw * 3;
  const availW = W - left - pad * 2;
  const cols = Math.max(1, Math.floor((availW + gap) / (58 * cw + gap)));
  const colChars = Math.floor((availW - (cols - 1) * gap) / cols / cw);
  let visualRows = 0;
  for (const len of lineLengths) {
    visualRows += Math.max(1, Math.ceil(len / colChars));
  }
  const rows = Math.ceil(visualRows / cols);
  const codeW = cols * colChars * cw + (cols - 1) * gap;
  const codeH = rows * lh;
  const pileBand = Math.max(110, viewH * 0.16);
  const pileCanvasH = Math.round(viewH * 0.55);
  return {
    W, viewH, H: Math.max(viewH, top + codeH + pileBand),
    font, cw, lh, ty: (lh - font) / 2 + font * 0.08,
    cols, colChars, rows, gap,
    x0: left + pad + Math.max(0, (availW - codeW) / 2), y0: top,
    codeW, codeH, visualRows,
    u: cw * 1.5, bin: Math.max(3, cw),
    pileTop: viewH - pileCanvasH, gravity: lh * 70,
  };
}

// Wrapping changes which visual row a glyph lands on, so the cell index
// (row, column) -> glyph is rebuilt whenever the layout changes.
function flow(p: Parsed, L: Layout): Int32Array {
  const firstRow: number[] = [];
  let r = 0;
  for (const len of p.lineLengths) {
    firstRow.push(r);
    r += Math.max(1, Math.ceil(len / L.colChars));
  }
  const cells = new Int32Array(r * L.colChars).fill(-1);
  p.glyphs.forEach((g, i) => {
    g.vrow = firstRow[g.line] + Math.floor(g.col / L.colChars);
    g.vcol = g.col % L.colChars;
    const block = Math.floor(g.vrow / L.rows);
    const row = g.vrow - block * L.rows;
    g.hx = L.x0 + block * (L.colChars * L.cw + L.gap) + g.vcol * L.cw;
    g.hy = L.y0 + row * L.lh;
    cells[g.vrow * L.colChars + g.vcol] = i;
  });
  return cells;
}

// \u2500\u2500 World \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500

const COLOR_ROLES = [
  ...TOKEN_KINDS, ...SPECIES_LIST, ...PREDATOR_LIST,
  'paper', 'lamp', 'lampfade', 'ring', 'web', 'egg',
] as const;
type Palette = Record<(typeof COLOR_ROLES)[number], string>;

function readPalette(): Palette {
  const css = getComputedStyle(document.documentElement);
  const out = {} as Palette;
  for (const role of COLOR_ROLES) {
    out[role] = css.getPropertyValue('--c-' + role).trim() || '#888';
  }
  return out;
}

interface World extends Parsed {
  L: Layout;
  cells: Int32Array;
  pools: Record<Species, number[]>; // every glyph each species could eat
  capScale: number;                  // a taller file supports more bugs
  canvas: HTMLCanvasElement;
  ctx: CanvasRenderingContext2D;
  base: HTMLCanvasElement;   // every glyph still at home, pre-rendered
  baseCtx: CanvasRenderingContext2D;
  pile: HTMLCanvasElement;   // settled debris, pre-rendered
  pileCtx: CanvasRenderingContext2D;
  dpr: number; baseDpr: number;
  pal: Palette;
  fontCss: string;
  bugs: Bug[];
  effects: Effect[];
  active: Set<number>;       // glyphs that are loose or flying
  piled: number[];
  pileH: Float32Array;
  home: Record<TokenKind, number>;
  total: Record<TokenKind, number>;
  pinned: Record<Species, number>;
  history: Record<Species, number[]>;
  spiders: Spider[];
  webs: Web[];
  eggs: EggSac[];
  caught: Record<PredatorKind, number>;
  pinnedSpiders: Record<PredatorKind, number>;
  spiderHistory: Record<PredatorKind, number[]>;
  phase: [number, number][];   // (prey, spiders), sampled once a second
  last: Record<Kind, number>;  // last census, to notice extinctions
  log: LogEntry[];
  once: Set<string>;
  mutation: number;                 // multiplies every mutation chance
  strains: Map<StrainKey, Strain>;
  maxGen: Record<Kind, number>;
  specimen: SpecimenCard | null;    // the last thing you pinned
  ateTypes: boolean;
  pointer: { x: number; y: number; inside: boolean; touch: boolean };
  cam: number;
  t: number; nextId: number;
  clocks: { sample: number; immigrate: number; hatch: number;
    spiders: number; phase: number };
  lens: boolean; paused: boolean; reducedMotion: boolean;
}

const zeroBySpecies = (): Record<Species, number> =>
  mapRecord(SPECIES, () => 0);
const zeroByPredator = (): Record<PredatorKind, number> =>
  mapRecord(PREDATORS, () => 0);

function makeCanvas(w: number, h: number, dpr: number) {
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(w * dpr));
  c.height = Math.max(1, Math.round(h * dpr));
  const ctx = c.getContext('2d');
  if (!ctx) throw new Error('2D canvas unavailable');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return [c, ctx] as const;
}

function createWorld(
  canvas: HTMLCanvasElement, source: string, prev: World | null,
): World {
  const parsed = parse(source);
  const W = document.documentElement.clientWidth;
  const viewH = window.innerHeight;
  const probe = document.createElement('canvas').getContext('2d');
  const family = '"Fragment Mono", ui-monospace, Menlo, Consolas, monospace';
  let ratio = 0.6;
  if (probe) {
    probe.font = '100px ' + family;
    ratio = probe.measureText('M').width / 100 || 0.6;
  }
  const L = layout(parsed.lineLengths, W, viewH, ratio, W >= DOCK_AT);
  const cells = flow(parsed, L);

  const dpr = Math.min(2, window.devicePixelRatio || 1);
  // Mobile Safari refuses canvases over about 16.7 million pixels.
  const baseDpr = Math.min(dpr, Math.sqrt(16e6 / (W * L.H)), 32000 / L.H);
  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(viewH * dpr);
  canvas.style.width = W + 'px';
  canvas.style.height = viewH + 'px';
  const ctx = canvas.getContext('2d');
  if (!ctx) throw new Error('2D canvas unavailable');
  const [base, baseCtx] = makeCanvas(W, L.H, baseDpr);
  const [pile, pileCtx] = makeCanvas(W, viewH - L.pileTop, dpr);

  const w: World = {
    ...parsed, L, cells, canvas,
    ctx, base, baseCtx, pile, pileCtx,
    pools: mapRecord(SPECIES,
      (spec) => spec.eats.flatMap((k) => parsed.byKind[k])),
    capScale: Math.max(1, L.H / L.viewH),
    dpr, baseDpr, pal: readPalette(),
    fontCss: L.font + 'px ' + family,
    bugs: [], effects: [], active: new Set(), piled: [],
    pileH: new Float32Array(Math.ceil(W / L.bin) + 1),
    home: mapRecord(parsed.byKind, (list) => list.length),
    total: mapRecord(parsed.byKind, (list) => list.length),
    pinned: prev?.pinned ?? zeroBySpecies(),
    history: prev?.history ?? mapRecord(SPECIES, () => [] as number[]),
    spiders: prev?.spiders ?? [],
    webs: prev?.webs ?? [],
    eggs: prev?.eggs ?? [],
    caught: prev?.caught ?? zeroByPredator(),
    pinnedSpiders: prev?.pinnedSpiders ?? zeroByPredator(),
    spiderHistory: prev?.spiderHistory
      ?? mapRecord(PREDATORS, () => [] as number[]),
    phase: prev?.phase ?? [],
    last: prev?.last ?? { ...zeroBySpecies(), ...zeroByPredator() },
    log: prev?.log ?? [],
    once: prev?.once ?? new Set(),
    mutation: prev?.mutation ?? 1.5,
    strains: prev?.strains ?? new Map(),
    maxGen: prev?.maxGen ?? { ...zeroBySpecies(), ...zeroByPredator() },
    specimen: prev?.specimen ?? null,
    ateTypes: prev?.ateTypes ?? false,
    pointer: { x: -999, y: -999, inside: false, touch: false },
    cam: 0, t: prev?.t ?? 0, nextId: prev?.nextId ?? 1,
    clocks: { sample: 0, immigrate: 0, hatch: prev ? 0 : 2.4,
      spiders: prev?.clocks.spiders ?? 32, phase: 0 },
    lens: prev?.lens ?? true,
    paused: prev?.paused ?? false,
    reducedMotion: window.matchMedia('(prefers-reduced-motion: reduce)')
      .matches,
  };
  if (!prev && w.reducedMotion) w.paused = true;

  if (prev) {
    // A resize reflows the text, which also puts every glyph back.
    w.bugs = prev.bugs;
    for (const b of w.bugs) {
      b.x = clamp(b.x, L.x0, L.x0 + L.codeW);
      b.y = clamp(b.y, L.y0, L.y0 + L.codeH);
      b.target = -1;
      if (isSpecies(b, 'worm')) {
        for (let i = 0; i < b.body.length; i += 2) {
          b.body[i] = b.x; b.body[i + 1] = b.y;
        }
      }
    }
    for (const sp of w.spiders) {
      sp.x = clamp(sp.x, L.x0, L.x0 + L.codeW);
      sp.y = clamp(sp.y, L.y0, L.y0 + L.codeH);
      if (sp.kind === 'jumper' && sp.mode.m !== 'feed') {
        sp.mode = { m: 'prowl', hop: 0.5 };
      }
    }
    paintBase(w);
  } else if (w.reducedMotion) {
    paintBase(w);
    w.clocks.hatch = 0.01;
  } else {
    // Opening move: the visible part of the file assembles itself from the
    // bottom of the glass. Anything below the fold is simply already there.
    w.glyphs.forEach((g, i) => {
      if (g.hy > viewH) return;
      w.home[g.kind]--;
      const x = clamp(g.hx + rand(-60, 60), 0, W);
      const y = viewH - rand(0, 40);
      const delay = 0.05 + ((g.hy - L.y0) / viewH) * 1.5 + rand(0, 0.15);
      g.s = { tag: 'flying', x0: x, y0: y, r0: rand(-3, 3), lift: rand(0, 50),
        t: 0, delay, x, y, rot: 0 };
      w.active.add(i);
    });
    paintBase(w);
  }
  return w;
}

function paintGlyph(
  ctx: CanvasRenderingContext2D, w: World, g: Glyph, x: number, y: number,
): void {
  ctx.fillStyle = w.pal[g.kind];
  ctx.fillText(g.ch, x, y + w.L.ty);
}

function paintBase(w: World): void {
  const { baseCtx: c, L } = w;
  c.clearRect(0, 0, L.W, L.H);
  c.font = w.fontCss;
  c.textBaseline = 'top';
  for (const kind of TOKEN_KINDS) {
    c.fillStyle = w.pal[kind];
    for (const i of w.byKind[kind]) {
      const g = w.glyphs[i];
      if (g.s.tag === 'home') c.fillText(g.ch, g.hx, g.hy + L.ty);
    }
  }
}

function bakeIntoPile(w: World, g: Glyph, x: number, y: number, rot: number) {
  const c = w.pileCtx;
  c.save();
  c.font = w.fontCss;
  c.textBaseline = 'top';
  c.translate(x + w.L.cw / 2, y - w.L.pileTop + w.L.lh / 2);
  c.rotate(rot);
  paintGlyph(c, w, g, -w.L.cw / 2, -w.L.lh / 2);
  c.restore();
}

function repaint(w: World): void {
  w.pal = readPalette();
  paintBase(w);
  w.pileCtx.clearRect(0, 0, w.L.W, w.L.viewH);
  for (const i of w.piled) {
    const s = w.glyphs[i].s;
    if (s.tag === 'piled') bakeIntoPile(w, w.glyphs[i], s.x, s.y, s.rot);
  }
}

// \u2500\u2500 Simulation \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500

function glyphAt(w: World, x: number, y: number): number {
  const L = w.L;
  const rel = x - L.x0;
  if (rel < 0 || y < L.y0) return -1;
  const stride = L.colChars * L.cw + L.gap;
  const block = Math.floor(rel / stride);
  const vcol = Math.floor((rel - block * stride) / L.cw);
  const row = Math.floor((y - L.y0) / L.lh);
  if (block >= L.cols || vcol >= L.colChars || row >= L.rows) return -1;
  const vrow = block * L.rows + row;
  if (vrow >= L.visualRows) return -1;
  return w.cells[vrow * L.colChars + vcol];
}

const edible = (w: World, b: Bug, i: number): boolean =>
  i >= 0 && w.glyphs[i].s.tag === 'home'
  && b.appetite[w.glyphs[i].kind] >= EDIBLE_AT;

function forage(w: World, b: Bug): number {
  const r = w.L.cw * 14;
  let best = -1;
  let bestD = Infinity;
  for (let k = 0; k < 16; k++) {
    const a = rand(0, TAU);
    const d = rand(0, r);
    const i = glyphAt(w, b.x + Math.cos(a) * d, b.y + Math.sin(a) * d);
    if (edible(w, b, i) && d < bestD) { best = i; bestD = d; }
  }
  if (best >= 0 || Math.random() < 0.6) return best;
  // Nothing nearby: catch a scent from somewhere else in the file.
  const foods = FOODS.filter((f) => b.appetite[f] >= EDIBLE_AT);
  for (let k = 0; k < 30 && foods.length; k++) {
    const list = w.byKind[pick(foods)];
    if (list.length === 0) continue;
    const i = pick(list);
    const g = w.glyphs[i];
    const d = Math.hypot(g.hx - b.x, g.hy - b.y);
    if (edible(w, b, i) && d < bestD) { best = i; bestD = d; }
  }
  return best;
}

function nextBite(w: World, b: Bug, i: number): number {
  const g = w.glyphs[i];
  const dir = Math.cos(b.heading) >= 0 ? 1 : -1;
  for (const dc of [dir, dir * 2, -dir, -dir * 2]) {
    const c = g.vcol + dc;
    if (c < 0 || c >= w.L.colChars) continue;
    const n = w.cells[g.vrow * w.L.colChars + c];
    if (edible(w, b, n)) return n;
  }
  return -1;
}

function dislodge(w: World, i: number, vx: number, vy: number): void {
  const g = w.glyphs[i];
  if (g.s.tag !== 'home') return;
  const L = w.L;
  w.home[g.kind]--;
  w.baseCtx.clearRect(g.hx, g.hy, L.cw, L.lh);
  const sy = g.hy - w.cam;
  if (sy < -L.lh || sy > L.viewH) {
    // Out of sight, so it never reaches the pile at the bottom of the glass.
    g.s = { tag: 'lost' };
    w.piled.push(i);
    return;
  }
  g.s = { tag: 'loose', x: g.hx, y: sy, vx, vy, rot: 0, vr: rand(-9, 9) };
  w.active.add(i);
}

function steer(b: { heading: number }, desired: number, maxTurn: number) {
  b.heading += clamp(wrapAngle(desired - b.heading), -maxTurn, maxTurn);
}

function lampTarget(w: World, b: BugOf<'moth'>, dt: number) {
  const p = w.pointer;
  if (!p.inside) return null;
  const px = p.x;
  const py = p.y + w.cam;
  if (Math.hypot(px - b.x, py - b.y) > 460) return null;
  b.orbit += dt * (2 + (b.id % 3) * 0.4);
  const r = 18 + 16 * Math.sin(w.t * 1.7 + b.id);
  return [px + Math.cos(b.orbit) * r * 1.5, py + Math.sin(b.orbit) * r] as const;
}

function moveBug(w: World, b: Bug, dt: number): void {
  const spec = SPECIES[b.species];
  const L = w.L;
  b.energy -= spec.metabolism * upkeep(b) * dt;
  b.age += dt;

  const alarmed = b.startle > 0;
  if (alarmed) {
    b.startle -= dt;
    if (b.playingDead) {
      // Playing dead: a hunter that tracks motion loses sight of it.
      b.moving = false;
      b.chewing = 0;
      return;
    }
  }

  const lamp = b.species === 'moth' && !alarmed ? lampTarget(w, b, dt) : null;
  let tx = NaN;
  let ty = NaN;
  if (lamp) {
    [tx, ty] = lamp;
    b.target = -1;
    b.chewing = 0;
  } else {
    if (b.target >= 0 && !edible(w, b, b.target)) {
      b.target = -1;
      b.chewing = 0;
    }
    b.think -= dt;
    if (b.target < 0 && b.think <= 0) {
      b.target = forage(w, b);
      b.think = rand(0.2, 0.5);
    }
    if (b.target >= 0) {
      const g = w.glyphs[b.target];
      tx = g.hx + L.cw / 2;
      ty = g.hy + L.lh / 2;
    }
  }

  let moving = true;
  if (alarmed) {
    b.target = -1;
    b.chewing = 0;
    steer(b, b.flee, 10 * dt);
  } else if (!Number.isNaN(tx)) {
    const d = Math.hypot(tx - b.x, ty - b.y);
    if (!lamp && d < L.cw * 0.8) {
      moving = false;
      b.chewing += dt;
      b.heading += Math.sin(w.t * 40 + b.id) * 1.5 * dt;
      const taste = b.appetite[w.glyphs[b.target].kind];
      if (b.chewing >= spec.chew / Math.max(EDIBLE_AT, taste)) {
        const i = b.target;
        const k = L.lh / 16;
        b.chewing = 0;
        b.energy += taste;
        b.target = nextBite(w, b, i);
        dislodge(w, i, (Math.cos(b.heading) * rand(10, 50) + rand(-25, 25)) * k,
          rand(-150, -50) * k);
      }
    } else {
      steer(b, Math.atan2(ty - b.y, tx - b.x), spec.turn * dt);
    }
  } else {
    b.heading += (Math.sin(w.t * 1.3 + b.id * 7.1) * 1.4 + rand(-1, 1)) * dt;
  }

  // Species quirks.
  if (b.species === 'moth') {
    b.heading += Math.sin(w.t * 8 + b.id) * 2.2 * dt;
  } else if (b.species === 'worm' && b.target < 0) {
    const flat = Math.cos(b.heading) >= 0 ? 0 : Math.PI;
    steer(b, flat, 0.8 * dt);
  }

  if (moving) {
    const v = spec.speed * b.genes.speed * L.cw
      * (b.energy < 1 ? 0.6 : 1) * (alarmed ? 1.9 : 1);
    b.x += Math.cos(b.heading) * v * dt;
    b.y += Math.sin(b.heading) * v * dt;
  }
  b.gait += dt * (moving ? spec.gaitRate : 1.5);
  b.moving = moving;

  const free = b.species === 'moth';
  const x0 = free ? 0 : L.x0 - L.cw * 2;
  const x1 = free ? L.W : L.x0 + L.codeW + L.cw * 2;
  const y0 = free ? 0 : L.y0 - L.lh;
  const y1 = free ? L.H : L.y0 + L.codeH + L.lh;
  if (b.x < x0 || b.x > x1) {
    b.x = clamp(b.x, x0, x1);
    b.heading = Math.PI - b.heading;
  }
  if (b.y < y0 || b.y > y1) {
    b.y = clamp(b.y, y0, y1);
    b.heading = -b.heading;
  }

  if (isSpecies(b, 'worm')) {
    const body = b.body;
    const gap = L.u * 0.5 * b.genes.size;
    body[0] = b.x;
    body[1] = b.y;
    for (let i = 2; i < body.length; i += 2) {
      const dx = body[i - 2] - body[i];
      const dy = body[i - 1] - body[i + 1];
      const d = Math.hypot(dx, dy);
      if (d > gap) {
        body[i] += dx * (d - gap) / d;
        body[i + 1] += dy * (d - gap) / d;
      }
    }
  }
}

// What it costs to be this bug, relative to its ancestors. Speed costs
// the square, size costs linearly, and eating more kinds of food than your
// ancestors did carries a digestive overhead.
function upkeep(b: Bug): number {
  const g = b.genes;
  let breadth = 0;
  for (const f of FOODS) breadth += b.appetite[f];
  const extra = Math.max(0, breadth - SPECIES[b.species].eats.length);
  return g.speed * g.speed * g.size * (1 + 0.5 * extra) * (1 + 0.15 * g.camo);
}

function census(w: World): Record<Species, number> {
  const n = zeroBySpecies();
  for (const b of w.bugs) n[b.species]++;
  return n;
}

function foodLeft(w: World, s: Species): number {
  let have = 0;
  let all = 0;
  for (const k of SPECIES[s].eats) { have += w.home[k]; all += w.total[k]; }
  return all ? have / all : 0;
}

function spawn(w: World, s: Species, x: number, y: number, h = rand(0, TAU)) {
  const b = makeBug(w.nextId++, s, x, y, h, w.L.u);
  w.bugs.push(b);
  return b;
}

// Seed the whole file, in proportion to how long it is, and make sure a
// few land where the viewer is looking.
function seed(w: World): void {
  const L = w.L;
  release(w, 2);
  for (const s of SPECIES_LIST) {
    const n = Math.round(3 * w.capScale);
    for (let k = 0; k < n; k++) {
      const pool = w.pools[s];
      const g = w.glyphs[pick(pool)];
      spawn(w, s, g ? g.hx : L.x0 + rand(0, L.codeW),
        g ? g.hy : L.y0 + rand(0, L.codeH));
    }
  }
}

// Scatter a few of each species over the part of the file you can see.
function release(w: World, perSpecies = 2): void {
  const L = w.L;
  for (const s of SPECIES_LIST) {
    for (let k = 0; k < perSpecies; k++) {
      const y = clamp(w.cam + rand(0.1, 0.8) * L.viewH, L.y0, L.y0 + L.codeH);
      spawn(w, s, L.x0 + rand(0, L.codeW), y);
    }
  }
}

function updateGlyph(w: World, i: number, dt: number): void {
  const g = w.glyphs[i];
  const s = g.s;
  const L = w.L;
  switch (s.tag) {
    case 'loose': {
      s.vy += L.gravity * dt;
      s.vx *= 1 - 0.6 * dt;
      s.x += s.vx * dt;
      s.y += s.vy * dt;
      s.rot += s.vr * dt;
      if (s.x < 0 || s.x > L.W - L.cw) {
        s.x = clamp(s.x, 0, L.W - L.cw);
        s.vx *= -0.5;
      }
      const n = w.pileH.length;
      let bin = clamp(Math.floor((s.x + L.cw / 2) / L.bin), 0, n - 1);
      if (s.y < L.viewH - w.pileH[bin] - L.lh) return;
      // Avalanche: a glyph landing on a steep column slides off it.
      for (let k = 0; k < 10; k++) {
        const left = bin > 0 ? w.pileH[bin - 1] : Infinity;
        const right = bin < n - 1 ? w.pileH[bin + 1] : Infinity;
        const low = Math.min(left, right);
        if (w.pileH[bin] - low <= L.lh * 0.9) break;
        bin += left < right ? -1 : 1;
      }
      const x = bin * L.bin;
      const y = L.viewH - w.pileH[bin] - L.lh * 0.8;
      w.pileH[bin] = Math.min(w.pileH[bin] + L.lh * 0.45,
        L.viewH - L.pileTop - L.lh);
      g.s = { tag: 'piled', x, y, rot: s.rot % TAU };
      bakeIntoPile(w, g, x, y, s.rot % TAU);
      w.piled.push(i);
      w.active.delete(i);
      return;
    }
    case 'flying': {
      s.t += dt;
      const p = clamp((s.t - s.delay) / 0.6, 0, 1);
      const e = p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
      s.x = s.x0 + (g.hx - s.x0) * e;
      s.y = s.y0 + (g.hy - s.y0) * e - Math.sin(Math.PI * p) * s.lift;
      s.rot = s.r0 * (1 - e);
      if (p < 1) return;
      g.s = HOME;
      w.home[g.kind]++;
      w.baseCtx.font = w.fontCss;
      w.baseCtx.textBaseline = 'top';
      paintGlyph(w.baseCtx, w, g, g.hx, g.hy);
      w.active.delete(i);
      return;
    }
    case 'home':
    case 'piled':
    case 'lost':
      w.active.delete(i);
      return;
    default:
      assertNever(s);
  }
}

// Every piece of debris flies home, in reading order, as if retyped.
function recompile(w: World): void {
  const L = w.L;
  const send = (i: number, x: number, y: number, rot: number): void => {
    const g = w.glyphs[i];
    const delay = 0.05 + (g.vrow / L.visualRows) * 1.2 + rand(0, 0.2);
    g.s = { tag: 'flying', x0: x, y0: y + w.cam, r0: rot, lift: rand(0, 80),
      t: 0, delay, x, y: y + w.cam, rot };
    w.active.add(i);
  };
  for (const i of w.active) {
    const s = w.glyphs[i].s;
    if (s.tag === 'loose') send(i, s.x, s.y, s.rot);
  }
  for (const i of w.piled) {
    const s = w.glyphs[i].s;
    if (s.tag === 'piled') send(i, s.x, s.y, s.rot);
    else if (s.tag === 'lost') {
      const g = w.glyphs[i];
      const above = g.hy < w.cam;
      send(i, g.hx + rand(-30, 30), above ? -rand(20, 200) : L.viewH + 20,
        rand(-3, 3));
    }
  }
  w.piled = [];
  w.pileH.fill(0);
  w.pileCtx.clearRect(0, 0, L.W, L.viewH);
}

type Hit = { what: 'bug'; i: number } | { what: 'spider'; i: number };

function tryPin(w: World, x: number, y: number): void {
  let hit: Hit | null = null;
  let bestD = (w.L.u * 3 + 14) ** 2;
  w.bugs.forEach((b, i) => {
    const d = (b.x - x) ** 2 + (b.y - y) ** 2;
    if (d < bestD) { hit = { what: 'bug', i }; bestD = d; }
  });
  w.spiders.forEach((sp, i) => {
    const d = (sp.x - x) ** 2 + (sp.y - y) ** 2;
    if (d < bestD * 1.4) { hit = { what: 'spider', i }; bestD = d; }
  });
  // TypeScript cannot see assignments made inside the callbacks above, so
  // it still believes hit is null here. The annotation corrects it.
  const found = hit as Hit | null;
  if (!found) {
    w.effects.push({ kind: 'ripple', x, y, t: 0 });
    return;
  }
  if (found.what === 'bug') {
    const [bug] = w.bugs.splice(found.i, 1);
    w.pinned[bug.species]++;
    w.specimen = cardFor({ bug });
    w.effects.push({ kind: 'pin', bug, t: 0 });
  } else {
    const [spider] = w.spiders.splice(found.i, 1);
    abandon(spider);
    w.pinnedSpiders[spider.kind]++;
    w.specimen = cardFor({ spider });
    w.effects.push({ kind: 'pin-spider', spider, t: 0 });
  }
}

// \u2500\u2500 Strains \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500

function registerBirth(w: World, b: Bug): void {
  w.maxGen[b.species] = Math.max(w.maxGen[b.species], b.gen);
  if (!w.ateTypes && b.appetite.type >= STRAIN_AT) {
    w.ateTypes = true;
    note(w, 'Something has learned to eat types: a ' + lower(b.species)
      + ' of generation ' + b.gen + '.');
  }
  const food = b.mark;
  if (!food || w.strains.has(b.strain)) return;
  const kept = SPECIES[b.species].eats.some((k) => b.appetite[k] >= STRAIN_AT);
  const strain: Strain = {
    key: b.strain, species: b.species, food,
    name: SPECIES[b.species].latin + ' var. ' + EPITHET[food],
    blurb: 'a ' + lower(b.species)
      + (kept ? ' that also eats ' : ' that switched to ') + FOOD_NAME[food],
    founded: w.t, count: 1, peak: 1,
  };
  w.strains.set(b.strain, strain);
  note(w, 'New strain: ' + strain.blurb + '.');
}

function strainName(b: Bug): string {
  return b.mark
    ? SPECIES[b.species].latin + ' var. ' + EPITHET[b.mark]
    : SPECIES[b.species].latin;
}

function cardFor(x: { bug: Bug } | { spider: Spider }): SpecimenCard {
  if ('bug' in x) {
    const b = x.bug;
    return { what: 'bug', kind: b.species, name: strainName(b), gen: b.gen,
      genes: { ...b.genes }, appetite: { ...b.appetite }, mark: b.mark };
  }
  const sp = x.spider;
  return { what: 'spider', kind: sp.kind, name: PREDATORS[sp.kind].latin,
    gen: sp.gen, genes: { ...sp.genes } };
}

// \u2500\u2500 Spider behaviour \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500

function note(w: World, text: string, onceKey?: string): void {
  if (onceKey) {
    if (w.once.has(onceKey)) return;
    w.once.add(onceKey);
  }
  w.log.unshift({ t: w.t, text });
  if (w.log.length > 14) w.log.pop();
}

const lower = (k: Kind): string =>
  (isPredator(k) ? PREDATORS[k].common : SPECIES[k].common).toLowerCase();

function findBug(w: World, id: number): Bug | undefined {
  return w.bugs.find((b) => b.id === id);
}

function startle(b: Bug, fx: number, fy: number): void {
  if (b.startle > 0) return;
  b.playingDead = Math.random() < b.genes.freeze;
  b.startle = b.playingDead ? rand(2.5, 4) : rand(0.6, 1.2);
  b.flee = Math.atan2(b.y - fy, b.x - fx) + rand(-0.4, 0.4);
  b.target = -1;
}

function abandon(s: Spider): void {
  if (s.kind === 'weaver' && 'web' in s.mode) s.mode.web.owner = -1;
}

function walkSpider(w: World, s: Spider, v: number, dt: number): void {
  const L = w.L;
  s.x += Math.cos(s.heading) * v * dt;
  s.y += Math.sin(s.heading) * v * dt;
  s.gait += (dt * v) / (L.cw * 0.8);
  const x0 = L.x0;
  const x1 = L.x0 + L.codeW;
  const y0 = L.y0;
  const y1 = L.y0 + L.codeH;
  if (s.x < x0 || s.x > x1) {
    s.x = clamp(s.x, x0, x1);
    s.heading = Math.PI - s.heading;
  }
  if (s.y < y0 || s.y > y1) {
    s.y = clamp(s.y, y0, y1);
    s.heading = -s.heading;
  }
}

// Jumping spiders have superb forward vision and hunt by motion. Their big
// front eyes see far in a narrow cone; the side eyes only catch what is close.
function spot(w: World, s: Spider, range: number): Bug | null {
  let best: Bug | null = null;
  let bestD = range;
  for (const b of w.bugs) {
    if (!b.moving) continue;
    // Too big to tackle, especially for a spiderling.
    if (b.genes.size > 1.1 + 0.6 * s.grown) continue;
    const dx = b.x - s.x;
    const dy = b.y - s.y;
    const d = Math.hypot(dx, dy);
    // Camouflage shrinks the distance a bug can be seen from, and a
    // sharp-eyed spider claws that distance back: an arms race.
    const seen = range * (1 - 0.8 * b.genes.camo * (1 - s.genes.acuity));
    if (d >= Math.min(bestD, seen)) continue;
    const off = Math.abs(wrapAngle(Math.atan2(dy, dx) - s.heading));
    if (off > 0.6 && d > range * 0.35) continue;
    best = b;
    bestD = d;
  }
  return best;
}

function updateJumper(w: World, s: SpiderOf<'jumper'>, dt: number): void {
  const L = w.L;
  const spec = PREDATORS.jumper;
  const mode = s.mode;
  switch (mode.m) {
    case 'prowl': {
      mode.hop -= dt;
      if (mode.hop < 0) {
        s.heading += rand(-2, 2) * dt;
        walkSpider(w, s, spec.speed * s.genes.speed * L.cw * 1.5, dt);
        if (mode.hop < -0.45) mode.hop = rand(0.4, 1.2);
      } else {
        // Paused: swivel and look.
        s.heading += Math.sin(w.t * 2.3 + s.id) * 1.4 * dt;
      }
      const prey = spot(w, s, L.cw * 32 * s.genes.reach);
      if (prey) s.mode = { m: 'stalk', prey: prey.id };
      return;
    }
    case 'stalk': {
      const prey = findBug(w, mode.prey);
      const d = prey ? Math.hypot(prey.x - s.x, prey.y - s.y) : Infinity;
      if (!prey || (prey.startle > 0 && !prey.moving) || d > L.cw * 40) {
        if (prey && prey.startle > 0 && !prey.moving) {
          note(w, 'A keyword weevil played dead. The catch spider lost it.',
            'thanatosis');
        }
        s.mode = { m: 'prowl', hop: 0.5 };
        return;
      }
      steer(s, Math.atan2(prey.y - s.y, prey.x - s.x), 6 * dt);
      walkSpider(w, s, spec.speed * s.genes.speed * L.cw * 0.6, dt);
      if (d < L.cw * 13 && Math.random() < prey.genes.wary * dt * 0.7) {
        startle(prey, s.x, s.y);
      }
      if (d < L.cw * 9) s.mode = { m: 'crouch', prey: prey.id, t: 0 };
      return;
    }
    case 'crouch': {
      const prey = findBug(w, mode.prey);
      if (!prey || (prey.startle > 0 && !prey.moving)) {
        s.mode = { m: 'prowl', hop: 0.6 };
        return;
      }
      steer(s, Math.atan2(prey.y - s.y, prey.x - s.x), 10 * dt);
      mode.t += dt;
      if (mode.t < 0.35) return;
      // Lead the target: aim where it will be on landing.
      const d = Math.hypot(prey.x - s.x, prey.y - s.y);
      const dur = clamp(d / (L.cw * 45 * s.genes.speed), 0.12, 0.34);
      const v = prey.moving
        ? SPECIES[prey.species].speed * prey.genes.speed * L.cw
          * (prey.startle > 0 ? 1.9 : 1)
        : 0;
      const x1 = prey.x + Math.cos(prey.heading) * v * dur;
      const y1 = prey.y + Math.sin(prey.heading) * v * dur;
      s.mode = { m: 'leap', prey: prey.id, x0: s.x, y0: s.y, x1, y1, t: 0, dur };
      // A jumping spider always leaves a safety line behind it.
      w.effects.push({ kind: 'silk', x0: s.x, y0: s.y, x1, y1, t: 0 });
      return;
    }
    case 'leap': {
      mode.t += dt;
      const p = Math.min(1, mode.t / mode.dur);
      s.x = mode.x0 + (mode.x1 - mode.x0) * p;
      s.y = mode.y0 + (mode.y1 - mode.y0) * p;
      if (p < 1) return;
      const prey = findBug(w, mode.prey);
      if (prey && Math.hypot(prey.x - s.x, prey.y - s.y) < L.cw * 2.4) {
        w.bugs.splice(w.bugs.indexOf(prey), 1);
        w.caught.jumper++;
        s.mode = { m: 'feed', meal: prey, t: 0 };
        note(w, 'First kill: a catch spider took a ' + lower(prey.species) + '.',
          'first-jump');
        // Its neighbours of the same kind panic.
        for (const b of w.bugs) {
          if (b.species === prey.species
            && Math.hypot(b.x - s.x, b.y - s.y) < L.cw * 14) startle(b, s.x, s.y);
        }
      } else {
        s.mode = { m: 'rest', t: 0 };
      }
      return;
    }
    case 'feed': {
      mode.t += dt;
      s.energy += (PREY[mode.meal.species].meal * mode.meal.genes.size / 2) * dt;
      if (mode.t >= 2) s.mode = { m: 'rest', t: 0 };
      return;
    }
    case 'rest': {
      mode.t += dt;
      if (mode.t > 0.9) s.mode = { m: 'prowl', hop: 0.3 };
      return;
    }
    default:
      assertNever(mode);
  }
}

function webSiteFree(w: World, x: number, y: number, r: number): boolean {
  return w.webs.every(
    (web) => Math.hypot(web.x - x, web.y - y) > web.r + r + w.L.cw * 4);
}

// Where the spinner is at a given moment of spinning: first it lays the
// radial spokes out and back from the hub, then it walks the sticky spiral
// from the outside in, which is how orb weavers actually build.
function spinPoint(web: Web, built: number): [number, number] {
  let a: number;
  let rr: number;
  if (built < 0.25) {
    const q = (built / 0.25) * web.spokes;
    const k = Math.floor(q);
    a = web.seed + (k / web.spokes) * TAU;
    rr = web.r * Math.sin(Math.PI * (q - k));
  } else {
    const f = (built - 0.25) / 0.75;
    a = web.seed + f * TURNS * TAU;
    rr = web.r * (0.95 - 0.78 * f);
  }
  return [web.x + Math.cos(a) * rr, web.y + Math.sin(a) * rr];
}

function updateWeaver(w: World, s: SpiderOf<'weaver'>, dt: number): void {
  const L = w.L;
  const spec = PREDATORS.weaver;
  const mode = s.mode;
  switch (mode.m) {
    case 'roam': {
      s.heading += (Math.sin(w.t * 0.9 + s.id) * 1.2 + rand(-1, 1)) * dt;
      walkSpider(w, s, spec.speed * s.genes.speed * L.cw, dt);
      mode.t -= dt;
      const r = L.cw * rand(8, 12) * (0.6 + 0.4 * s.grown) * s.genes.reach;
      if (mode.t <= 0 && webSiteFree(w, s.x, s.y, r)) {
        const web: Web = {
          id: w.nextId++, x: s.x, y: s.y, r,
          spokes: 11 + Math.floor(rand(0, 5)), seed: rand(0, 1000),
          built: 0, health: 1, owner: s.id, silk: s.genes.silk, stuck: [],
        };
        w.webs.push(web);
        s.mode = { m: 'spin', web };
      }
      return;
    }
    case 'spin': {
      const web = mode.web;
      web.built = Math.min(1, web.built + dt / 10);
      const [x, y] = spinPoint(web, web.built);
      steer(s, Math.atan2(y - s.y, x - s.x), 12 * dt);
      s.x += (x - s.x) * Math.min(1, dt * 10);
      s.y += (y - s.y) * Math.min(1, dt * 10);
      s.gait += dt * 14;
      if (web.built >= 1) {
        s.mode = { m: 'wait', web, idle: 0 };
        note(w, 'A finally spider finished its first web.', 'first-web');
      }
      return;
    }
    case 'wait': {
      const web = mode.web;
      mode.idle += dt;
      s.x += (web.x - s.x) * Math.min(1, dt * 3);
      s.y += (web.y - s.y) * Math.min(1, dt * 3);
      steer(s, Math.PI / 2, 2 * dt);
      const first = web.stuck[0];
      if (first) {
        s.mode = { m: 'fetch', web, prey: first.bug.id };
        return;
      }
      if (web.health < 0.2 || mode.idle > 50) {
        web.owner = -1;
        s.mode = { m: 'roam', t: rand(3, 7) };
      }
      return;
    }
    case 'fetch': {
      const web = mode.web;
      const st = web.stuck.find((x) => x.bug.id === mode.prey);
      if (!st) {
        s.mode = { m: 'wait', web, idle: 0 };
        return;
      }
      steer(s, Math.atan2(st.bug.y - s.y, st.bug.x - s.x), 10 * dt);
      walkSpider(w, s, spec.speed * s.genes.speed * L.cw * 2.2, dt);
      if (Math.hypot(st.bug.x - s.x, st.bug.y - s.y) < L.cw * 1.6) {
        web.stuck.splice(web.stuck.indexOf(st), 1);
        w.caught.weaver++;
        s.mode = { m: 'wrap', web, meal: st.bug, t: 0 };
        note(w, 'First web catch: a ' + lower(st.bug.species)
          + ', wrapped in silk.', 'first-web-catch');
      }
      return;
    }
    case 'wrap': {
      mode.t += dt;
      s.energy += (PREY[mode.meal.species].meal * mode.meal.genes.size / 4) * dt;
      s.gait += dt * 20;
      if (mode.t >= 4) s.mode = { m: 'wait', web: mode.web, idle: 0 };
      return;
    }
    default:
      assertNever(mode);
  }
}

// Spider upkeep, relative to the first arrivals. Sharp eyes and extra
// sticky silk are not free.
function spiderUpkeep(s: Spider): number {
  const g = s.genes;
  const base = g.speed * g.speed * (1 + 0.25 * (g.reach - 1));
  return s.kind === 'jumper'
    ? base * (1 + 0.5 * (g.acuity - 0.2))
    : base * (1 + 0.4 * (g.silk - 1));
}

function spiderCensus(w: World): Record<PredatorKind, number> {
  const n = zeroByPredator();
  for (const s of w.spiders) n[s.kind]++;
  return n;
}

// Spiders arrive at the edge of what you are looking at, so you see them.
function releaseSpiders(w: World, kind: PredatorKind, count: number): void {
  const L = w.L;
  for (let k = 0; k < count; k++) {
    const inView = k === 0;
    const y = inView
      ? clamp(w.cam + rand(0.2, 0.8) * L.viewH, L.y0, L.y0 + L.codeH)
      : L.y0 + rand(0, L.codeH);
    const left = Math.random() < 0.5;
    const sp = makeSpider(w.nextId++, kind, left ? L.x0 : L.x0 + L.codeW, y,
      1, mutate(ANCESTRAL_SPIDER, SPIDER_BOUNDS, 0.6));
    sp.heading = left ? 0 : Math.PI;
    w.spiders.push(sp);
  }
}

function stepWebs(w: World, dt: number): void {
  for (const web of w.webs) {
    web.health -= dt / (web.owner < 0 ? 40 : 150);
    if (web.built < 0.5) continue;
    const reach = web.r * web.r;
    // Anything that blunders into the sticky spiral may stay there.
    for (let i = w.bugs.length - 1; i >= 0; i--) {
      const b = w.bugs[i];
      const dx = b.x - web.x;
      const dy = b.y - web.y;
      if (dx * dx + dy * dy > reach) continue;
      const hold = (PREY[b.species].stick / b.genes.size) * 4 * web.silk
        * web.built * web.health;
      if (Math.random() > hold * dt) continue;
      w.bugs.splice(i, 1);
      b.chewing = 0;
      b.target = -1;
      web.stuck.push({ bug: b, t: 0 });
      const how = b.species === 'moth' ? ' flew' : ' walked';
      note(w, 'A ' + lower(b.species) + how + ' into a web.', 'stuck-' + b.species);
    }
    web.stuck = web.stuck.filter((st) => {
      st.t += dt;
      st.bug.gait += dt * 25;
      st.bug.energy -= dt * 0.2;
      const pull = PREY[st.bug.species].escape * st.bug.genes.size ** 2;
      if (Math.random() < (pull / web.silk) * dt) {
        web.health -= 0.25;
        startle(st.bug, web.x, web.y);
        w.bugs.push(st.bug);
        note(w, 'A ' + lower(st.bug.species) + ' tore free of a web.',
          'escape-' + st.bug.species);
        return false;
      }
      if (st.bug.energy > 0) return true;
      w.effects.push({ kind: 'husk', bug: st.bug, t: 0 });
      return false;
    });
  }
  w.webs = w.webs.filter((web) => {
    if (web.health > 0) return true;
    for (const st of web.stuck) w.bugs.push(st.bug);
    web.stuck = [];
    return false;
  });
}

function releaseHunters(w: World): void {
  for (const k of PREDATOR_LIST) releaseSpiders(w, k, 1);
}

function stepSpiders(w: World, dt: number): void {
  for (const s of w.spiders) {
    const spec = PREDATORS[s.kind];
    s.grown = Math.min(1, s.grown + dt / 35);
    s.age += dt;
    s.energy -= spec.metabolism * (0.5 + 0.5 * s.grown) * spiderUpkeep(s) * dt;
    switch (s.kind) {
      case 'jumper': updateJumper(w, s, dt); break;
      case 'weaver': updateWeaver(w, s, dt); break;
      default: assertNever(s);
    }
  }

  w.spiders = w.spiders.filter((s) => {
    if (s.energy > 0 && s.age < s.lifespan) return true;
    w.effects.push({ kind: 'spider-husk', spider: s, t: 0 });
    abandon(s);
    return false;
  });

  // Well-fed adults lay egg sacs; the sacs hatch into spiderlings.
  const n = spiderCensus(w);
  for (const e of w.eggs) n[e.kind] += PREDATORS[e.kind].clutch;
  for (const s of w.spiders) {
    const spec = PREDATORS[s.kind];
    if (s.grown < 1 || s.energy < spec.eggAt) continue;
    if (n[s.kind] >= spec.cap * w.capScale) continue;
    s.energy -= spec.eggAt * 0.6;
    n[s.kind] += spec.clutch;
    w.eggs.push({ x: s.x, y: s.y, kind: s.kind, t: 0, hatchAt: rand(10, 15),
      energy: spec.eggAt * 0.4, genes: s.genes, gen: s.gen });
    note(w, 'A ' + lower(s.kind) + ' laid an egg sac.', 'egg-' + s.kind);
  }
  w.eggs = w.eggs.filter((e) => {
    e.t += dt;
    if (e.t < e.hatchAt) return true;
    const spec = PREDATORS[e.kind];
    for (let k = 0; k < spec.clutch; k++) {
      const sp = makeSpider(w.nextId++, e.kind,
        e.x + rand(-10, 10), e.y + rand(-10, 10), 0.45,
        mutate(e.genes, SPIDER_BOUNDS, w.mutation), e.gen + 1);
      sp.energy = e.energy / spec.clutch + 3;
      w.spiders.push(sp);
      w.maxGen[e.kind] = Math.max(w.maxGen[e.kind], sp.gen);
    }
    note(w, spec.clutch + ' ' + lower(e.kind).replace('spider', 'spiderlings')
      + ' hatched.', 'hatch-' + e.kind);
    return false;
  });

  stepWebs(w, dt);

  // Predators follow the prey: when there is enough to eat, they turn up.
  w.clocks.spiders -= dt;
  if (w.clocks.spiders <= 0) {
    w.clocks.spiders = 30;
    const now = spiderCensus(w);
    if (w.bugs.length >= 30) {
      for (const k of PREDATOR_LIST) {
        if (now[k] > 0 || w.eggs.some((e) => e.kind === k)) continue;
        releaseSpiders(w, k, Math.max(1, Math.round(w.capScale * 0.6)));
        note(w, 'A ' + lower(k) + ' arrived, following the prey.');
      }
    }
  }
}

function step(w: World, dt: number): void {
  w.t += dt;
  if (w.clocks.hatch > 0) {
    w.clocks.hatch -= dt;
    if (w.clocks.hatch <= 0) seed(w);
  }
  for (const b of w.bugs) moveBug(w, b, dt);

  // Births and deaths happen after the loop, never while iterating.
  const n = census(w);
  const born: Bug[] = [];
  w.bugs = w.bugs.filter((b) => {
    if (b.energy > 0 && b.age < b.lifespan) return true;
    w.effects.push({ kind: 'husk', bug: b, t: 0 });
    return false;
  });
  for (const b of w.bugs) {
    const spec = SPECIES[b.species];
    const cap = spec.cap * w.capScale;
    if (b.energy < spec.splitAt * b.genes.size || n[b.species] >= cap) continue;
    b.energy /= 2;
    n[b.species]++;
    const child = makeBug(w.nextId++, b.species, b.x, b.y,
      b.heading + Math.PI / 2, w.L.u, {
        genes: mutate(b.genes, TRAIT_BOUNDS, w.mutation),
        appetite: mutateAppetite(b.appetite, w.mutation),
        gen: b.gen + 1,
      });
    child.energy = b.energy;
    born.push(child);
    registerBirth(w, child);
  }
  w.bugs.push(...born);

  stepSpiders(w, dt);

  for (const i of w.active) updateGlyph(w, i, dt);
  for (const e of w.effects) e.t += dt;
  w.effects = w.effects.filter((e) => e.t < EFFECT_LIFE[e.kind]);

  w.clocks.sample += dt;
  if (w.clocks.sample >= 0.5) {
    w.clocks.sample = 0;
    const now = census(w);
    const hunters = spiderCensus(w);
    for (const s of SPECIES_LIST) {
      const h = w.history[s];
      h.push(now[s]);
      if (h.length > HISTORY) h.shift();
    }
    for (const k of PREDATOR_LIST) {
      const h = w.spiderHistory[k];
      h.push(hunters[k]);
      if (h.length > HISTORY) h.shift();
    }
    const all: Record<Kind, number> = { ...now, ...hunters };
    for (const k of Object.keys(all) as Kind[]) {
      if (w.last[k] > 2 && all[k] === 0) {
        note(w, 'The ' + lower(k) + 's died out.');
      }
    }
    w.last = all;
    for (const st of w.strains.values()) st.count = 0;
    for (const b of w.bugs) {
      const st = b.mark ? w.strains.get(b.strain) : undefined;
      if (st) st.count++;
    }
    for (const st of w.strains.values()) st.peak = Math.max(st.peak, st.count);
  }

  w.clocks.phase += dt;
  if (w.clocks.phase >= 1) {
    w.clocks.phase = 0;
    w.phase.push([w.bugs.length, w.spiders.length]);
    if (w.phase.length > 360) w.phase.shift();
  }

  // A species that has died out drifts back in if there is food for it.
  w.clocks.immigrate += dt;
  if (w.clocks.immigrate >= 9 && w.clocks.hatch <= 0) {
    w.clocks.immigrate = 0;
    const now = census(w);
    for (const s of SPECIES_LIST) {
      if (now[s] > 0 || foodLeft(w, s) < 0.05) continue;
      const L = w.L;
      const y = clamp(w.cam + rand(0, L.viewH), L.y0, L.y0 + L.codeH);
      const fromLeft = Math.random() < 0.5;
      spawn(w, s, fromLeft ? L.x0 : L.x0 + L.codeW, y, fromLeft ? 0 : Math.PI);
    }
  }
}

// \u2500\u2500 Drawing \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500

type Ctx = CanvasRenderingContext2D;

function oval(ctx: Ctx, x: number, y: number, rx: number, ry: number): void {
  ctx.beginPath();
  ctx.ellipse(x, y, rx, ry, 0, 0, TAU);
  ctx.fill();
}

// Six legs in an alternating tripod gait, the way real insects walk.
function legs(ctx: Ctx, b: BugCore, u: number): void {
  if (b.startle > 0 && b.playingDead) u *= 0.5; // tucked in, playing dead
  ctx.beginPath();
  for (let i = -1; i <= 1; i++) {
    for (const side of [-1, 1]) {
      const parity = (i + 2 + (side > 0 ? 1 : 0)) % 2;
      const swing = Math.sin(b.gait + parity * Math.PI) * 0.3 * u;
      const kx = i * 0.7 * u + swing;
      const ky = side * 0.75 * u;
      ctx.moveTo(i * 0.4 * u, side * 0.3 * u);
      ctx.lineTo(kx, ky);
      ctx.lineTo(kx + i * 0.45 * u + swing * 0.6, ky + side * 0.3 * u);
    }
  }
  ctx.stroke();
}

function drawBeetle(
  ctx: Ctx, b: BugCore, u: number, pal: Palette, body: string,
): void {
  ctx.strokeStyle = body;
  ctx.fillStyle = body;
  ctx.lineWidth = Math.max(0.7, u * 0.11);
  legs(ctx, b, u);
  ctx.beginPath();
  for (const s of [-1, 1]) {
    ctx.moveTo(1.2 * u, s * 0.12 * u);
    ctx.quadraticCurveTo(1.6 * u, s * 0.2 * u, 1.85 * u, s * 0.55 * u);
  }
  ctx.stroke();
  oval(ctx, -0.15 * u, 0, 0.95 * u, 0.68 * u);
  oval(ctx, 0.75 * u, 0, 0.34 * u, 0.5 * u);
  oval(ctx, 1.1 * u, 0, 0.2 * u, 0.26 * u);
  ctx.globalAlpha = 0.45;
  ctx.strokeStyle = pal.paper;
  ctx.lineWidth = Math.max(0.5, u * 0.07);
  ctx.beginPath();
  ctx.moveTo(-1.05 * u, 0);
  ctx.lineTo(0.42 * u, 0);
  ctx.stroke();
  ctx.globalAlpha = 0.3;
  ctx.fillStyle = '#fff';
  oval(ctx, -0.25 * u, -0.34 * u, 0.42 * u, 0.12 * u);
}

function drawWeevil(
  ctx: Ctx, b: BugCore, u: number, pal: Palette, body: string,
): void {
  ctx.strokeStyle = body;
  ctx.fillStyle = body;
  ctx.lineWidth = Math.max(0.7, u * 0.1);
  legs(ctx, b, u * 0.85);
  // The rostrum: the long snout weevils are known for.
  ctx.lineWidth = Math.max(0.8, u * 0.17);
  ctx.beginPath();
  ctx.moveTo(0.9 * u, 0);
  ctx.quadraticCurveTo(1.5 * u, 0.02 * u, 1.95 * u, 0.14 * u);
  ctx.stroke();
  ctx.lineWidth = Math.max(0.5, u * 0.07);
  ctx.beginPath();
  for (const s of [-1, 1]) {
    ctx.moveTo(1.45 * u, 0.05 * u);
    ctx.lineTo(1.55 * u, s * 0.38 * u);
    ctx.lineTo(1.85 * u, s * 0.5 * u);
  }
  ctx.stroke();
  for (const s of [-1, 1]) oval(ctx, 1.88 * u, s * 0.51 * u, 0.09 * u, 0.09 * u);
  oval(ctx, -0.1 * u, 0, 0.9 * u, 0.52 * u);
  oval(ctx, 0.8 * u, 0, 0.26 * u, 0.3 * u);
  ctx.globalAlpha = 0.35;
  ctx.fillStyle = pal.paper;
  for (const [x, y] of [[-0.5, -0.2], [-0.1, 0.25], [0.3, -0.15], [-0.7, 0.18]]) {
    oval(ctx, x * u, y * u, 0.07 * u, 0.07 * u);
  }
}

function drawMoth(
  ctx: Ctx, b: BugCore, u: number, pal: Palette, body: string,
): void {
  const flap = 0.35 + 0.65 * Math.abs(Math.sin(b.gait));
  ctx.fillStyle = body;
  for (const s of [-1, 1]) {
    ctx.globalAlpha = 0.92;
    ctx.beginPath();
    ctx.moveTo(0.35 * u, 0);
    ctx.quadraticCurveTo(0.2 * u, s * 1.3 * u * flap, -0.6 * u, s * 1.6 * u * flap);
    ctx.quadraticCurveTo(-0.5 * u, s * 0.6 * u * flap, -0.35 * u, s * 0.1 * u);
    ctx.closePath();
    ctx.fill();
    ctx.globalAlpha = 0.7;
    ctx.beginPath();
    ctx.moveTo(-0.1 * u, 0);
    ctx.quadraticCurveTo(-0.5 * u, s * 1.05 * u * flap,
      -1.05 * u, s * 0.8 * u * flap);
    ctx.quadraticCurveTo(-0.9 * u, s * 0.25 * u, -0.55 * u, 0);
    ctx.closePath();
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  oval(ctx, -0.1 * u, 0, 0.75 * u, 0.2 * u);
  ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
  oval(ctx, -0.1 * u, 0, 0.75 * u, 0.2 * u);
  ctx.strokeStyle = body;
  ctx.lineWidth = Math.max(0.5, u * 0.07);
  ctx.beginPath();
  for (const s of [-1, 1]) {
    ctx.moveTo(0.6 * u, s * 0.06 * u);
    ctx.lineTo(1.2 * u, s * 0.5 * u);
  }
  ctx.stroke();
}

function drawWorm(ctx: Ctx, b: BugOf<'worm'>, u: number, body: string): void {
  const n = b.body.length / 2;
  ctx.fillStyle = body;
  for (let i = n - 1; i >= 0; i--) {
    const r = u * (i === 0 ? 0.36 : 0.44 - 0.22 * (i / n));
    ctx.beginPath();
    ctx.arc(b.body[2 * i], b.body[2 * i + 1], r, 0, TAU);
    ctx.fill();
  }
  // The clitellum, the saddle-shaped band near an earthworm's head.
  ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
  for (const i of [3, 4]) {
    ctx.beginPath();
    ctx.arc(b.body[2 * i], b.body[2 * i + 1], u * 0.44, 0, TAU);
    ctx.fill();
  }
}

// Camouflage fades a bug's colour toward the paper. Colours are cached in
// twenty steps so a thousand bugs do not build a thousand strings a frame.
const tintCache = new Map<string, string>();

function mix(a: string, b: string, t: number): string {
  const hex = /^#([0-9a-f]{6})$/i;
  const ma = hex.exec(a);
  const mb = hex.exec(b);
  if (!ma || !mb) return a;
  const pa = parseInt(ma[1], 16);
  const pb = parseInt(mb[1], 16);
  const ch = (shift: number) => Math.round(
    ((pa >> shift) & 255) * (1 - t) + ((pb >> shift) & 255) * t);
  return 'rgb(' + ch(16) + ', ' + ch(8) + ', ' + ch(0) + ')';
}

function tint(pal: Palette, s: Species, camo: number): string {
  const level = Math.round(camo * 20);
  const key = pal[s] + pal.paper + level;
  let colour = tintCache.get(key);
  if (!colour) {
    colour = mix(pal[s], pal.paper, (level / 20) * 0.8);
    tintCache.set(key, colour);
  }
  return colour;
}

function drawBug(ctx: Ctx, b: Bug, u: number, pal: Palette): void {
  u *= b.genes.size;
  const body = tint(pal, b.species, b.genes.camo);
  ctx.save();
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  if (b.species !== 'worm') {
    ctx.translate(b.x, b.y);
    ctx.rotate(b.heading);
  }
  switch (b.species) {
    case 'beetle': drawBeetle(ctx, b, u, pal, body); break;
    case 'weevil': drawWeevil(ctx, b, u, pal, body); break;
    case 'moth': drawMoth(ctx, b, u, pal, body); break;
    case 'worm': drawWorm(ctx, b, u, body); break;
    default: assertNever(b);
  }
  if (b.mark) {
    // A new strain wears a dot in the colour of the food it switched to.
    const [x, y] = b.species === 'worm' ? [b.body[4], b.body[5]] : [-0.4 * u, 0];
    ctx.globalAlpha = 1;
    ctx.fillStyle = pal.paper;
    oval(ctx, x, y, 0.3 * u, 0.3 * u);
    ctx.fillStyle = pal[b.mark];
    oval(ctx, x, y, 0.2 * u, 0.2 * u);
  }
  ctx.restore();
}

const DRAW_ORDER: Record<Species, number> = {
  worm: 0, weevil: 1, beetle: 2, moth: 3,
};

function drawBugs(ctx: Ctx, w: World, y0: number, y1: number): void {
  const sorted = [...w.bugs].sort(
    (a, b) => DRAW_ORDER[a.species] - DRAW_ORDER[b.species]);
  for (const b of sorted) {
    if (b.y > y0 - 60 && b.y < y1 + 60) drawBug(ctx, b, w.L.u, w.pal);
  }
}

// Eight legs: the front pair reach forward, the back pair trail behind.
function spiderLegs(
  ctx: Ctx, s: SpiderCore, u: number, span: number, bend: number,
): void {
  ctx.beginPath();
  for (let k = 0; k < 4; k++) {
    for (const side of [-1, 1]) {
      const phase = s.gait + (k % 2) * Math.PI + (side > 0 ? Math.PI : 0);
      const swing = Math.sin(phase) * 0.25 * u;
      const fan = 1.1 - k * 0.72;
      const ax = (0.45 - k * 0.2) * u;
      const kx = ax + fan * 0.6 * u * span + swing;
      const ky = side * (0.75 * span + bend * 0.25) * u;
      const fx = kx + fan * 0.55 * u * span + swing * 0.5;
      const fy = ky + side * (0.35 * span - bend * 0.35) * u;
      ctx.moveTo(ax, side * 0.18 * u);
      ctx.lineTo(kx, ky);
      ctx.lineTo(fx, fy);
    }
  }
  ctx.stroke();
}

function drawJumper(ctx: Ctx, s: SpiderOf<'jumper'>, u: number, pal: Palette) {
  const mode = s.mode;
  const lift = mode.m === 'leap'
    ? Math.sin(Math.PI * Math.min(1, mode.t / mode.dur)) : 0;
  const crouched = mode.m === 'crouch';
  if (lift > 0) {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.16)';
    oval(ctx, -0.2 * u, 0, 1.1 * u, 0.7 * u);
    ctx.scale(1 + lift * 0.5, 1 + lift * 0.5);
  }
  ctx.strokeStyle = pal.jumper;
  ctx.fillStyle = pal.jumper;
  ctx.lineWidth = Math.max(0.7, u * 0.13);
  spiderLegs(ctx, s, u, crouched ? 0.75 : 1, crouched ? 1 : 0);
  oval(ctx, -0.55 * u, 0, 0.62 * u, 0.48 * u);
  oval(ctx, 0.3 * u, 0, 0.5 * u, 0.44 * u);
  // Chevrons on the abdomen.
  ctx.globalAlpha = 0.45;
  ctx.strokeStyle = pal.paper;
  ctx.lineWidth = Math.max(0.5, u * 0.07);
  ctx.beginPath();
  for (const c of [-0.85, -0.6, -0.35]) {
    ctx.moveTo((c - 0.12) * u, -0.24 * u);
    ctx.lineTo((c + 0.06) * u, 0);
    ctx.lineTo((c - 0.12) * u, 0.24 * u);
  }
  ctx.stroke();
  ctx.globalAlpha = 1;
  for (const side of [-1, 1]) {
    oval(ctx, 0.86 * u, side * 0.14 * u, 0.12 * u, 0.08 * u);
  }
  // The two huge forward-facing eyes jumping spiders are famous for.
  ctx.fillStyle = '#0b0e0d';
  for (const side of [-1, 1]) {
    oval(ctx, 0.64 * u, side * 0.16 * u, 0.15 * u, 0.15 * u);
  }
  ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
  for (const side of [-1, 1]) {
    oval(ctx, 0.69 * u, side * 0.16 * u - 0.05 * u, 0.045 * u, 0.045 * u);
  }
}

function drawWeaver(ctx: Ctx, s: SpiderOf<'weaver'>, u: number, pal: Palette) {
  ctx.strokeStyle = pal.weaver;
  ctx.fillStyle = pal.weaver;
  ctx.lineWidth = Math.max(0.6, u * 0.08);
  spiderLegs(ctx, s, u, 1.5, 0);
  oval(ctx, -0.7 * u, 0, 0.85 * u, 0.72 * u);
  oval(ctx, 0.35 * u, 0, 0.38 * u, 0.32 * u);
  // The folium: the leaf-shaped marking on an orb weaver's back.
  ctx.fillStyle = 'rgba(0, 0, 0, 0.28)';
  ctx.beginPath();
  ctx.moveTo(-1.45 * u, 0);
  ctx.quadraticCurveTo(-0.7 * u, -0.55 * u, 0, 0);
  ctx.quadraticCurveTo(-0.7 * u, 0.55 * u, -1.45 * u, 0);
  ctx.fill();
  ctx.fillStyle = pal.paper;
  ctx.globalAlpha = 0.7;
  for (const [x, y] of [[-0.45, 0.3], [-0.45, -0.3], [-0.9, 0.22], [-0.9, -0.22]]) {
    oval(ctx, x * u, y * u, 0.07 * u, 0.07 * u);
  }
  ctx.globalAlpha = 1;
  if (s.mode.m === 'wrap') {
    // Prey, turned slowly in the legs and wrapped in silk.
    ctx.fillStyle = pal.egg;
    oval(ctx, 1.05 * u, 0, 0.5 * u, 0.32 * u);
    ctx.strokeStyle = 'rgba(0, 0, 0, 0.18)';
    ctx.lineWidth = 0.5;
    ctx.beginPath();
    for (let k = -2; k <= 2; k++) {
      const x = (1.05 + k * 0.16) * u + Math.sin(s.gait + k) * 0.04 * u;
      ctx.moveTo(x - 0.06 * u, -0.28 * u);
      ctx.lineTo(x + 0.06 * u, 0.28 * u);
    }
    ctx.stroke();
  }
}

function drawSpider(ctx: Ctx, s: Spider, pal: Palette, bugU: number): void {
  const u = bugU * PREDATORS[s.kind].size * s.grown;
  if (s.kind === 'jumper' && s.mode.m === 'feed') {
    const meal = s.mode.meal;
    meal.x = s.x + Math.cos(s.heading) * u * 1.2;
    meal.y = s.y + Math.sin(s.heading) * u * 1.2;
    ctx.save();
    ctx.globalAlpha *= Math.max(0, 1 - s.mode.t / 2.2);
    drawBug(ctx, meal, bugU, pal);
    ctx.restore();
  }
  ctx.save();
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.translate(s.x, s.y);
  ctx.rotate(s.heading);
  switch (s.kind) {
    case 'jumper': drawJumper(ctx, s, u, pal); break;
    case 'weaver': drawWeaver(ctx, s, u, pal); break;
    default: assertNever(s);
  }
  ctx.restore();
}

function drawWeb(ctx: Ctx, w: World, web: Web): void {
  const p = w.pointer;
  let alpha = 0.5 * clamp(web.health * 1.6, 0, 1);
  if (p.inside) {
    // Silk glints in lamplight.
    const d = Math.hypot(p.x - web.x, p.y + w.cam - web.y);
    if (d < 260) alpha += 0.45 * (1 - d / 260);
  }
  const n = web.spokes;
  const spokeAngle = (k: number) =>
    web.seed + (k / n) * TAU + (hash(web.seed, k) - 0.5) * 0.18;
  const spokeLen = (k: number) => web.r * (0.88 + 0.12 * hash(web.seed, k + 50));
  ctx.globalAlpha = Math.min(1, alpha);
  ctx.strokeStyle = w.pal.web;
  ctx.lineWidth = 0.6;
  ctx.beginPath();
  const laid = clamp(web.built * 4, 0, 1) * n;
  for (let k = 0; k < n; k++) {
    const len = spokeLen(k) * clamp(laid - k, 0, 1);
    if (len <= 0) break;
    const a = spokeAngle(k);
    ctx.moveTo(web.x, web.y);
    ctx.lineTo(web.x + Math.cos(a) * len, web.y + Math.sin(a) * len);
  }
  ctx.stroke();
  const f = clamp((web.built - 0.25) / 0.75, 0, 1);
  if (f > 0) {
    const N = n * TURNS;
    const last = Math.floor(f * N);
    ctx.beginPath();
    for (let i = 0; i <= last; i++) {
      const k = i % n;
      const rr = spokeLen(k) * (0.95 - 0.78 * (i / N));
      const x = web.x + Math.cos(spokeAngle(k)) * rr;
      const y = web.y + Math.sin(spokeAngle(k)) * rr;
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
  for (const st of web.stuck) {
    ctx.save();
    ctx.translate(Math.sin(st.t * 37) * 0.7, Math.cos(st.t * 29) * 0.7);
    drawBug(ctx, st.bug, w.L.u, w.pal);
    ctx.restore();
  }
}

function drawEgg(ctx: Ctx, w: World, e: EggSac): void {
  const u = w.L.u;
  const wobble = e.hatchAt - e.t < 2 ? Math.sin(w.t * 30) * 0.8 : 0;
  ctx.save();
  ctx.translate(e.x + wobble, e.y);
  ctx.strokeStyle = w.pal.egg;
  ctx.globalAlpha = 0.6;
  ctx.lineWidth = 0.6;
  ctx.beginPath();
  for (let k = 0; k < 9; k++) {
    const a = (k / 9) * TAU + hash(e.x, k);
    ctx.moveTo(Math.cos(a) * 0.5 * u, Math.sin(a) * 0.5 * u);
    ctx.lineTo(Math.cos(a) * 1.25 * u, Math.sin(a) * 1.25 * u);
  }
  ctx.stroke();
  ctx.globalAlpha = 1;
  ctx.fillStyle = w.pal.egg;
  oval(ctx, 0, 0, 0.75 * u, 0.65 * u);
  ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
  for (let k = 0; k < 5; k++) {
    oval(ctx, (hash(e.y, k) - 0.5) * u, (hash(e.x, k + 9) - 0.5) * u * 0.8,
      0.1 * u, 0.1 * u);
  }
  ctx.restore();
}

// Everything alive, back to front: webs, egg sacs, bugs, then spiders.
function drawLife(ctx: Ctx, w: World, y0: number, y1: number): void {
  const seen = (y: number, pad: number) => y > y0 - pad && y < y1 + pad;
  for (const web of w.webs) if (seen(web.y, web.r + 20)) drawWeb(ctx, w, web);
  for (const e of w.eggs) if (seen(e.y, 20)) drawEgg(ctx, w, e);
  drawBugs(ctx, w, y0, y1);
  for (const s of w.spiders) if (seen(s.y, 60)) drawSpider(ctx, s, w.pal, w.L.u);
}

function drawEffect(ctx: Ctx, w: World, e: Effect): void {
  switch (e.kind) {
    case 'ripple': {
      ctx.globalAlpha = 1 - e.t / 0.6;
      ctx.strokeStyle = w.pal.ring;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(e.x, e.y, 6 + e.t * 50, 0, TAU);
      ctx.stroke();
      break;
    }
    case 'husk': {
      ctx.globalAlpha = 0.45 * (1 - e.t / 2.2);
      drawBug(ctx, e.bug, w.L.u, w.pal);
      break;
    }
    case 'pin': {
      const b = e.bug;
      const fade = e.t < 1.6 ? 1 : 1 - (e.t - 1.6) / 0.6;
      ctx.globalAlpha = fade;
      drawBug(ctx, b, w.L.u, w.pal);
      ctx.strokeStyle = w.pal[b.species];
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.arc(b.x, b.y, w.L.u * 2 + e.t * 18, 0, TAU);
      ctx.stroke();
      ctx.fillStyle = w.pal.ring;
      ctx.beginPath();
      ctx.arc(b.x, b.y, Math.max(2, w.L.u * 0.28), 0, TAU);
      ctx.fill();
      ctx.font = 'italic 15px "Instrument Serif", Georgia, serif';
      ctx.textBaseline = 'middle';
      ctx.fillText(SPECIES[b.species].latin, b.x + w.L.u * 2.4, b.y - w.L.u * 2);
      break;
    }
    case 'pin-spider': {
      const sp = e.spider;
      ctx.globalAlpha = e.t < 1.6 ? 1 : 1 - (e.t - 1.6) / 0.6;
      drawSpider(ctx, sp, w.pal, w.L.u);
      ctx.strokeStyle = w.pal[sp.kind];
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.arc(sp.x, sp.y, w.L.u * 2.6 + e.t * 18, 0, TAU);
      ctx.stroke();
      ctx.fillStyle = w.pal.ring;
      ctx.font = 'italic 15px "Instrument Serif", Georgia, serif';
      ctx.textBaseline = 'middle';
      ctx.fillText(PREDATORS[sp.kind].latin, sp.x + w.L.u * 3, sp.y - w.L.u * 2.4);
      break;
    }
    case 'spider-husk': {
      ctx.globalAlpha = 0.4 * (1 - e.t / 3);
      drawSpider(ctx, e.spider, w.pal, w.L.u);
      break;
    }
    case 'silk': {
      // The dragline a jumping spider pays out behind every leap.
      const p = Math.min(1, e.t / 0.25);
      ctx.globalAlpha = 0.55 * (1 - e.t / 6);
      ctx.strokeStyle = w.pal.web;
      ctx.lineWidth = 0.6;
      ctx.beginPath();
      ctx.moveTo(e.x0, e.y0);
      ctx.lineTo(e.x0 + (e.x1 - e.x0) * p, e.y0 + (e.y1 - e.y0) * p);
      ctx.stroke();
      break;
    }
    default:
      assertNever(e);
  }
  ctx.globalAlpha = 1;
}

function render(w: World): void {
  const { ctx, L, pal, dpr, pointer: p } = w;
  const cam = w.cam;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.globalAlpha = 1;
  ctx.fillStyle = pal.paper;
  ctx.fillRect(0, 0, L.W, L.viewH);

  // The cursor is a lamp. Moths can tell.
  if (p.inside) {
    const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, 240);
    g.addColorStop(0, pal.lamp);
    g.addColorStop(1, pal.lampfade);
    ctx.fillStyle = g;
    ctx.fillRect(p.x - 240, p.y - 240, 480, 480);
  }

  const bd = w.baseDpr;
  ctx.drawImage(w.base, 0, cam * bd, L.W * bd, L.viewH * bd, 0, 0, L.W, L.viewH);
  ctx.drawImage(w.pile, 0, L.pileTop, L.W, L.viewH - L.pileTop);

  ctx.font = w.fontCss;
  ctx.textBaseline = 'top';
  for (const i of w.active) {
    const g = w.glyphs[i];
    const s = g.s;
    if (s.tag !== 'loose' && s.tag !== 'flying') continue;
    // Glyphs still waiting in the heap: drawing a third of them reads the same.
    if (s.tag === 'flying' && s.t < s.delay && i % 3 !== 0) continue;
    const y = s.tag === 'flying' ? s.y - cam : s.y;
    if (y < -20 || y > L.viewH + 20) continue;
    if (Math.abs(s.rot) < 0.02) {
      paintGlyph(ctx, w, g, s.x, y);
    } else {
      ctx.save();
      ctx.translate(s.x + L.cw / 2, y + L.lh / 2);
      ctx.rotate(s.rot);
      paintGlyph(ctx, w, g, -L.cw / 2, -L.lh / 2);
      ctx.restore();
    }
  }

  ctx.save();
  ctx.translate(0, -cam);
  drawLife(ctx, w, cam, cam + L.viewH);
  for (const e of w.effects) drawEffect(ctx, w, e);
  ctx.restore();

  if (w.lens && p.inside) drawLoupe(w);
}

// A magnifying loupe: the world redrawn crisp at 2 to 3 times the size.
function drawLoupe(w: World): void {
  const { ctx, L, pal, pointer: p } = w;
  const R = clamp(L.W * 0.1, 70, 130);
  const z = clamp(17 / L.font, 1.8, 3);
  const wx = p.x;
  const wy = p.y + w.cam;
  ctx.save();
  ctx.beginPath();
  ctx.arc(p.x, p.y, R, 0, TAU);
  ctx.clip();
  ctx.fillStyle = pal.paper;
  ctx.fillRect(p.x - R, p.y - R, R * 2, R * 2);
  ctx.translate(p.x, p.y);
  ctx.scale(z, z);
  ctx.translate(-wx, -wy);
  ctx.font = w.fontCss;
  ctx.textBaseline = 'top';
  const r = R / z;
  const stride = L.colChars * L.cw + L.gap;
  const r0 = Math.max(0, Math.floor((wy - r - L.y0) / L.lh));
  const r1 = Math.min(L.rows - 1, Math.floor((wy + r - L.y0) / L.lh));
  for (let block = 0; block < L.cols; block++) {
    const bx = L.x0 + block * stride;
    const c0 = Math.max(0, Math.floor((wx - r - bx) / L.cw));
    const c1 = Math.min(L.colChars - 1, Math.floor((wx + r - bx) / L.cw));
    for (let row = r0; row <= r1 && c0 <= c1; row++) {
      const vrow = block * L.rows + row;
      if (vrow >= L.visualRows) break;
      for (let c = c0; c <= c1; c++) {
        const i = w.cells[vrow * L.colChars + c];
        if (i >= 0 && w.glyphs[i].s.tag === 'home') {
          paintGlyph(ctx, w, w.glyphs[i], w.glyphs[i].hx, w.glyphs[i].hy);
        }
      }
    }
  }
  drawLife(ctx, w, wy - r, wy + r);
  ctx.restore();
  ctx.strokeStyle = pal.ring;
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.arc(p.x, p.y, R, 0, TAU);
  ctx.stroke();
}

// \u2500\u2500 React: hooks \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500

function useAnimationFrame(onFrame: (dt: number) => void): void {
  const saved = useRef(onFrame);
  saved.current = onFrame;
  useEffect(() => {
    let raf = 0;
    let last = performance.now();
    const tick = (now: number): void => {
      saved.current(Math.min(0.05, (now - last) / 1000));
      last = now;
      raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, []);
}

function useInterval(fn: () => void, ms: number): void {
  const saved = useRef(fn);
  saved.current = fn;
  useEffect(() => {
    const id = window.setInterval(() => saved.current(), ms);
    return () => window.clearInterval(id);
  }, [ms]);
}
