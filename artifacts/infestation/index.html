interface Snapshot {
  readonly pop: Record<Species, number>;
  readonly history: Record<Species, readonly number[]>;
  readonly pinned: Record<Species, number>;
  readonly food: Record<Species, number>;
  readonly intact: number;
  readonly paused: boolean;
  readonly lens: boolean;
  readonly reducedMotion: boolean;
  readonly tall: boolean;
  readonly hatching: boolean;
  readonly caps: Record<Species, number>;
  readonly hunters: Record<PredatorKind, number>;
  readonly hunterHistory: Record<PredatorKind, readonly number[]>;
  readonly hunterCaps: Record<PredatorKind, number>;
  readonly caught: Record<PredatorKind, number>;
  readonly pinnedHunters: Record<PredatorKind, number>;
  readonly phase: readonly (readonly [number, number])[];
  readonly log: readonly LogEntry[];
  readonly traits: Record<Species, Record<keyof Traits, TraitStat> | null>;
  readonly spiderTraits:
    Record<PredatorKind, Record<keyof SpiderGenes, TraitStat> | null>;
  readonly gens: Record<Kind, number>;
  readonly strains: readonly Strain[];
  readonly specimen: SpecimenCard | null;
  readonly mutation: number;
  readonly typeEaters: 'never' | 'now' | 'once';
}

interface TraitStat { mean: number; lo: number; hi: number }

// Mean and spread of any numeric gene set. Generic over the gene type, so
// the same code summarises bug traits and spider genes.
function traitStats<T extends Record<string, number>>(
  items: readonly T[], keys: readonly (keyof T)[],
): Record<keyof T, TraitStat> | null {
  if (items.length === 0) return null;
  const out = {} as Record<keyof T, TraitStat>;
  for (const k of keys) {
    let sum = 0;
    let sq = 0;
    for (const it of items) { sum += it[k]; sq += it[k] * it[k]; }
    const mean = sum / items.length;
    const sd = Math.sqrt(Math.max(0, sq / items.length - mean * mean));
    out[k] = { mean, lo: mean - sd, hi: mean + sd };
  }
  return out;
}

function takeSnapshot(w: World): Snapshot {
  let home = 0;
  let all = 0;
  for (const k of TOKEN_KINDS) { home += w.home[k]; all += w.total[k]; }
  return {
    pop: census(w),
    history: mapRecord(w.history, (h) => h.slice()),
    pinned: { ...w.pinned },
    food: mapRecord(SPECIES, (_, s) => foodLeft(w, s)),
    intact: all ? home / all : 1,
    paused: w.paused,
    lens: w.lens,
    reducedMotion: w.reducedMotion,
    tall: w.L.H > w.L.viewH + 40,
    hatching: w.clocks.hatch > 0,
    caps: mapRecord(SPECIES, (spec) => Math.round(spec.cap * w.capScale)),
    hunters: spiderCensus(w),
    hunterHistory: mapRecord(w.spiderHistory, (h) => h.slice()),
    hunterCaps: mapRecord(PREDATORS,
      (spec) => Math.max(2, Math.round(spec.cap * w.capScale))),
    caught: { ...w.caught },
    pinnedHunters: { ...w.pinnedSpiders },
    phase: w.phase.slice(),
    log: w.log.slice(),
    traits: mapRecord(SPECIES, (_, sp) => traitStats(
      w.bugs.filter((b) => b.species === sp).map((b) => b.genes), TRAIT_KEYS)),
    spiderTraits: mapRecord(PREDATORS, (_, k) => traitStats(
      w.spiders.filter((x) => x.kind === k).map((x) => x.genes), SPIDER_KEYS)),
    gens: { ...w.maxGen },
    strains: [...w.strains.values()]
      .sort((a, b) => (b.count > 0 ? 1 : 0) - (a.count > 0 ? 1 : 0)
        || b.count - a.count || b.founded - a.founded)
      .slice(0, 6)
      .map((st) => ({ ...st })),
    specimen: w.specimen,
    mutation: w.mutation,
    typeEaters: w.bugs.some((b) => b.appetite.type >= STRAIN_AT) ? 'now'
      : w.ateTypes ? 'once' : 'never',
  };
}

function hintFor(s: Snapshot): string {
  if (s.paused) {
    return s.reducedMotion
      ? 'Paused because your system asks for reduced motion. Resume when ready.'
      : 'Paused.';
  }
  if (s.hatching) return 'The file is assembling itself. Bugs arrive shortly.';
  const alive = SPECIES_LIST.reduce((n, k) => n + s.pop[k], 0);
  if (SPECIES_LIST.every((k) => s.food[k] < 0.05)) {
    return 'The code is mostly crumbs now. Recompile to put it back.';
  }
  if (alive === 0) return 'Every bug has starved or been pinned. Release more.';
  return 'Your cursor is a lamp. Moths come to it, and webs catch moths. '
    + 'Click anything alive to pin it.';
}

interface SparklineProps {
  values: readonly number[];
  max: number;
  label: string;
}

function Sparkline({ values, max, label }: SparklineProps): ReactElement {
  const w = 96;
  const h = 22;
  const step = w / (HISTORY - 1);
  const points = values
    .map((v, i) => {
      const x = w - (values.length - 1 - i) * step;
      const y = h - 1.5 - (Math.min(v, max) / max) * (h - 3);
      return x.toFixed(1) + ',' + y.toFixed(1);
    })
    .join(' ');
  return (
    <svg className="spark" width={w} height={h} viewBox={'0 0 ' + w + ' ' + h}
      role="img" aria-label={label}>
      <line x1={0} x2={w} y1={h - 0.5} y2={h - 0.5} className="spark-base" />
      {values.length > 1 && <polyline points={points} className="spark-line" />}
    </svg>
  );
}

// A little specimen drawing, made by the same code that draws the live ones.
function Specimen({ kind, tick }: { kind: Kind; tick: number }) {
  const ref = useRef<HTMLCanvasElement>(null);
  useEffect(() => {
    const c = ref.current;
    const ctx = c?.getContext('2d');
    if (!c || !ctx) return;
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    c.width = 44 * dpr;
    c.height = 30 * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, 44, 30);
    if (isPredator(kind)) {
      const sp = makeSpider(0, kind, 25, 15);
      sp.heading = 0;
      sp.gait = 0.8;
      drawSpider(ctx, sp, readPalette(), kind === 'weaver' ? 5.2 : 6);
      return;
    }
    const u = kind === 'worm' ? 4.6 : 8;
    const bug = makeBug(0, kind, kind === 'worm' ? 40 : 20, 15, 0, u);
    bug.gait = Math.PI / 2;
    drawBug(ctx, bug, u, readPalette());
  }, [kind, tick]);
  return <canvas ref={ref} className="specimen" aria-hidden="true" />;
}

interface RosterRowProps {
  kind: Kind;
  count: number;
  history: readonly number[];
  cap: number;
  meta: string;
  tick: number;
}

function RosterRow({ kind, count, history, cap, meta, tick }: RosterRowProps) {
  const spec = isPredator(kind) ? PREDATORS[kind] : SPECIES[kind];
  return (
    <li style={{ '--tint': 'var(--c-' + kind + ')' } as CSSProperties}>

    </li>
  );
}

type PhasePoints = Snapshot['phase'];

// Plotting predators against prey instead of against time turns the
// boom-and-bust rhythm into loops: the classic Lotka-Volterra picture.
function PhasePlot({ points }: { points: PhasePoints }): ReactElement {
  const w = 268;
  const h = 104;
  const pad = { left: 6, right: 8, top: 16, bottom: 16 };
  const maxX = Math.max(20, ...points.map((p) => p[0]));
  const maxY = Math.max(4, ...points.map((p) => p[1]));
  const px = (x: number) => pad.left + (x / maxX) * (w - pad.left - pad.right);
  const py = (y: number) =>
    h - pad.bottom - (y / maxY) * (h - pad.top - pad.bottom);
  const third = Math.max(1, Math.ceil(points.length / 3));
  const pieces = [0, 1, 2].map((k) =>
    points.slice(Math.max(0, k * third - 1), (k + 1) * third));
  const last = points[points.length - 1];
  const fmt = (seg: PhasePoints) =>
    seg.map(([x, y]) => px(x).toFixed(1) + ',' + py(y).toFixed(1)).join(' ');
  return (
    <figure className="phase">
      <svg viewBox={'0 0 ' + w + ' ' + h} role="img"
        aria-label="Bug population plotted against spider population">
        <line x1={pad.left} y1={h - pad.bottom} x2={w - pad.right}
          y2={h - pad.bottom} className="axis" />
        <line x1={pad.left} y1={pad.top} x2={pad.left} y2={h - pad.bottom}
          className="axis" />
        {pieces.map((seg, k) => seg.length > 1 && (
          <polyline key={k} points={fmt(seg)} className="trail"
            style={{ opacity: 0.2 + k * 0.4 }} />
        ))}
        {last && <circle cx={px(last[0])} cy={py(last[1])} r={3} className="now" />}
        <text x={w - pad.right} y={h - 3} textAnchor="end">{maxX} bugs</text>
        <text x={pad.left + 4} y={11}>{maxY} spiders</text>
      </svg>
      <figcaption>
        Bugs against spiders, a point a second for six minutes. Boom and bust
        draws loops.
      </figcaption>
    </figure>
  );
}

interface TraitBarProps {
  stat: TraitStat | undefined;
  lo: number;
  hi: number;
  base: number;
  label: string;
}

// Where a trait started (the tick), where the population is now (the dot)
// and how spread out it is (the band).
function TraitBar({ stat, lo, hi, base, label }: TraitBarProps): ReactElement {
  const w = 38;
  const h = 14;
  const x = (v: number) => 2 + ((clamp(v, lo, hi) - lo) / (hi - lo)) * (w - 4);
  const text = stat ? label + ' ' + stat.mean.toFixed(2) : label + ', none alive';
  return (
    <svg className="tbar" width={w} height={h} role="img" aria-label={text}>
      <title>{text}</title>
      <line x1={2} x2={w - 2} y1={h / 2} y2={h / 2} className="track" />
      {stat && (
        <rect x={x(stat.lo)} y={h / 2 - 3} height={6} className="band"
          width={Math.max(1.5, x(stat.hi) - x(stat.lo))} />
      )}
      <line x1={x(base)} x2={x(base)} y1={2} y2={h - 2} className="base" />
      {stat && <circle cx={x(stat.mean)} cy={h / 2} r={2.6} className="mean" />}
    </svg>
  );
}

interface TraitColumn<T> { key: keyof T & string; label: string }
interface TraitRowData<T> {
  kind: Kind;
  stats: Record<keyof T, TraitStat> | null;
  gen: number;
  base: T;
  show?: readonly (keyof T)[];
}

// A generic component: the column keys must be keys of the gene type the
// rows carry, so a typo in a column name is a compile error.
function TraitTable<T extends Record<string, number>>({ columns, rows, bounds }: {
  columns: readonly TraitColumn<T>[];
  rows: readonly TraitRowData<T>[];
  bounds: Bounds<T>;
}): ReactElement {
  return (
    <table className="traits">
      <thead>
        <tr>
          <th scope="col"><span className="sr-only">Kind</span></th>
          {columns.map((c) => <th key={c.key} scope="col">{c.label}</th>)}
          <th scope="col">Gen</th>
        </tr>
      </thead>
      <tbody>
        {rows.map((r) => (
          <tr key={r.kind}
            style={{ '--tint': 'var(--c-' + r.kind + ')' } as CSSProperties}>
            <th scope="row">{commonOf(r.kind).split(' ')[0]}</th>
            {columns.map((c) => (
              <td key={c.key}>
                {!r.show || r.show.includes(c.key) ? (
                  <TraitBar stat={r.stats?.[c.key]} lo={bounds[c.key][0]}
                    hi={bounds[c.key][1]} base={r.base[c.key]}
                    label={commonOf(r.kind) + ' ' + c.label.toLowerCase()} />
                ) : <span className="na" aria-hidden="true">\xB7</span>}
              </td>
            ))}
            <td className="gen">{r.gen}</td>
          </tr>
        ))}
      </tbody>
    </table>
  );
}

const commonOf = (k: Kind): string =>
  isPredator(k) ? PREDATORS[k].common : SPECIES[k].common;

const BUG_COLUMNS: readonly TraitColumn<Traits>[] = [

// The pinned specimen, drawn from its own genes at a larger size.
function SpecimenPortrait({ card, tick }: { card: SpecimenCard; tick: number }) {
  const ref = useRef<HTMLCanvasElement>(null);
  useEffect(() => {
    const c = ref.current;
    const ctx = c?.getContext('2d');
    if (!c || !ctx) return;
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    c.width = 96 * dpr;
    c.height = 64 * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, 96, 64);
    const pal = readPalette();
    if (card.what === 'spider') {
      const sp = makeSpider(0, card.kind, 52, 32, 1, card.genes);
      sp.heading = 0;
      sp.gait = 0.8;
      drawSpider(ctx, sp, pal, 11);
      return;
    }
    const u = card.kind === 'worm' ? 8 : 14 / card.genes.size;
    const x = card.kind === 'worm' ? 84 : 46;
    const bug = makeBug(0, card.kind, x, 32, 0, u,
      { genes: card.genes, appetite: card.appetite, gen: card.gen });
    bug.gait = Math.PI / 2;
    drawBug(ctx, bug, u, pal);
  }, [card, tick]);
  return <canvas ref={ref} className="portrait" aria-hidden="true" />;
}

function SpecimenLabel({ card, tick }: { card: SpecimenCard; tick: number }) {
  const rows = card.what === 'bug'

      b: TRAIT_BOUNDS[c.key] }))
    : SPIDER_SHOWS[card.kind].map((k) => ({
      label: SPIDER_COLUMNS.find((c) => c.key === k)?.label ?? k,
      v: card.genes[k], b: SPIDER_BOUNDS[k] }));
  return (
    <figure className="label-card">
      <SpecimenPortrait card={card} tick={tick} />
      <figcaption>
        <i>{card.name}</i>
        <span>{commonOf(card.kind)}, generation {card.gen}</span>
      </figcaption>
      <dl className="genes">
        {rows.map((r) => (
          <div key={r.label}>
            <dt>{r.label}</dt>
            <dd>
              <TraitBar stat={{ mean: r.v, lo: r.v, hi: r.v }} lo={r.b[0]}
                hi={r.b[1]} base={r.v} label={r.label} />
              <span>{r.v.toFixed(2)}</span>
            </dd>
          </div>
        ))}
      </dl>
      {card.what === 'bug' && <DietBars appetite={card.appetite} />}

  );
}

const TABS = [

const pct = (x: number): string => Math.round(x * 100) + '%';

export interface InfestationProps {
  /** The text to live in. Pass this file's own source for the full effect. */
  source: string;
}

export default function Infestation({ source }: InfestationProps): ReactElement {
  const canvasRef = useRef<HTMLCanvasElement>(null);
  const hostRef = useRef<HTMLDivElement>(null);
  const world = useRef<World | null>(null);
  const [snap, setSnap] = useState<Snapshot | null>(null);
  const [worldH, setWorldH] = useState<number | null>(null);
  const [themeTick, setThemeTick] = useState(0);
  const [notesOpen, setNotesOpen] = useState(
    () => window.innerWidth >= DOCK_AT);
  const [tab, setTab] = useState<TabId>('census');

  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    let alive = true;
    let size = [0, 0];
    const rebuild = (): void => {
      if (!alive) return;
      const next = [document.documentElement.clientWidth, window.innerHeight];
      // Phones resize the viewport as the address bar slides; ignore that.
      if (next[0] === size[0] && Math.abs(next[1] - size[1]) < 120) return;
      size = next;
      world.current = createWorld(canvas, source, world.current);
      setWorldH(world.current.L.H);
      setSnap(takeSnapshot(world.current));
    };
    void Promise.all([
      document.fonts.load('16px "Fragment Mono"'),
      document.fonts.load('italic 16px "Instrument Serif"'),
    ]).catch(() => []).then(rebuild);

    let timer = 0;
    const onResize = (): void => {
      window.clearTimeout(timer);
      timer = window.setTimeout(rebuild, 160);
    };
    const onTheme = (): void => {
      if (world.current) repaint(world.current);
      setThemeTick((t) => t + 1);
    };
    const dark = window.matchMedia('(prefers-color-scheme: dark)');
    const watcher = new MutationObserver(onTheme);
    window.addEventListener('resize', onResize);
    dark.addEventListener('change', onTheme);
    watcher.observe(document.documentElement,
      { attributes: true, attributeFilter: ['data-theme'] });
    return () => {
      alive = false;
      window.clearTimeout(timer);
      window.removeEventListener('resize', onResize);
      dark.removeEventListener('change', onTheme);
      watcher.disconnect();
    };
  }, [source]);

  useAnimationFrame((dt) => {
    const w = world.current;
    const host = hostRef.current;
    if (!w || !host) return;
    w.cam = clamp(-host.getBoundingClientRect().top, 0, w.L.H - w.L.viewH);
    if (!w.paused) step(w, dt);
    render(w);
  });

  useInterval(() => {
    if (world.current) setSnap(takeSnapshot(world.current));
  }, 250);

  const act = (f: (w: World) => void) => (): void => {
    const w = world.current;
    if (!w) return;
    f(w);
    setSnap(takeSnapshot(w));
  };

  useEffect(() => {
    const onKey = (e: KeyboardEvent): void => {
      const w = world.current;
      if (!w || e.metaKey || e.ctrlKey || e.altKey) return;
      const tag = (e.target as HTMLElement | null)?.tagName ?? '';
      if (tag === 'INPUT' || tag === 'TEXTAREA') return;
      const key = e.key.toLowerCase();
      if (key === 'r') recompile(w);
      else if (key === 'b') release(w);
      else if (key === 's') releaseHunters(w);
      else if (key === 'l') w.lens = !w.lens;
      else if (key === ' ' && tag !== 'BUTTON') {
        e.preventDefault();
        w.paused = !w.paused;
      } else return;
      setSnap(takeSnapshot(w));
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, []);

  const track = (e: PointerEvent<HTMLCanvasElement>): void => {
    const w = world.current;
    if (!w) return;
    w.pointer.x = e.nativeEvent.offsetX;
    w.pointer.y = e.nativeEvent.offsetY;
    w.pointer.inside = true;
    w.pointer.touch = e.pointerType !== 'mouse';
  };
  const leave = (): void => {
    if (world.current) world.current.pointer.inside = false;
  };

  return (
    <div className="inf">
      <style>{CSS}</style>
      <div ref={hostRef} className="inf-host"
        style={{ height: worldH ?? '100vh' }}>
        <canvas
          ref={canvasRef}
          className="inf-glass"
          aria-label="The source code of this page, with bugs eating it"
          onPointerMove={track}
          onPointerDown={(e) => {
            track(e);
            const w = world.current;
            if (w) tryPin(w, w.pointer.x, w.pointer.y + w.cam);
          }}
          onPointerUp={(e) => { if (e.pointerType !== 'mouse') leave(); }}
          onPointerLeave={leave}
          onPointerCancel={leave}
        />
      </div>

      <aside className={'notes' + (notesOpen ? ' is-open' : '')}>
        <div className="notes-head">
          <h1>Infestation.tsx</h1>
          <button type="button" className="notes-toggle"
            aria-expanded={notesOpen} onClick={() => setNotesOpen((o) => !o)}>
            {notesOpen ? 'Hide notes' : 'Field notes'}
          </button>
        </div>

        <div className="notes-body">
          <p className="lede">
            This page is drawn from its own source code. Four species of bug
            live in it, each eating a different kind of token, and two spiders
            hunt the bugs.
          </p>

          <div className="tabs" role="tablist" aria-label="Field notes">
            {TABS.map((t) => (
              <button key={t.id} type="button" role="tab" id={'tab-' + t.id}
                aria-selected={tab === t.id} aria-controls="tab-panel"
                onClick={() => setTab(t.id)}>
                {t.label}
              </button>
            ))}
          </div>

          <div className="tab-panel" id="tab-panel" role="tabpanel"
            aria-labelledby={'tab-' + tab}>
            {tab === 'census' && (
              <>
                <ul className="roster">
                  {SPECIES_LIST.map((s) => (
                    <RosterRow key={s} kind={s} tick={themeTick}
                      count={snap?.pop[s] ?? 0}
                      history={snap?.history[s] ?? []}
                      cap={snap?.caps[s] ?? SPECIES[s].cap}
                      meta={(snap?.hatching ? 'arriving' : pct(snap?.food[s] ?? 1)
                        + ' food') + ((snap?.pinned[s] ?? 0) > 0
                        ? ', ' + snap?.pinned[s] + ' pinned' : '')} />
                  ))}
                </ul>
                <ul className="roster hunters">
                  {PREDATOR_LIST.map((k) => (
                    <RosterRow key={k} kind={k} tick={themeTick}
                      count={snap?.hunters[k] ?? 0}
                      history={snap?.hunterHistory[k] ?? []}
                      cap={Math.max(4, ...(snap?.hunterHistory[k] ?? [])) * 1.2}
                      meta={(snap?.caught[k] ?? 0) + ' caught'
                        + ((snap?.pinnedHunters[k] ?? 0) > 0
                          ? ', ' + snap?.pinnedHunters[k] + ' pinned' : '')} />
                  ))}
                </ul>

                <p className="aside">
                  {snap?.typeEaters === 'now'
                    ? 'Something here has learned to eat types.'
                    : snap?.typeEaters === 'once'
                      ? 'Something here learned to eat types, then died out.'
                      : 'Nothing here eats a type.'}
                </p>

                <PhasePlot points={snap?.phase ?? []} />

                <div className="gauge" aria-label="Source intact">
                  <div className="gauge-bar">
                    <span style={{ width: pct(snap?.intact ?? 1) }} />
                  </div>
                  <span>{pct(snap?.intact ?? 1)} of the source intact</span>
                </div>
              </>
            )}
            {tab === 'evolution' && snap && (
              <Evolution snap={snap} tick={themeTick}
                onRate={(rate) => {
                  const w = world.current;
                  if (!w) return;
                  w.mutation = rate;
                  setSnap(takeSnapshot(w));
                }} />
            )}
            {tab === 'log' && (
              (snap?.log.length ?? 0) > 0
                ? <FieldLog entries={snap?.log ?? []} />
                : <p className="caption">Nothing has happened yet.</p>
            )}
          </div>

          <p className="hint" aria-live="polite">{snap ? hintFor(snap) : ''}</p>
          {snap?.tall && (
            <p className="hint quiet">Scroll to see the rest of the file.</p>
          )}
        </div>

        <div className="controls">
          <button type="button" onClick={act(recompile)}>
            Recompile <kbd>R</kbd>
          </button>
          <button type="button" onClick={act((w) => release(w))}>
            Release bugs <kbd>B</kbd>
          </button>
          <button type="button" onClick={act(releaseHunters)}>
            Release spiders <kbd>S</kbd>
          </button>
          <button type="button" aria-pressed={snap?.lens ?? true}
            onClick={act((w) => { w.lens = !w.lens; })}>
            Loupe <kbd>L</kbd>
          </button>
          <button type="button" aria-pressed={snap?.paused ?? false}
            onClick={act((w) => { w.paused = !w.paused; })}>
            {snap?.paused ? 'Resume' : 'Pause'} <kbd>Space</kbd>
          </button>
        </div>
      </aside>
    </div>
  );
}
