<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Grand Complication Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: full-bleed WebGL bench. UI reads like a horological drawing: a title block,
   a plate caption panel (right on desktop, bottom sheet on phones), balloon callouts
   numbered to the parts list, and a transport dock for time. Dark-first. */
:root {
  --bg: #0c0f14;
  --stage-hi: #1d2430;
  --stage-lo: #07090c;
  --panel: rgba(16, 20, 27, 0.86);
  --panel-solid: #12161d;
  --ink: #ece6da;
  --ink-2: #a3a9b4;
  --ink-3: #6f7682;
  --rule: rgba(236, 230, 218, 0.13);
  --rule-2: rgba(236, 230, 218, 0.24);
  --brass: #d9b06a;
  --brass-ink: #1a1307;
  --brass-tint: rgba(217, 176, 106, 0.14);
  --ruby: #e2566d;
  --blued: #8fa6ff;
  --axis: #9aa4b2;
  --shadow: 0.85;
  --grid: rgba(236, 230, 218, 0.035);
  --display: "Bodoni Moda", "Bodoni 72", Didot, "Times New Roman", serif;
  --ui: Barlow, "Helvetica Neue", Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #e4e8ec; --stage-hi: #f7f8f9; --stage-lo: #c9d0d7; --panel: rgba(248, 249, 250, 0.9); --panel-solid: #f6f7f8;
    --ink: #141922; --ink-2: #4a5361; --ink-3: #7a8390; --rule: rgba(20, 25, 34, 0.13); --rule-2: rgba(20, 25, 34, 0.26);
    --brass: #8a5f12; --brass-ink: #fff9ec; --brass-tint: rgba(138, 95, 18, 0.1); --ruby: #b0233c; --blued: #2c48b0;
    --axis: #5d6775; --shadow: 0.42; --grid: rgba(20, 25, 34, 0.045); color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #e4e8ec; --stage-hi: #f7f8f9; --stage-lo: #c9d0d7; --panel: rgba(248, 249, 250, 0.9); --panel-solid: #f6f7f8;
  --ink: #141922; --ink-2: #4a5361; --ink-3: #7a8390; --rule: rgba(20, 25, 34, 0.13); --rule-2: rgba(20, 25, 34, 0.26);
  --brass: #8a5f12; --brass-ink: #fff9ec; --brass-tint: rgba(138, 95, 18, 0.1); --ruby: #b0233c; --blued: #2c48b0;
  --axis: #5d6775; --shadow: 0.42; --grid: rgba(20, 25, 34, 0.045); color-scheme: light;
}
html, body { height: 100%; }
body {
  margin: 0; overflow: hidden; color: var(--ink); font: 400 15px/1.5 var(--ui);
  background: var(--bg);
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
}
#app { position: fixed; inset: 0; overflow: hidden;
  background:
    radial-gradient(ellipse 70% 60% at 38% 42%, var(--stage-hi), transparent 72%),
    repeating-linear-gradient(0deg, var(--grid) 0 1px, transparent 1px 40px),
    repeating-linear-gradient(90deg, var(--grid) 0 1px, transparent 1px 40px),
    linear-gradient(var(--stage-lo), var(--stage-lo));
}
#stage { position: absolute; inset: 0; touch-action: none; }
#stage canvas { display: block; touch-action: none; cursor: grab; }
#stage canvas:active { cursor: grabbing; }
#leaders { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
#leaders line { stroke: var(--brass); stroke-width: 1; transition: opacity .25s; }
#balloons { position: absolute; inset: 0; pointer-events: none; }
.balloon {
  position: absolute; left: 0; top: 0; display: flex; align-items: center; gap: 7px; white-space: nowrap;
  padding: 3px 10px 3px 3px; border-radius: 999px; background: var(--panel); border: 1px solid var(--rule-2);
  font: 500 12.5px/1 var(--ui); color: var(--ink); pointer-events: auto; cursor: pointer; transition: opacity .25s;
  -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
}
.balloon .bn { display: grid; place-items: center; min-width: 20px; height: 20px; padding: 0 4px; box-sizing: border-box; border-radius: 999px;
  border: 1px solid var(--brass); color: var(--brass); font: 500 10.5px/1 var(--mono); font-variant-numeric: tabular-nums; }

/* ---------- title block + clock */
#topbar { position: fixed; top: 0; left: 0; right: 0; display: flex; align-items: flex-start; justify-content: space-between; gap: 16px;
  padding: calc(env(safe-area-inset-top, 0px) + 16px) 20px 0; pointer-events: none; z-index: 5; }
#topbar > * { pointer-events: auto; }
.tb { display: grid; gap: 4px; }
.tb-name { font: 500 23px/1.05 var(--display); letter-spacing: 0.01em; text-wrap: balance; }
.tb-name i { font-style: italic; color: var(--brass); }
.tb-sub { font: 600 10.5px/1.3 var(--ui); letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-3); }
#clock { display: grid; justify-items: start; gap: 4px; border-left: 1px solid var(--rule-2); padding-left: 16px; }
.ck-time { font: 500 26px/1 var(--mono); font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
.ck-date { font: 500 12.5px/1.2 var(--ui); color: var(--ink-2); }
.ck-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.status { font: 600 11px/1 var(--ui); letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-2); padding: 5px 8px 5px 18px; border-radius: 999px; border: 1px solid var(--rule); position: relative; }
.status::before { content: ""; position: absolute; left: 7px; top: 50%; width: 6px; height: 6px; margin-top: -3px; border-radius: 50%; background: var(--ink-3); }
.status[data-state="live"]::before { background: var(--ruby); animation: beat 0.4s steps(2) infinite; }
.status[data-state="slow"]::before { background: var(--blued); }
.status[data-state="fast"]::before, .status[data-state="busy"]::before { background: var(--brass); }
.status[data-state="warn"] { color: var(--ruby); border-color: var(--ruby); }
@keyframes beat { 50% { opacity: .35; } }
.leftcol { display: flex; gap: 18px; align-items: flex-start; }

/* ---------- buttons */
button { font: inherit; color: inherit; }
.act, .rate, .chip, #dock button, .sh-nav button, #plIndex button {
  appearance: none; border: 1px solid var(--rule-2); background: transparent; color: var(--ink); border-radius: 6px;
  font: 500 13px/1 var(--ui); padding: 9px 12px; cursor: pointer; transition: background .15s, border-color .15s, color .15s; white-space: nowrap;
}
.act:hover, #dock button:hover, .sh-nav button:hover:not(:disabled) { border-color: var(--brass); }
.act.primary { background: var(--brass); color: var(--brass-ink); border-color: var(--brass); font-weight: 600; }
.act.primary.down { filter: brightness(1.12); transform: translateY(1px); }
[aria-pressed="true"].act, [aria-pressed="true"].rate, #dock [aria-pressed="true"] { background: var(--brass-tint); border-color: var(--brass); color: var(--brass); }
:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
button:disabled { opacity: .35; cursor: default; }

/* ---------- plate panel */
#sheet { position: fixed; top: 16px; right: 16px; bottom: 16px; width: 392px; display: flex; flex-direction: column; z-index: 6;
  background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  box-shadow: 0 20px 60px rgba(0,0,0,.25); }
.sh-head { display: flex; align-items: flex-start; gap: 12px; padding: 18px 18px 12px 22px; border-bottom: 1px solid var(--rule); }
.sh-handle { all: unset; flex: 1; min-width: 0; display: grid; gap: 6px; cursor: default; }
.sh-handle:focus-visible { outline: 2px solid var(--brass); outline-offset: 4px; border-radius: 4px; }
#plKicker { font: 600 11px/1 var(--ui); letter-spacing: 0.16em; text-transform: uppercase; color: var(--brass); }
#plTitle { font: 500 30px/1.08 var(--display); text-wrap: balance; }
.sh-nav { display: flex; gap: 6px; padding-top: 2px; }
.sh-nav button { width: 38px; height: 38px; padding: 0; font: 400 20px/1 var(--display); }
.sh-scroll { flex: 1; overflow-y: auto; overscroll-behavior: contain; padding: 4px 22px 18px; display: grid; gap: 14px; align-content: start; }
#plBody { font-size: 15.5px; line-height: 1.58; color: var(--ink); max-width: 62ch; }
#plBody p { margin: 12px 0 0; }
#plBody b { font-weight: 600; color: var(--brass); font-variant-numeric: tabular-nums; }
#plBody a { color: var(--brass); }
#plBody .sources { font-size: 12.5px; color: var(--ink-2); }
table.ratio, table.facts { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 13px; font-variant-numeric: tabular-nums; }
table.ratio th, table.facts th { text-align: left; font: 600 10.5px/1.3 var(--ui); letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-3); padding: 6px 6px 6px 0; border-bottom: 1px solid var(--rule-2); }
table.ratio td, table.facts td { padding: 7px 6px 7px 0; border-bottom: 1px solid var(--rule); vertical-align: top; }
table.ratio td:nth-child(2) { font-family: var(--mono); color: var(--brass); white-space: nowrap; }
table.facts td:first-child { color: var(--ink-2); white-space: nowrap; }
table.facts td:last-child { color: var(--brass); }
#plActions { display: flex; flex-wrap: wrap; gap: 8px; }
.seg { display: grid; gap: 6px; width: 100%; }
.seg-l { font: 600 10.5px/1 var(--ui); letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-3); }
.seg-row { display: flex; gap: 6px; flex-wrap: wrap; }
#plNote { font-size: 13.5px; line-height: 1.5; color: var(--ink); border-left: 2px solid var(--brass); padding: 2px 0 2px 12px; margin: 0; }
#plReadouts { display: grid; grid-template-columns: 1fr; margin: 0; border-top: 1px solid var(--rule-2); }
.ro { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--rule); }
.ro dt { font: 600 10.5px/1.2 var(--ui); letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-3); }
.ro dd { margin: 0; font: 500 13px/1.25 var(--mono); font-variant-numeric: tabular-nums; text-align: right; color: var(--ink); min-width: 0; }
.phases { display: inline-flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
.phases i { font-style: normal; font: 500 11px/1 var(--ui); padding: 4px 6px; border-radius: 4px; color: var(--ink-3); border: 1px solid var(--rule); }
.phases i.on { color: var(--brass-ink); background: var(--brass); border-color: var(--brass); }
#plIndex { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 3px; padding: 12px 18px 16px 22px; border-top: 1px solid var(--rule); }
#plIndex button { padding: 7px 0; min-width: 0; font: 500 12px/1 var(--display); color: var(--ink-2); border-color: transparent; }
#plIndex button[aria-current="step"] { color: var(--brass); border-color: var(--brass); }

/* ---------- dock */
#dock { position: fixed; left: 16px; right: 432px; bottom: 16px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; z-index: 5;
  padding: 8px; background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); }
#rates { display: flex; gap: 2px; padding: 2px; border: 1px solid var(--rule); border-radius: 8px; }
#rates .rate { border-color: transparent; padding: 8px 10px; font-variant-numeric: tabular-nums; }
#dock #btnNow { color: var(--ruby); border-color: var(--ruby); }
.explode { display: flex; align-items: center; gap: 8px; font: 600 10.5px/1 var(--ui); letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-3); flex: 1; min-width: 150px; }
.explode input { flex: 1; min-width: 80px; accent-color: var(--brass); }
#btnSound span, #btnLayers span { pointer-events: none; }

/* ---------- layers + part card */
#layersPanel, #partCard { position: fixed; left: 16px; bottom: 84px; z-index: 7; background: var(--panel-solid); border: 1px solid var(--rule-2); border-radius: 10px; box-shadow: 0 18px 50px rgba(0,0,0,.3); }
#layersPanel { width: 290px; padding: 12px; left: auto; right: 432px; }
#layersPanel h3, #partCard h3 { margin: 0; }
.lp-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.lp-head h3 { font: 600 11px/1 var(--ui); letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-3); }
#layerList { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.lrow { display: grid; grid-template-columns: 30px 28px 1fr; align-items: center; gap: 4px; }
.lrow .lk { font: 500 11px/1 var(--mono); color: var(--ink-3); text-align: right; font-variant-numeric: tabular-nums; }
.lrow .lname { all: unset; cursor: pointer; padding: 7px 6px; border-radius: 5px; font: 500 13.5px/1.1 var(--ui); }
.lrow .lname:hover, .lrow .lname:focus-visible { background: var(--brass-tint); color: var(--brass); }
.lrow .eye { width: 26px; height: 26px; padding: 0; border-radius: 50%; border: 1px solid var(--rule-2); background: transparent; cursor: pointer; position: relative; }
.lrow .eye[aria-pressed="true"]::after { content: ""; position: absolute; inset: 7px; border-radius: 50%; background: var(--brass); }
#partCard { width: 340px; padding: 16px 18px; display: grid; gap: 10px; }
.pc-top { display: flex; gap: 10px; align-items: flex-start; }
#pcNum { flex: none; display: grid; place-items: center; min-width: 30px; height: 30px; border-radius: 999px; border: 1px solid var(--brass); color: var(--brass); font: 500 12px/1 var(--mono); }
.pc-t { flex: 1; min-width: 0; display: grid; gap: 4px; }
#pcKind { font: 600 10.5px/1 var(--ui); letter-spacing: 0.14em; text-transform: uppercase; color: var(--brass); }
#pcName { font: 500 21px/1.1 var(--display); }
#pcDesc { margin: 0; font-size: 14px; line-height: 1.5; color: var(--ink); }
.pc-specs { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 0; font-size: 12.5px; }
.pc-specs dt { font: 600 10.5px/1.5 var(--ui); letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-3); }
.pc-specs dd { margin: 0; font: 500 12.5px/1.5 var(--mono); color: var(--ink); min-width: 0; }
.pc-btns { display: flex; gap: 8px; }
#pcClose { margin-left: auto; }

#loading { position: fixed; inset: 0; display: grid; place-items: center; z-index: 20; background: var(--bg); transition: opacity .6s; text-align: center; padding: 0 24px; }
#loading.done { opacity: 0; pointer-events: none; }
#loading p { font: 500 italic 20px/1.4 var(--display); color: var(--ink-2); max-width: 30ch; }

/* ---------- phones and small tablets */
@media (max-width: 899px) {
  #topbar { padding: calc(env(safe-area-inset-top, 0px) + 10px) 14px 10px; background: linear-gradient(var(--bg), transparent); }
  .tb-name { font-size: 18px; }
  .tb-sub { display: none; }
  #clock { border-left: 0; padding-left: 0; justify-items: end; }
  .ck-time { font-size: 19px; }
  .ck-date { font-size: 11.5px; }
  .ck-row { justify-content: flex-end; }
  .status { font-size: 10px; padding: 4px 7px 4px 16px; }
  .status .more { display: none; }
  #sheet { top: auto; left: 0; right: 0; bottom: 0; width: auto; max-height: min(40vh, 380px); border-radius: 14px 14px 0 0; border-bottom: 0;
    padding-bottom: env(safe-area-inset-bottom, 0px); }
  .sh-head { padding: 12px 12px 10px 16px; }
  .sh-handle { cursor: pointer; }
  .sh-handle::before { content: ""; justify-self: center; width: 36px; height: 4px; border-radius: 2px; background: var(--rule-2); margin: -4px 0 4px; grid-column: 1; }
  #plTitle { font-size: 23px; }
  .sh-scroll { padding: 0 16px 12px; }
  #plBody { font-size: 15px; }
  #plIndex { padding: 8px 12px 10px 16px; gap: 2px; }
  #plIndex button { font-size: 11px; }
  #sheet.collapsed .sh-scroll, #sheet.collapsed #plIndex { display: none; }
  #dock { left: 8px; right: 8px; bottom: calc(var(--sheet-h, 260px) + 8px); flex-wrap: nowrap; overflow-x: auto; padding: 6px; gap: 6px; scrollbar-width: none; }
  #dock::-webkit-scrollbar { display: none; }
  #rates .rate { padding: 8px 8px; font-size: 12.5px; }
  .explode { min-width: 120px; flex: none; }
  .explode input { width: 90px; }
  #layersPanel, #partCard { left: 8px; right: 8px; width: auto; bottom: calc(var(--sheet-h, 260px) + 62px); max-height: 50vh; overflow-y: auto; }
  .balloon { font-size: 11px; padding: 2px 8px 2px 2px; gap: 5px; }
  .balloon .bn { min-width: 17px; height: 17px; font-size: 9.5px; }
}
@media (prefers-reduced-motion: reduce) {
  .status[data-state="live"]::before { animation: none; }
  #loading, .balloon, #leaders line { transition: none; }
}
</style>

<div id="app">
  <div id="stage"></div>
  <svg id="leaders" aria-hidden="true"></svg>
  <div id="balloons"></div>

  <header id="topbar">
    <div class="leftcol">
      <div class="tb">
        <div class="tb-name">Grand Complication <i>Atlas</i></div>
        <div class="tb-sub">Calibre A-1 · working model after the Berkley</div>
      </div>
      <section id="clock" aria-label="Time shown by the watch">
        <div class="ck-time" id="ckTime">--:--:--</div>
        <div class="ck-date" id="ckDate">&nbsp;</div>
        <div class="ck-row"><span id="ckStatus" class="status" data-state="live">Live</span></div>
      </section>
    </div>
  </header>

  <aside id="sheet" aria-label="Plates">
    <div class="sh-head">
      <button id="shToggle" class="sh-handle" aria-expanded="true" aria-controls="shScroll">
        <span id="plKicker">Plate I of XII</span>
        <span id="plTitle">The watch</span>
      </button>
      <div class="sh-nav">
        <button id="prev" aria-label="Previous plate">‹</button>
        <button id="next" aria-label="Next plate">›</button>
      </div>
    </div>
    <div class="sh-scroll" id="shScroll">
      <div id="plBody"></div>
      <p id="plNote" hidden></p>
      <div id="plActions"></div>
      <dl id="plReadouts"></dl>
    </div>
    <nav id="plIndex" aria-label="All plates"></nav>
  </aside>

  <div id="dock">
    <div id="rates" role="group" aria-label="Speed"></div>
    <button id="btnNow" hidden>Back to now</button>
    <label class="explode"><span>Explode</span><input type="range" id="explode" min="0" max="100" value="0" aria-label="Explode the movement"></label>
    <button id="btnLayers" aria-expanded="false" aria-controls="layersPanel"><span>Layers</span></button>
    <button id="btnSound" aria-pressed="false"><span>Sound off</span></button>
  </div>

  <div id="layersPanel" hidden>
    <div class="lp-head"><h3>Layers, front to back</h3><button id="showAll" class="act">Show all</button></div>
    <ul id="layerList"></ul>
  </div>

  <div id="partCard" hidden role="dialog" aria-labelledby="pcName">
    <div class="pc-top">
      <span id="pcNum">0</span>
      <div class="pc-t"><span id="pcKind"></span><h3 id="pcName"></h3></div>
    </div>
    <p id="pcDesc"></p>
    <dl class="pc-specs">
      <dt>Teeth</dt><dd id="pcTeeth"></dd>
      <dt>Speed</dt><dd id="pcRate"></dd>
      <dt>Layer</dt><dd id="pcLayer"></dd>
    </dl>
    <div class="pc-btns"><button id="pcIsolate" class="act">Isolate</button><button id="pcClose" class="act">Close</button></div>
  </div>

  <div id="loading"><p>Cutting gear teeth…</p></div>
</div>

<script type="module">
// ============================================================================
// CORE — math helpers, tooth profiles, outlines, procedural textures
// Units: millimetres. Watch frame: x right, y toward 12 o'clock, z out of the dial.
// ============================================================================
import * as THREE from 'https://cdnjs.cloudflare.com/ajax/libs/three.js/0.170.0/three.module.min.js';

const TAU = Math.PI * 2, D2R = Math.PI / 180;
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = t => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
const easeInOut = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const V2 = (x, y) => new THREE.Vector2(x, y);
const P = (r, a) => V2(r * Math.cos(a), r * Math.sin(a));
const fmod = (a, n) => ((a % n) + n) % n;

function circleIntersect(c1, r1, c2, r2, side = 1) {
  const dx = c2[0] - c1[0], dy = c2[1] - c1[1];
  const d = Math.hypot(dx, dy);
  const a = (r1 * r1 - r2 * r2 + d * d) / (2 * d);
  const h = Math.sqrt(Math.max(0, r1 * r1 - a * a));
  const px = c1[0] + a * dx / d, py = c1[1] + a * dy / d;
  return [px - side * h * dy / d, py + side * h * dx / d];
}
const dist = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);

// ---------------------------------------------------------------- outlines
// Cycloidal-style wheel: radial flanks below the pitch circle, ogival addendum.
function wheelOutline(z, m, o = {}) {
  const rp = m * z / 2, ra = rp + (o.add ?? 1.3) * m, rf = rp - (o.ded ?? 1.6) * m;
  const pa = TAU / z, beta = (o.thick ?? 0.44) * pa / 2;
  const nT = o.nTip ?? (z > 60 ? 3 : 4), nR = o.nRoot ?? 2;
  const pts = [];
  for (let i = 0; i < z; i++) {
    const c = i * pa;
    pts.push(P(rf, c - beta), P(rp, c - beta));
    for (let j = 1; j < nT; j++) { const f = j / nT * Math.PI / 2; pts.push(P(rp + (ra - rp) * Math.sin(f), c - beta * Math.pow(Math.cos(f), 1.25))); }
    pts.push(P(ra, c));
    for (let j = nT - 1; j >= 1; j--) { const f = j / nT * Math.PI / 2; pts.push(P(rp + (ra - rp) * Math.sin(f), c + beta * Math.pow(Math.cos(f), 1.25))); }
    pts.push(P(rp, c + beta), P(rf, c + beta));
    const a0 = c + beta, a1 = c + pa - beta;
    for (let j = 1; j < nR; j++) pts.push(P(rf, a0 + (a1 - a0) * j / nR));
  }
  return pts;
}

// Pinion: parallel-sided leaves with semicircular tips, deep spaces.
function pinionOutline(z, m) {
  const rp = m * z / 2, rf = rp - 1.55 * m, w = 0.55 * m;
  const pts = [];
  for (let i = 0; i < z; i++) {
    const c = i * TAU / z, u = V2(Math.cos(c), Math.sin(c)), t = V2(-Math.sin(c), Math.cos(c));
    const at = (r, s) => V2(u.x * r + t.x * s, u.y * r + t.y * s);
    const rb = Math.sqrt(Math.max(rf * rf - w * w, 0.01));
    pts.push(at(rb, -w), at(rp, -w));
    for (let j = 1; j < 6; j++) { const f = j / 6 * Math.PI; pts.push(at(rp + w * Math.sin(f), -w * Math.cos(f))); }
    pts.push(at(rp, w), at(rb, w));
    const a0 = Math.atan2(at(rb, w).y, at(rb, w).x);
    const cn = (i + 1) * TAU / z, un = V2(Math.cos(cn), Math.sin(cn)), tn = V2(-Math.sin(cn), Math.cos(cn));
    const nb = V2(un.x * rb - tn.x * w, un.y * rb - tn.y * w);
    let a1 = Math.atan2(nb.y, nb.x); while (a1 < a0) a1 += TAU;
    for (let j = 1; j < 4; j++) pts.push(P(rf * 0.98, a0 + (a1 - a0) * j / 4));
  }
  return pts;
}

// Calendar star: triangular teeth with rounded tips.
function starOutline(z, rTip, rRoot) {
  const pts = [], pa = TAU / z;
  for (let i = 0; i < z; i++) {
    const c = i * pa;
    pts.push(P(rTip - (rTip - rRoot) * 0.12, c - pa * 0.06), P(rTip, c), P(rTip - (rTip - rRoot) * 0.12, c + pa * 0.06));
    pts.push(P(rRoot, c + pa * 0.5));
  }
  return pts;
}

// Ratchet: sawtooth, drives clockwise (from the back) when wound.
function ratchetOutline(z, rTip, rRoot) {
  const pts = [], pa = TAU / z;
  for (let i = 0; i < z; i++) {
    const c = i * pa;
    pts.push(P(rRoot, c), P(rTip, c + pa * 0.78), P(rTip * 0.995, c + pa * 0.86), P(rRoot, c + pa * 0.98));
  }
  return pts;
}

// Swiss lever escape wheel, club teeth pointing in the clockwise (−angle) direction.
function escapeOutline(z, R) {
  const pts = [], p = TAU / z, rr = R * 0.62;
  for (let i = 0; i < z; i++) {
    const c = i * p;
    pts.push(P(rr, c + 0.2 * p));             // locking-face base (behind the tip: draw angle)
    pts.push(P(R * 0.82, c + 0.1 * p));
    pts.push(P(R, c));                        // locking corner
    pts.push(P(R * 0.99, c + 0.1 * p));       // impulse face of the club
    pts.push(P(R * 0.955, c + 0.24 * p));
    pts.push(P(R * 0.92, c + 0.3 * p));       // heel
    pts.push(P(R * 0.84, c + 0.34 * p));      // back of tooth
    pts.push(P(R * 0.74, c + 0.42 * p));
    pts.push(P(rr, c + 0.56 * p));
    for (let j = 1; j < 3; j++) pts.push(P(rr * 0.995, c + 0.56 * p + 0.64 * p * j / 3));
  }
  return pts;
}

// Stepped cam: radii[i] spans equal angular sectors, counter-clockwise.
function snailOutline(radii, start = 0) {
  const n = radii.length, pts = [], s = TAU / n;
  for (let i = 0; i < n; i++) {
    const a0 = start + i * s, a1 = a0 + s, r = radii[i];
    for (let j = 0; j <= 6; j++) pts.push(P(r, a0 + (a1 - a0) * j / 6));
  }
  return pts;
}

const circlePts = (r, n = 48, cx = 0, cy = 0, a0 = 0) => Array.from({ length: n }, (_, i) => V2(cx + r * Math.cos(a0 + i * TAU / n), cy + r * Math.sin(a0 + i * TAU / n)));

function chaikin(pts, it = 2) {
  for (let k = 0; k < it; k++) {
    const out = [], n = pts.length;
    for (let i = 0; i < n; i++) {
      const p = pts[i], q = pts[(i + 1) % n];
      out.push(V2(p.x * .75 + q.x * .25, p.y * .75 + q.y * .25), V2(p.x * .25 + q.x * .75, p.y * .25 + q.y * .75));
    }
    pts = out;
  }
  return pts;
}

// Windows between spokes ("crossings"). curve > 0 sweeps the spokes.
function spokeHoles(n, rh, rr, w, curve = 0, phase = 0) {
  if (rr - rh < 0.12) return [];
  const holes = [], seg = 10, span = rr - rh;
  const half = r => { const s = (r - rh) / span; return Math.asin(Math.min(0.95, w * (1.25 - 0.45 * s) / r)); };
  const cen = (i, r) => phase + i * TAU / n + curve * Math.pow((r - rh) / span, 1.4);
  for (let i = 0; i < n; i++) {
    const pts = [];
    const aIn0 = cen(i, rh) + half(rh), aIn1 = cen(i + 1, rh) - half(rh);
    if (aIn1 <= aIn0) continue;
    for (let j = 0; j <= seg; j++) pts.push(P(rh, aIn0 + (aIn1 - aIn0) * j / seg));
    for (let j = 1; j < seg; j++) { const r = rh + span * j / seg; pts.push(P(r, cen(i + 1, r) - half(r))); }
    const aOut1 = cen(i + 1, rr) - half(rr), aOut0 = cen(i, rr) + half(rr);
    for (let j = 0; j <= seg * 2; j++) pts.push(P(rr, aOut1 + (aOut0 - aOut1) * j / (seg * 2)));
    for (let j = seg - 1; j >= 1; j--) { const r = rh + span * j / seg; pts.push(P(r, cen(i, r) + half(r))); }
    holes.push(chaikin(pts, 2));
  }
  return holes;
}

function convexHull(points) {
  const p = points.map(v => [v.x, v.y]).sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
  const lo = [], up = [];
  for (const q of p) { while (lo.length >= 2 && cross(lo[lo.length - 2], lo[lo.length - 1], q) <= 0) lo.pop(); lo.push(q); }
  for (let i = p.length - 1; i >= 0; i--) { const q = p[i]; while (up.length >= 2 && cross(up[up.length - 2], up[up.length - 1], q) <= 0) up.pop(); up.push(q); }
  up.pop(); lo.pop();
  return lo.concat(up).map(a => V2(a[0], a[1]));
}
const hullOfCircles = circles => convexHull(circles.flatMap(c => circlePts(c[2], 40, c[0], c[1])));

function extrude(outline, holes = [], depth = 0.2, bevel = 0) {
  const shape = new THREE.Shape(outline);
  for (const h of holes) shape.holes.push(new THREE.Path(h));
  const g = new THREE.ExtrudeGeometry(shape, {
    depth, steps: 1, curveSegments: 6,
    bevelEnabled: bevel > 0, bevelThickness: bevel, bevelSize: bevel, bevelOffset: -bevel, bevelSegments: 1
  });
  g.translate(0, 0, -depth / 2);
  return g;
}
const boreHole = (r, n = 20) => circlePts(r, n).reverse();

// Rectangular-section sweep (hairspring, mainspring). Rewritten in place each update.
class Strip {
  constructor(maxPts, material) {
    this.max = maxPts;
    const g = new THREE.BufferGeometry();
    this.pos = new Float32Array(maxPts * 4 * 3);
    g.setAttribute('position', new THREE.BufferAttribute(this.pos, 3));
    const idx = [];
    for (let i = 0; i < maxPts - 1; i++) {
      for (let f = 0; f < 4; f++) {
        const a = i * 4 + f, b = i * 4 + (f + 1) % 4, c = a + 4, d = b + 4;
        idx.push(a, c, b, b, c, d);
      }
    }
    g.setIndex(idx);
    this.geo = g;
    this.mesh = new THREE.Mesh(g, material);
    this.mesh.frustumCulled = false;
  }
  // pts: array of [x,y,z]; w = radial thickness, h = height
  set(pts, w, h) {
    const n = Math.min(pts.length, this.max), pos = this.pos;
    for (let i = 0; i < this.max; i++) {
      const k = Math.min(i, n - 1);
      const p = pts[k], q = pts[Math.min(k + 1, n - 1)], o = pts[Math.max(k - 1, 0)];
      let tx = q[0] - o[0], ty = q[1] - o[1]; const tl = Math.hypot(tx, ty) || 1; tx /= tl; ty /= tl;
      const nx = -ty * w / 2, ny = tx * w / 2;
      const cs = [[nx, ny, h / 2], [-nx, -ny, h / 2], [-nx, -ny, -h / 2], [nx, ny, -h / 2]];
      for (let f = 0; f < 4; f++) {
        const j = (i * 4 + f) * 3;
        pos[j] = p[0] + cs[f][0]; pos[j + 1] = p[1] + cs[f][1]; pos[j + 2] = p[2] + cs[f][2];
      }
    }
    this.geo.attributes.position.needsUpdate = true;
    this.geo.computeVertexNormals();
  }
}

// ---------------------------------------------------------------- textures
function canvasTex(size, draw, srgb = true) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d'); draw(g, size);
  const t = new THREE.CanvasTexture(c);
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  t.userData.canvas = c; t.userData.draw = draw;
  return t;
}

// Côtes de Genève — continuous across all bridges (mapped in movement coordinates)
function genevaStripes() {
  const t = canvasTex(1024, (g, s) => {
    g.fillStyle = '#c9ccd0'; g.fillRect(0, 0, s, s);
    g.save(); g.translate(s / 2, s / 2); g.rotate(-28 * D2R); g.translate(-s, -s);
    const band = s / 15;
    for (let x = 0; x < s * 2; x += band) {
      const gr = g.createLinearGradient(x, 0, x + band, 0);
      gr.addColorStop(0, '#9fa4ab'); gr.addColorStop(0.18, '#e9ebee'); gr.addColorStop(0.42, '#ffffff');
      gr.addColorStop(0.7, '#c3c7cc'); gr.addColorStop(1, '#a3a8ae');
      g.fillStyle = gr; g.fillRect(x, 0, band + 1, s * 2);
    }
    g.restore();
    const id = g.getImageData(0, 0, s, s), d = id.data;
    for (let i = 0; i < d.length; i += 4) { const n = (Math.random() - .5) * 10; d[i] += n; d[i + 1] += n; d[i + 2] += n; }
    g.putImageData(id, 0, 0);
  });
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(1 / 44, 1 / 44); t.offset.set(0.5, 0.5);
  return t;
}

// Perlage — overlapping circular graining on the main plate
function perlage() {
  const t = canvasTex(1024, (g, s) => {
    g.fillStyle = '#b9bcc1'; g.fillRect(0, 0, s, s);
    const step = s / 34, r = step * 0.92;
    for (let row = -1; row < 36; row++) for (let col = -1; col < 36; col++) {
      const x = col * step + (row % 2) * step * 0.5, y = row * step * 0.86;
      let gr;
      if (g.createConicGradient) {
        gr = g.createConicGradient((row * 7 + col * 3) % 6, x, y);
        for (let k = 0; k <= 8; k++) gr.addColorStop(k / 8, k % 2 ? '#e8eaed' : '#a7abb1');
      } else { gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, '#eceef0'); gr.addColorStop(1, '#a3a7ad'); }
      g.fillStyle = gr; g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill();
      g.strokeStyle = 'rgba(80,84,92,0.25)'; g.lineWidth = 1; g.stroke();
    }
  });
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(1 / 30, 1 / 30);
  return t;
}

// Circular graining (snailing) for barrel cover & ratchet wheel — centered, local coords
function snailing(rMax) {
  const t = canvasTex(512, (g, s) => {
    g.fillStyle = '#c6c9ce'; g.fillRect(0, 0, s, s);
    if (g.createConicGradient) {
      for (let r = s / 2; r > 4; r -= 3) {
        const gr = g.createConicGradient(r * 0.05, s / 2, s / 2);
        for (let k = 0; k <= 12; k++) gr.addColorStop(k / 12, k % 2 ? '#f2f3f5' : '#a8acb3');
        g.strokeStyle = gr; g.lineWidth = 2.2; g.beginPath(); g.arc(s / 2, s / 2, r, 0, TAU); g.stroke();
      }
    }
  });
  t.repeat.set(1 / (2 * rMax), 1 / (2 * rMax)); t.offset.set(0.5, 0.5);
  return t;
}

// ============================================================================
// DIAL & MOON — painted to canvas in movement millimetres
// ============================================================================
const DIAL = {
  R: 20,
  date: [0, 9.5], dateR: 4.4,
  day: [-9.5, 0], dayR: 4.0,
  month: [9.5, 0.6], monthR: 4.0,
  leap: [6.6, 6.9], leapR: 2.0,
  reserve: [-6.6, 6.9], reserveR: 2.0,
  tb: [0, -9.2], tbR: 4.6,
  moonWin: { cx: 0, y0: 10.3, R: 1.5 },
};
const FONT_DISPLAY = '"Bodoni Moda", "Bodoni 72", Didot, Georgia, serif';
const FONT_UI = 'Barlow, "Helvetica Neue", Arial, sans-serif';

function drawDial(g, S) {
  const k = S / 40, X = x => (x + 20) * k, Y = y => (20 - y) * k, Rk = r => r * k;
  g.clearRect(0, 0, S, S);
  // silvered opaline base
  let gr = g.createRadialGradient(X(-5), Y(8), 0, X(0), Y(0), Rk(21));
  gr.addColorStop(0, '#f4f2ec'); gr.addColorStop(0.6, '#e6e3dc'); gr.addColorStop(1, '#d3d0c8');
  g.fillStyle = gr; g.fillRect(0, 0, S, S);

  // rose-engine guilloché in the centre field
  g.save(); g.beginPath(); g.arc(X(0), Y(0), Rk(15.3), 0, TAU); g.clip();
  g.lineWidth = Math.max(1, k * 0.035);
  for (let r = 0.5, i = 0; r < 15.4; r += 0.13, i++) {
    g.beginPath();
    for (let s = 0; s <= 720; s++) {
      const a = s / 720 * TAU;
      const rr = r + 0.07 * Math.sin(24 * a + r * 0.9) + 0.03 * Math.sin(72 * a);
      const x = X(rr * Math.cos(a)), y = Y(rr * Math.sin(a));
      s ? g.lineTo(x, y) : g.moveTo(x, y);
    }
    g.strokeStyle = i % 2 ? 'rgba(255,255,255,0.55)' : 'rgba(120,112,98,0.20)';
    g.stroke();
  }
  g.restore();

  // chapter ring
  g.save(); g.beginPath(); g.arc(X(0), Y(0), Rk(19.6), 0, TAU); g.arc(X(0), Y(0), Rk(15.4), 0, TAU, true); g.clip();
  gr = g.createLinearGradient(0, 0, S, S);
  gr.addColorStop(0, '#f6f4ef'); gr.addColorStop(0.5, '#e4e1da'); gr.addColorStop(1, '#efede8');
  g.fillStyle = gr; g.fillRect(0, 0, S, S); g.restore();
  g.strokeStyle = 'rgba(40,36,30,0.5)'; g.lineWidth = k * 0.05;
  for (const r of [15.4, 18.1, 18.9]) { g.beginPath(); g.arc(X(0), Y(0), Rk(r), 0, TAU); g.stroke(); }
  // minute track (railroad)
  g.fillStyle = '#1d1a16';
  for (let m = 0; m < 60; m++) {
    const a = Math.PI / 2 - m * TAU / 60;
    const r0 = m % 5 ? 18.1 : 17.8, r1 = 18.9;
    g.save(); g.translate(X(r0 * Math.cos(a)), Y(r0 * Math.sin(a))); g.rotate(-a + Math.PI / 2);
    const w = Rk(m % 5 ? 0.06 : 0.12); g.fillRect(-w / 2, -Rk(r1 - r0), w, Rk(r1 - r0)); g.restore();
  }
  // Roman numerals, radial
  const roman = ['XII', 'I', 'II', 'III', 'IIII', 'V', 'VI', 'VII', 'VIII', 'IX', 'X', 'XI'];
  g.fillStyle = '#16130f'; g.textAlign = 'center'; g.textBaseline = 'middle';
  for (let h = 0; h < 12; h++) {
    const a = Math.PI / 2 - h * TAU / 12, r = 16.65;
    g.save(); g.translate(X(r * Math.cos(a)), Y(r * Math.sin(a))); g.rotate(-a + Math.PI / 2);
    g.font = `500 ${Rk(1.75)}px ${FONT_DISPLAY}`; g.fillText(roman[h], 0, Rk(0.05)); g.restore();
  }

  const sub = (c, R, fill = true) => {
    g.save(); g.beginPath(); g.arc(X(c[0]), Y(c[1]), Rk(R), 0, TAU); g.clip();
    if (fill) {
      g.fillStyle = '#dcd8cf'; g.fillRect(X(c[0] - R), Y(c[1] + R), Rk(2 * R), Rk(2 * R));
      g.lineWidth = Math.max(1, k * 0.03);
      for (let r = 0.1; r < R; r += 0.075) {
        g.strokeStyle = (r / 0.075 | 0) % 2 ? 'rgba(255,255,255,0.6)' : 'rgba(90,84,74,0.16)';
        g.beginPath(); g.arc(X(c[0]), Y(c[1]), Rk(r), 0, TAU); g.stroke();
      }
    }
    g.restore();
    g.strokeStyle = 'rgba(30,26,22,0.55)'; g.lineWidth = k * 0.045;
    g.beginPath(); g.arc(X(c[0]), Y(c[1]), Rk(R), 0, TAU); g.stroke();
    // engraved shadow edge
    g.strokeStyle = 'rgba(255,255,255,0.7)'; g.lineWidth = k * 0.04;
    g.beginPath(); g.arc(X(c[0]), Y(c[1]) + k * 0.05, Rk(R), 0.2, Math.PI - 0.2); g.stroke();
  };
  const ticks = (c, r0, r1, n, every = 1, w = 0.05, a0 = 0, span = TAU) => {
    g.fillStyle = '#1d1a16';
    for (let i = 0; i < n; i++) {
      if (i % every) continue;
      const a = Math.PI / 2 - a0 - i * span / n;
      g.save(); g.translate(X(c[0] + r1 * Math.cos(a)), Y(c[1] + r1 * Math.sin(a))); g.rotate(-a + Math.PI / 2);
      g.fillRect(-Rk(w) / 2, 0, Rk(w), Rk(r1 - r0)); g.restore();
    }
  };
  const label = (c, r, a, txt, size, font = FONT_UI, weight = 600, rotate = true) => {
    const ang = Math.PI / 2 - a;
    g.save(); g.translate(X(c[0] + r * Math.cos(ang)), Y(c[1] + r * Math.sin(ang)));
    if (rotate) g.rotate(-ang + Math.PI / 2);
    g.font = `${weight} ${Rk(size)}px ${font}`; g.fillStyle = '#1d1a16'; g.fillText(txt, 0, 0); g.restore();
  };

  // date + moon at 12
  sub(DIAL.date, DIAL.dateR);
  ticks(DIAL.date, 3.85, 4.25, 31, 1, 0.045);
  for (let d = 1; d <= 31; d++) if (d === 1 || d % 5 === 0) label(DIAL.date, 3.35, (d - 1) * TAU / 31, String(d), 0.62, FONT_DISPLAY, 600);
  // moon window bezel
  const mw = DIAL.moonWin;
  g.strokeStyle = 'rgba(30,26,22,0.6)'; g.lineWidth = k * 0.05;
  g.beginPath(); g.arc(X(mw.cx), Y(mw.y0), Rk(mw.R + 0.12), Math.PI, 0); g.stroke();
  label(DIAL.date, 1.15, Math.PI, 'DATE', 0.36, FONT_UI, 600, false);

  // day at 9
  sub(DIAL.day, DIAL.dayR);
  const days = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
  ticks(DIAL.day, 3.55, 3.85, 7, 1, 0.08);
  days.forEach((d, i) => label(DIAL.day, 2.85, i * TAU / 7, d, 0.5));
  // month at 3
  sub(DIAL.month, DIAL.monthR);
  const months = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];
  ticks(DIAL.month, 3.55, 3.85, 12, 1, 0.06);
  months.forEach((m, i) => label(DIAL.month, 2.95, i * TAU / 12, m, 0.42));
  // leap-year cycle (top right)
  sub(DIAL.leap, DIAL.leapR);
  ['L', 'I', 'II', 'III'].forEach((t, i) => label(DIAL.leap, 1.35, i * TAU / 4, t, 0.5, FONT_DISPLAY, 600));
  ticks(DIAL.leap, 1.75, 1.95, 48, 12, 0.06);
  label(DIAL.leap, 0.75, Math.PI, 'LEAP', 0.26, FONT_UI, 600, false);
  // power reserve (top left), 0–60 h over 240°
  sub(DIAL.reserve, DIAL.reserveR);
  for (let h = 0; h <= 60; h += 5) {
    const a = -120 * D2R + h / 60 * 240 * D2R;
    ticks([DIAL.reserve[0], DIAL.reserve[1]], h % 10 ? 1.72 : 1.55, 1.95, 1, 1, h % 10 ? 0.05 : 0.08, a, 1);
  }
  [0, 20, 40, 60].forEach(h => label(DIAL.reserve, 1.18, -120 * D2R + h / 60 * 240 * D2R, String(h), 0.36, FONT_UI, 600));
  label(DIAL.reserve, 0.55, Math.PI, 'HOURS', 0.22, FONT_UI, 600, false);
  // tourbillon seconds ring
  g.strokeStyle = 'rgba(30,26,22,0.6)'; g.lineWidth = k * 0.05;
  g.beginPath(); g.arc(X(DIAL.tb[0]), Y(DIAL.tb[1]), Rk(DIAL.tbR + 0.12), 0, TAU); g.stroke();
  ticks(DIAL.tb, DIAL.tbR + 0.25, DIAL.tbR + 0.6, 60, 1, 0.04);
  ticks(DIAL.tb, DIAL.tbR + 0.25, DIAL.tbR + 0.85, 60, 5, 0.07);
  [15, 30, 45, 60].forEach(s => label(DIAL.tb, DIAL.tbR + 1.35, (s % 60) * TAU / 60, String(s), 0.6, FONT_DISPLAY, 600));
  // signature lines
  g.fillStyle = '#2a2520'; g.textAlign = 'center';
  g.font = `italic 500 ${Rk(0.9)}px ${FONT_DISPLAY}`; g.fillText('Atlas', X(0), Y(-2.7));
  g.font = `600 ${Rk(0.34)}px ${FONT_UI}`; g.fillText('GRANDE COMPLICATION  ·  18 000 A/H', X(0), Y(-3.55));
}

function drawMoon(g, S) {
  // disc radius 3.1 mm mapped to the whole canvas
  const k = S / 6.4, X = x => (x + 3.2) * k, Y = y => (3.2 - y) * k;
  let gr = g.createRadialGradient(S / 2, S / 2, 0, S / 2, S / 2, S / 2);
  gr.addColorStop(0, '#1d2f7a'); gr.addColorStop(1, '#0f1a4a');
  g.fillStyle = gr; g.fillRect(0, 0, S, S);
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 260; i++) {
    const r = 0.4 + rnd() * 2.7, a = rnd() * TAU, s = (0.015 + rnd() * 0.035) * k;
    g.fillStyle = `rgba(232,204,140,${0.5 + rnd() * 0.5})`;
    g.beginPath(); g.arc(X(r * Math.cos(a)), Y(r * Math.sin(a)), s, 0, TAU); g.fill();
  }
  for (const a of [Math.PI / 2, -Math.PI / 2]) {
    const cx = X(1.75 * Math.cos(a)), cy = Y(1.75 * Math.sin(a)), r = 0.45 * k;
    gr = g.createRadialGradient(cx - r * .3, cy - r * .3, r * .1, cx, cy, r);
    gr.addColorStop(0, '#fbe7b0'); gr.addColorStop(0.7, '#dcb466'); gr.addColorStop(1, '#a9813c');
    g.fillStyle = gr; g.beginPath(); g.arc(cx, cy, r, 0, TAU); g.fill();
    g.fillStyle = 'rgba(150,110,50,0.28)';
    for (const [dx, dy, rr] of [[-.25, -.15, .18], [.2, .1, .12], [-.05, .3, .1], [.25, -.28, .08]]) {
      g.beginPath(); g.arc(cx + dx * r, cy + dy * r, rr * r, 0, TAU); g.fill();
    }
  }
}

// moon window: semicircle with two "bosoms" along the bottom edge
function moonWindowPath() {
  const { cx, y0, R } = DIAL.moonWin, pts = [];
  for (let i = 0; i <= 40; i++) { const a = i / 40 * Math.PI; pts.push(V2(cx + R * Math.cos(a), y0 + R * Math.sin(a))); }
  // left bosom (from x=-R to 0), right bosom (0 to R): arcs bulging upward, traced right-to-left
  const h = R / 2;
  for (let i = 1; i <= 16; i++) { const a = Math.PI - i / 16 * Math.PI; pts.push(V2(cx - h + h * Math.cos(a), y0 + h * Math.sin(a))); }
  for (let i = 1; i < 16; i++) { const a = Math.PI - i / 16 * Math.PI; pts.push(V2(cx + h + h * Math.cos(a), y0 + h * Math.sin(a))); }
  return pts;
}

const ang = (a, b) => Math.atan2(b[1] - a[1], b[0] - a[0]);
// phase of driven toothing (zB at b) so it meshes with toothing (zA at a, phase pA)
const meshPhase = (pA, zA, zB, a, b) => { const c = ang(a, b); return c + Math.PI + (c - pA) * zA / zB - Math.PI / zB; };

// ---------------------------------------------------------------- registry
const PARTS = [], PART = {};
let PART_SEQ = 0;
function addPart(id, layer, obj, info) {
  const p = { id, num: ++PART_SEQ, layer, obj, meshes: [], opacity: 1, target: 1, glow: 0, glowTarget: 0, ...info };
  p.count = info.count ?? 1;
  obj.traverse(o => {
    if (o.isMesh && !o.userData.part) {
      o.material = o.material.clone();
      o.material.userData.baseEmissive = o.material.emissive ? o.material.emissive.clone() : null;
      o.userData.part = p; p.meshes.push(o);
    }
  });
  PARTS.push(p); PART[id] = p;
  return p;
}
const M = (geo, mat) => new THREE.Mesh(geo, mat);
function rod(r, z0, z1, mat = MAT.steel, x = 0, y = 0, seg = 14) {
  const g = new THREE.CylinderGeometry(r, r, Math.abs(z1 - z0), seg);
  g.rotateX(Math.PI / 2); g.translate(x, y, (z0 + z1) / 2);
  return M(g, mat);
}
function disc(r, z, depth, mat, holeR = 0, seg = 64) {
  const holes = holeR ? [boreHole(holeR, 32)] : [];
  const g = extrude(circlePts(r, seg), holes, depth, 0); g.translate(0, 0, z);
  return M(g, mat);
}
function toothed(outline, z, depth, mat, o = {}) {
  const holes = (o.holes || []).slice();
  if (o.bore) holes.push(boreHole(o.bore));
  const g = extrude(outline, holes, depth, o.bevel || 0); g.translate(0, 0, z);
  const m = M(g, mat); if (o.off) m.rotation.z = o.off; return m;
}
function wheelM(zt, m, z, depth, mat, o = {}) {
  const rp = m * zt / 2, rf = rp - 1.6 * m;
  const rim = o.rim ?? Math.max(0.16, rp * 0.1), hub = o.hub ?? Math.max(0.32, rp * 0.18);
  const holes = o.spokes ? spokeHoles(o.spokes, hub, rf - rim, o.spokeW ?? Math.max(0.07, rp * 0.045), o.curve ?? 0, o.spokePhase ?? 0) : [];
  return toothed(wheelOutline(zt, m, o.profile), z, depth, mat, { holes, bore: o.bore ?? 0.1, off: o.off, bevel: o.bevel });
}
const pinionM = (zt, m, z, depth, mat, off = 0, bore = 0) => toothed(pinionOutline(zt, m), z, depth, mat, { off, bore });
let JEWELS = 3;   // pallet stones + impulse pin
function jewel(x, y, z, r = 0.34, facing = 1) {
  JEWELS++;
  const g = new THREE.Group();
  const j = new THREE.CylinderGeometry(r, r * 1.04, 0.1, 24); j.rotateX(Math.PI / 2);
  const m = M(j, MAT.ruby); g.add(m);
  const hole = new THREE.CylinderGeometry(r * 0.28, r * 0.28, 0.104, 12); hole.rotateX(Math.PI / 2);
  g.add(M(hole, MAT.jewelHole));
  // gold chaton ring
  const ring = new THREE.TorusGeometry(r * 1.12, r * 0.14, 6, 28);
  const rm = M(ring, MAT.goldPale); g.add(rm);
  g.position.set(x, y, z + facing * 0.03);
  return g;
}
function screw(x, y, z, r = 0.5, facing = -1, mat = MAT.blued) {
  const g = new THREE.Group();
  const h = new THREE.CylinderGeometry(r, r * 0.92, 0.26, 20); h.rotateX(Math.PI / 2);
  g.add(M(h, mat));
  const slot = new THREE.BoxGeometry(r * 2.05, r * 0.24, 0.12);
  const s = M(slot, MAT.jewelHole); s.position.z = facing * 0.09; s.rotation.z = (x * 7 + y * 3) % 3; g.add(s);
  g.position.set(x, y, z + facing * 0.13);
  return g;
}
function lever(points, z, depth, mat, local = [0, 0]) {
  // points: [[x,y,r], ...] in watch coords — chain of capsules hulled pairwise
  const g = new THREE.Group();
  for (let i = 0; i < points.length - 1; i++) {
    const a = points[i], b = points[i + 1];
    const out = hullOfCircles([[a[0] - local[0], a[1] - local[1], a[2]], [b[0] - local[0], b[1] - local[1], b[2]]]);
    const geo = extrude(out, [], depth, 0); geo.translate(0, 0, z);
    g.add(M(geo, mat));
  }
  return g;
}
const at = (p, r, a) => [p[0] + r * Math.cos(a), p[1] + r * Math.sin(a)];

// ---------------------------------------------------------------- build

  const { B, C, K, T, MW, I1, DS, W24, MI, DY, MS, PW, RW, I2, I3, HS, CW } = LAY;

  // ======================= MAIN PLATE ==========================
  {

  // ======================= GOING TRAIN ==========================
  {

    g.add(ring);

    const drum = M(drumGeo, MAT.gold); drum.material.side = THREE.DoubleSide; g.add(drum);
    g.add(disc(6.1, -1.66, 0.1, MAT.gold, 1.05, 96));

    g.add(arbor); R.barrelArbor = arbor;
    LG.train.add(g); R.barrel = g;

    // center wheel (+ center pinion meshing barrel)

    const tg = new THREE.Group(); tg.position.set(T[0], T[1], 0);

// Julian-rule month lengths: what the program wheel "knows" (every 4th year is a leap year)
function monthLen(y, m) { return [31, (y % 4 === 0) ? 29 : 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31][m - 1]; }

// ============================================================================
// SIMULATION — the balance swings in real time; everything else follows the beats
// ============================================================================
const F_HZ = 2.5;                 // balance frequency: 18,000 vph
const LIFT = 26 * D2R;            // half lift angle of the balance
const BANK = 12 * D2R;            // pallet fork banking angle
const FORK_K = 0.46;              // impulse-pin radius / fork length
const E0 = -105 * D2R;            // escape wheel phase so a tooth sits on a stone
const FULL_TURNS = 7.5;           // 60 h of reserve, 8 h per barrel turn

// ----- epoch: local midnight today (the moment the watch was "set" from)
const NOW0 = new Date();
const EPOCH = new Date(NOW0.getFullYear(), NOW0.getMonth(), NOW0.getDate());
const EPOCH_MS = EPOCH.getTime();
const EPOCH_YMD = [EPOCH.getFullYear(), EPOCH.getMonth() + 1, EPOCH.getDate()];
const EPOCH_WD = EPOCH.getDay();
const wallSec = () => { const n = new Date(); return (n.getTime() - EPOCH_MS) / 1000 - (n.getTimezoneOffset() - EPOCH.getTimezoneOffset()) * 60; };

// ----- calendars
function jdnJulian(y, m, d) { const a = Math.floor((14 - m) / 12), yy = y + 4800 - a, mm = m + 12 * a - 3; return d + Math.floor((153 * mm + 2) / 5) + 365 * yy + Math.floor(yy / 4) - 32083; }
function fromJdnJulian(J) { const c = J + 32082, d = Math.floor((4 * c + 3) / 1461), e = c - Math.floor(1461 * d / 4), m = Math.floor((5 * e + 2) / 153); return [d - 4800 + Math.floor(m / 10), m + 3 - 12 * Math.floor(m / 10), e - Math.floor((153 * m + 2) / 5) + 1]; }
const EPOCH_JJ = jdnJulian(...EPOCH_YMD);
const mechDate = days => fromJdnJulian(EPOCH_JJ + days);                                // what the watch shows
const realDate = days => { const d = new Date(EPOCH_YMD[0], EPOCH_YMD[1] - 1, EPOCH_YMD[2] + days); return [d.getFullYear(), d.getMonth() + 1, d.getDate()]; };
const SYN = 29.530588853, MECH_LUNATION = 29.53125;
const meanMoonAge = ms => fmod(ms / 86400000 + 2440587.5 - 2451550.26, SYN);
const MOON_AGE0 = meanMoonAge(EPOCH_MS);
const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const WDAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];

// ----- clock state
const CLOCK = {
  S: wallSec(), mode: 'live', rate: 1, travel: null,
  windTurns: 0, held: false, stopped: false,
};
CLOCK.windTurns = CLOCK.S / 28800 + 44.5 / 8;

function setRate(r) {
  if (CLOCK.mode === 'travel') CLOCK.travel = null;
  CLOCK.mode = 'run'; CLOCK.rate = r;
}
function goLive(dur = 1.6) {
  const d = wallSec() - CLOCK.S;
  if (Math.abs(d) < 0.3) { CLOCK.mode = 'live'; CLOCK.rate = 1; return; }
  travelTo(null, Math.min(2.6, dur + Math.log10(1 + Math.abs(d)) * 0.15), { mode: 'live', rate: 1 });
}
function travelTo(S1, dur, then) {
  CLOCK.travel = { from: CLOCK.S, to: S1, t0: performance.now(), dur: dur * 1000, then };
  CLOCK.mode = 'travel';
}
function clockStep(dt) {
  const c = CLOCK;
  let traveled = false;
  if (c.mode === 'live') c.S = wallSec();
  else if (c.mode === 'run') { if (!c.stopped) c.S += dt * c.rate; }
  else if (c.mode === 'travel') {
    const tr = c.travel, t = clamp((performance.now() - tr.t0) / tr.dur, 0, 1);
    const to = tr.to === null ? wallSec() : tr.to;
    c.S = tr.from + (to - tr.from) * easeInOut(t);
    traveled = true;
    if (t >= 1) { c.mode = tr.then.mode; c.rate = tr.then.rate; c.travel = null; c.stopped = false; }
  }
  // the watchmaker keeps it wound during time-lapse and travel
  c.held = traveled || (c.mode === 'run' && c.rate > 30);
}

// ----- escapement kinematics: from sim seconds S to beats, fork and balance
function escapement(S, A) {
  const psi = TAU * F_HZ * S;
  const delta = Math.asin(Math.min(0.99, LIFT / A));
  const n = Math.floor((psi + delta) / Math.PI);
  const local = psi - n * Math.PI;
  let frac = 1, phase = 'locked', u = 1;
  if (local < delta) {
    u = (local + delta) / (2 * delta);
    if (u < 0.2) { frac = -0.05 * Math.sin(Math.PI * u / 0.2); phase = 'unlocking'; }
    else if (u < 0.86) { frac = 0.85 * (u - 0.2) / 0.66; phase = 'impulse'; }
    else { frac = 0.85 + 0.15 * smooth((u - 0.86) / 0.14); phase = 'drop'; }
  }
  const theta = A * Math.sin(psi);
  return { theta, beats: n + frac, phase, n, fork: clamp(-FORK_K * theta, -BANK, BANK) };
}

// discrete indicators chase their targets one tooth at a time, with a snap
class Chaser {
  constructor() { this.v = null; this.t = 0; }
  set(t) { if (this.v === null || Math.abs(t - this.v) > 40) this.v = t; this.t = t; }
  step(dt, speed = 9) {
    const d = this.t - this.v; if (!d) return 0;
    const before = Math.floor(this.v + 1e-9);
    this.v += Math.sign(d) * Math.min(Math.abs(d), speed * dt);
    return Math.floor(this.v + 1e-9) - before;   // teeth crossed this frame
  }
  get disp() { const f = Math.floor(this.v), r = this.v - f; return f + smooth(Math.min(1, r * 1.6)); }
}
const CH = { date: new Chaser(), day: new Chaser(), month: new Chaser(), hour: new Chaser() };
const FLICK = { day: -9, month: -9, grand: -9, grandDepth: 0 };

let ST = {};      // last computed state, read by the UI
let lastWD = null, lastMonthCount = null, lastQuarter = null, lastWind = 0, lastBeatN = null;

function mech(dt) {
  const c = CLOCK;
  let drumTurns = c.S / 28800;
  if (c.held) c.windTurns = Math.max(c.windTurns, drumTurns + 30 / 8);
  c.windTurns = Math.min(c.windTurns, drumTurns + FULL_TURNS);
  let reserveTurns = c.windTurns - drumTurns;
  if (reserveTurns <= 0 && !c.held) {           // run down: the watch stops
    if (c.mode === 'live') { c.mode = 'run'; c.rate = 1; }
    c.stopped = true; reserveTurns = 0; c.S = (c.windTurns) * 28800; drumTurns = c.windTurns;
  } else if (c.stopped && reserveTurns > 0.02) c.stopped = false;
  const reserveH = clamp(reserveTurns * 8, 0, 60);
  const A = c.stopped ? 0.0001 : (200 + 85 * smooth(reserveH / 40)) * D2R;
  const esc = escapement(c.S, A);
  const t = (esc.beats - 0.5) / 5;            // seconds the train has counted since midnight on the epoch day

  const days = Math.floor(t / 86400);
  const [Y, Mo, D] = mechDate(days);
  const wd = fmod(EPOCH_WD + days, 7);
  const monthCount = Y * 12 + (Mo - 1);
  const daySec = t - days * 86400;

function mainspring(wf) {

// ----- winding by hand
function wind(dt) {
  const before = CLOCK.windTurns;

// ----- mesh phases that depend on the sim (set once after build)

// Westminster quarters: the five changes, on gongs 0..3
const CHANGES = [[0, 1, 2, 3], [2, 0, 1, 3], [2, 1, 0, 2], [0, 2, 1, 3], [3, 1, 0, 2]];

function repeaterCounts() {
  const t = ST.t; let h = Math.floor(fmod(t, 43200) / 3600); if (h === 0) h = 12;

}

function bindControls(el) {

    const s = CAM.dist * 0.0013;
    const right = _v.set(Math.cos(CAM.yaw), 0, -Math.sin(CAM.yaw));
    CAM.goal.target.addScaledVector(right, -dx * s);
    const up = new THREE.Vector3().crossVectors(new THREE.Vector3().subVectors(CAM.target, camera.position).normalize(), right).normalize();
    CAM.goal.target.addScaledVector(up, -dy * s);

  };

    el.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });

<p>Left out of this model: the Chinese calendar with its 60-year cycle of heavenly stems and earthly branches, the Shanghai sky chart and sidereal time, sunrise and sunset, the equation of time, the split-seconds chronograph, the alarm and the sonnerie modes. Before the Berkley, the record belonged to Vacheron Constantin's Reference 57260 (2015, 57 complications, 2,826 parts). The most complicated wristwatch is the same maker's Solaria Ultra Grand Complication (2025, 41 complications, 1,521 parts).</p>
<p class="sources">Sources: <a href="https://www.hautehorlogerie.org/en/watches-and-culture/watchmaking-scene/watches-and-novelties/les-cabinotiers-the-berkley-grand-complication" target="_blank" rel="noopener">FHH</a> · <a href="https://watchesbysjx.com/2024/04/vacheron-constantin-les-cabinotiers-the-berkley-grand-complication.html" target="_blank" rel="noopener">SJX</a> · <a href="https://revolutionwatch.com/the-vacheron-constantin-les-cabinotiers-the-berkley-grand-complication-the-worlds-most-complicated-watch/" target="_blank" rel="noopener">Revolution</a> · <a href="https://en.wikipedia.org/wiki/Complication_(horology)" target="_blank" rel="noopener">Wikipedia</a></p>`,
    read: [],
  },
];

  drum: ['Barrel drum', () => `1 turn per 8 h · ${fmod(ST.drumTurns * 360, 360).toFixed(1)}°`],

  program: ['Program wheel', () => { const i = fmod(ST.monthCount, 48); const y = Math.floor(i / 12); return `step ${i + 1} of 48 · ${y === 0 ? 'leap year' : `year ${y} after leap`}`; }],
  moon: ['Moon age (watch)', () => `${fmod(ST.moonAge, MECH_LUNATION).toFixed(2)} days`],

  moonDrift: ['Watch moon error', () => { const e = ST.t / 86400 * (SYN / MECH_LUNATION - 1) * 86400; return `${e >= 0 ? '+' : '−'}${fmtSpan(e)}`; }],
  strike: ['Will strike', () => { const c = repeaterCounts(); return `${c.h} h · ${c.q} quarters · ${c.m} min`; }],
  nextchime: ['Next chime', () => { if (REP.chime === 'off') return 'Chimes off'; const s = 900 - fmod(ST.t, 900); return `in ${fmtSpan(s)}`; }],

let TOTAL_PARTS = 0, TOTAL_JEWELS = 0;

// ---------------------------------------------------------------- actions
const ACTIONS = {
  wind: () => { const b = el('button', 'act primary', 'Hold to wind'); let raf = 0, last = 0;
    const loop = t => { const dt = last ? Math.min(0.05, (t - last) / 1000) : 0; last = t; if (wind(dt)) raf = requestAnimationFrame(loop); else { b.textContent = 'Fully wound'; } };
    const start = e => { e.preventDefault(); AUDIO.ensure(); last = 0; b.classList.add('down'); b.textContent = 'Winding…'; cancelAnimationFrame(raf); raf = requestAnimationFrame(loop); };
    const stop = () => { cancelAnimationFrame(raf); b.classList.remove('down'); if (b.textContent === 'Winding…') b.textContent = 'Hold to wind'; };
    b.addEventListener('pointerdown', start); b.addEventListener('pointerup', stop); b.addEventListener('pointerleave', stop); b.addEventListener('pointercancel', stop);
    b.addEventListener('keydown', e => { if (e.key === ' ' || e.key === 'Enter') { if (!b.classList.contains('down')) start(e); } });
    b.addEventListener('keyup', stop);
    return b; },
  strike: () => { const b = el('button', 'act primary', 'Strike the time'); b.onclick = () => { AUDIO.on = true; AUDIO.ensure(); syncSound(); startRepeater(); }; return b; },
  chime: () => seg('Chimes in passing', [['off', 'Off'], ['hours', 'Hours'], ['westminster', 'Westminster']], () => REP.chime, v => { REP.chime = v; if (v !== 'off') { AUDIO.on = true; AUDIO.ensure(); syncSound(); } }),
  night: () => { const b = el('button', 'act toggle', 'Night silence 22:00–08:00'); const s = () => b.setAttribute('aria-pressed', REP.night); s(); b.onclick = () => { REP.night = !REP.night; s(); }; return b; },
  feb27: () => tm('28 Feb 2027 → 1 Mar', 2027, 2, 28),
  feb28: () => tm('28 Feb 2028 → 29 Feb', 2028, 2, 28),
  feb2100: () => tm('28 Feb 2100', 2100, 2, 28, true),
  today: () => { const b = el('button', 'act', 'Back to today'); b.onclick = () => { goLive(); note(''); }; return b; },
};
function el(tag, cls, txt) { const e = document.createElement(tag); if (cls) e.className = cls; if (txt !== undefined) e.textContent = txt; return e; }
function seg(label, opts, get, set) {

  w.append(el('span', 'seg-l', label));

  const sync = () => row.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === get()));

}
function tm(label, y, m, d, century) {
  const b = el('button', 'act', label);
  b.onclick = () => {
    const days = jdnJulian(y, m, d) - EPOCH_JJ;
    travelTo(days * 86400 + 86400 - 6, 2.4, { mode: 'run', rate: 1 });
    note(century ? 'The year 2100 is not a leap year in the Gregorian calendar, but this program wheel makes every fourth year one. In six seconds it will show 29 February 2100. A watchmaker will have to set it forward a day.' : 'Midnight in six seconds. Watch the date star and the grand lever.');
  };

}
function note(t) { const n = $('#plNote'); n.textContent = t; n.hidden = !t; }

// ---------------------------------------------------------------- UI object
const UI = {

  },
  tap(x, y) {

  },

  go(i, opts = {}) {

    const acts = $('#plActions'); acts.innerHTML = '';

    acts.hidden = !(P.actions || []).length;
    note('');
    const ro = $('#plReadouts'); ro.innerHTML = '';
    for (const k of P.read || []) { const d = el('div', 'ro'); d.innerHTML = `<dt>${RO[k][0]}</dt><dd data-ro="${k}"></dd>`; ro.append(d); }
    ro.hidden = !(P.read || []).length;
    document.querySelectorAll('#plIndex button').forEach((b, j) => b.setAttribute('aria-current', j === i ? 'step' : 'false'));
    $('#prev').disabled = i === 0; $('#next').disabled = i === PLATES.length - 1;
    $('#sheet .sh-scroll').scrollTop = 0;
    // stage
    EXP.goal = P.explode; EXP.subGoal = P.sub; $('#explode').value = Math.round(P.explode * 100);
    VIS.caseOn = P.case; VIS.focusLayers = P.focusLayers ? new Set(P.focusLayers) : null; VIS.focusParts = P.focusParts ? new Set(P.focusParts) : null;
    VIS.hidden.clear(); syncLayerList();
    computeTargets();
    const c = P.cam; CAM.goal.yaw = c.yaw; CAM.goal.pitch = c.pitch; CAM.goal.size = c.size; CAM.zoom = 1; CAM.panned = false; CAM.auto = window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : (c.auto || 0);
    if (c.follow) { const off = c.follow === 'escape' ? [0, 2.05, -0.5] : [0, 0, 0.4]; CAM.follow = () => R.cage.localToWorld(new THREE.Vector3(...off)); }
    else {
      CAM.follow = null;
      let z = c.t[2] ?? 0;
      if (c.tz) z = c.tz.reduce((s, id) => s + ZREF[id] + LAYER[id].k * GAP * P.explode, 0) / c.tz.length;

    }

    if (P.rate === 'live') { if (CLOCK.mode !== 'live') goLive(); }

    syncRates();
    this.labels = P.labels;
    this.select(null);
    if (!opts.silent) try { history.replaceState(null, '', '#plate' + (i + 1)); } catch (e) { }

  },
  labels: [],

// ---------------------------------------------------------------- balloons
const BAL = new Map();
function balloonFor(key, num, name) {
  let b = BAL.get(key);
  if (!b) {
    b = { el: el('div', 'balloon'), line: document.createElementNS('http://www.w3.org/2000/svg', 'line') };
    b.el.innerHTML = `<span class="bn"></span><span class="bt"></span>`;
    $('#balloons').append(b.el); $('#leaders').append(b.line); BAL.set(key, b);
  }
  if (b.name !== name || b.num !== num) { b.el.querySelector('.bn').textContent = num; b.el.querySelector('.bt').textContent = name; b.name = name; b.num = num; b.w = 0; }
  return b;
}
function updateBalloons() {
  const items = [];
  const W = window.innerWidth, H = window.innerHeight, r = UI.reserved();
  const center = new THREE.Vector3().copy(CAM.target).project(camera);
  const cx = (center.x + 1) / 2 * W, cy = (1 - center.y) / 2 * H;
  if (UI.labels === 'layers') {
    for (const l of LAYERS) { if (l.id === 'case') continue; items.push({ key: 'L' + l.id, num: l.k > 0 ? `+${l.k}` : String(l.k), name: l.name, world: wp(LG[l.id], 19.5, -3, ZREF[l.id]), side: 1, vis: !VIS.hidden.has(l.id) }); }
  } else for (const id of UI.labels) { const p = PART[id]; items.push({ key: id, num: p.num, name: p.name, world: partAnchor(p), vis: p.opacity > 0.5 }); }
  const keep = new Set(items.map(i => i.key));
  for (const [k, b] of BAL) if (!keep.has(k)) { b.el.remove(); b.line.remove(); BAL.delete(k); }
  const placed = [];
  const narrow = W < 600;
  for (const it of items) {
    const b = balloonFor(it.key, it.num, it.name);
    const v = it.world.clone().project(camera);
    const ax = (v.x + 1) / 2 * W, ay = (1 - v.y) / 2 * H;
    if (!it.vis || v.z > 1 || ax < -50 || ax > W + 50 || ay < -50 || ay > H + 50) { b.el.style.opacity = 0; b.line.style.opacity = 0; continue; }
    let dx = it.side ? 1 : ax - cx, dy = it.side ? -0.15 : ay - cy; const dl = Math.hypot(dx, dy) || 1; dx /= dl; dy /= dl;
    if (!b.w) { b.w = b.el.offsetWidth; b.h = b.el.offsetHeight; }
    const bw = b.w, bh = b.h, d = narrow ? 34 : 48;
    let bx = ax + dx * d + (dx < 0 ? -bw : 0), by = ay + dy * d - bh / 2;
    bx = clamp(bx, r.left + 8, W - r.right - bw - 8); by = clamp(by, r.top + 8, H - r.bottom - bh - 8);
    for (let k = 0; k < 6; k++) for (const q of placed) {
      if (bx < q.x + q.w + 4 && bx + bw + 4 > q.x && by < q.y + q.h + 3 && by + bh + 3 > q.y) by = by < q.y ? q.y - bh - 4 : q.y + q.h + 4;
    }
    by = clamp(by, r.top + 8, H - r.bottom - bh - 8);
    placed.push({ x: bx, y: by, w: bw, h: bh });
    b.el.style.transform = `translate(${bx.toFixed(1)}px, ${by.toFixed(1)}px)`; b.el.style.opacity = 1;
    const ex = clamp(ax, bx, bx + bw), ey = clamp(ay, by, by + bh);
    b.line.setAttribute('x1', ax.toFixed(1)); b.line.setAttribute('y1', ay.toFixed(1));
    b.line.setAttribute('x2', ex.toFixed(1)); b.line.setAttribute('y2', ey.toFixed(1)); b.line.style.opacity = 1;
    b.el.onclick = () => { if (PART[it.key]) UI.select(PART[it.key]); };
  }
}

// ---------------------------------------------------------------- dock & status
const RATES = [[0.01, '1/100'], [0.1, '1/10'], [1, '1×'], [60, '1 min/s'], [3600, '1 h/s'], [86400, '1 day/s']];
function buildDock() {
  const r = $('#rates');
  for (const [v, t] of RATES) { const b = el('button', 'rate', t); b.dataset.r = v; b.onclick = () => { if (v === 1 && CLOCK.mode === 'live') return; setRate(v); syncRates(); }; r.append(b); }
  $('#btnNow').onclick = () => { goLive(); note(''); syncRates(); };
  $('#explode').addEventListener('input', e => { EXP.goal = e.target.value / 100; computeTargets(); });
  $('#btnSound').onclick = () => { AUDIO.on = !AUDIO.on; if (AUDIO.on) AUDIO.ensure(); syncSound(); };
  $('#btnLayers').onclick = () => { const p = $('#layersPanel'); p.hidden = !p.hidden; $('#btnLayers').setAttribute('aria-expanded', !p.hidden); };
  const lp = $('#layerList');
  for (const l of LAYERS) {
    const row = el('li', 'lrow');
    const vis = el('button', 'eye'); vis.setAttribute('aria-label', `Show ${l.name}`); vis.dataset.l = l.id;
    vis.onclick = () => { VIS.hidden.has(l.id) ? VIS.hidden.delete(l.id) : VIS.hidden.add(l.id); syncLayerList(); computeTargets(); };
    const nm = el('button', 'lname', l.name); nm.onclick = () => {
      if (l.id === 'case') { VIS.caseOn = true; EXP.goal = 0; $('#explode').value = 0; computeTargets(); return; }

      CAM.follow = null; CAM.goal.target.set(0, ZREF[l.id] + l.k * GAP * EXP.goal, 0); CAM.goal.size = 24; CAM.zoom = 1; CAM.panned = false; computeTargets();
    };
    const k = el('span', 'lk', l.id === 'case' ? '' : (l.k > 0 ? `+${l.k}` : String(l.k)));
    row.append(vis, k, nm); lp.append(row);
  }
  $('#showAll').onclick = () => { VIS.focusLayers = null; VIS.focusParts = null; VIS.hidden.clear(); syncLayerList(); computeTargets(); };
  $('#pcClose').onclick = () => UI.select(null);
  $('#pcIsolate').onclick = () => { const p = VIS.selected; if (!p) return; VIS.focusParts = new Set([p.id]); VIS.focusLayers = null; computeTargets(); };
  $('#prev').onclick = () => UI.go(UI.plate - 1);
  $('#next').onclick = () => UI.go(UI.plate + 1);
  const idx = $('#plIndex');
  PLATES.forEach((p, i) => { const b = el('button', '', ROMAN[i]); b.title = p.title; b.setAttribute('aria-label', `Plate ${ROMAN[i]}: ${p.title}`); b.onclick = () => UI.go(i); idx.append(b); });
  $('#shToggle').onclick = () => { const s = $('#sheet'); const c = s.classList.toggle('collapsed'); $('#shToggle').setAttribute('aria-expanded', !c); requestAnimationFrame(resize); };
  document.addEventListener('keydown', e => {
    if (e.target.closest('input, textarea')) return;
    if (e.key === 'ArrowRight' || e.key === 'PageDown') UI.go(UI.plate + 1);
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') UI.go(UI.plate - 1);
    else if (e.key === 'Escape') { UI.select(null); $('#layersPanel').hidden = true; }
  });
}
function syncLayerList() { document.querySelectorAll('#layerList .eye').forEach(b => b.setAttribute('aria-pressed', !VIS.hidden.has(b.dataset.l))); }
function syncSound() { const b = $('#btnSound'); b.setAttribute('aria-pressed', AUDIO.on); b.querySelector('span').textContent = AUDIO.on ? 'Sound on' : 'Sound off'; }
function syncRates() {
  const live = CLOCK.mode === 'live' || (CLOCK.mode === 'travel' && CLOCK.travel?.then.mode === 'live');
  const cur = live ? 1 : CLOCK.mode === 'travel' ? CLOCK.travel.then.rate : CLOCK.rate;

}
function updateStatus() {
  const s = $('#ckStatus'), now = wallSec(), d = CLOCK.S - now;
  let txt, more = '', cls;
  if (CLOCK.stopped) { txt = 'Stopped'; more = ' · wind the crown'; cls = 'warn'; }
  else if (CLOCK.mode === 'live') { txt = 'Live'; more = ' · set to your clock'; cls = 'live'; }
  else if (CLOCK.mode === 'travel') { txt = 'Setting the hands…'; cls = 'busy'; }

}

// ============================================================================
// MAIN — boot and frame loop
// ============================================================================
let lastT = 0, roTimer = 0, beatPrev = null;
function frame(now) {
  const dt = lastT ? Math.min(0.1, (now - lastT) / 1000) : 0.016; lastT = now;
  clockStep(dt);
  const st = mech(dt);
  pose(st, dt);
  if (AUDIO.on) {
    const n = st.esc.n;
    if (beatPrev !== null && n !== beatPrev && Math.abs(n - beatPrev) <= 2 && (CLOCK.mode === 'live' || CLOCK.rate <= 1)) AUDIO.tick(n & 1);
    beatPrev = n;
  }
  checkPassingChime();
  applyExplode(dt); applyOpacity(dt); camUpdate(dt);
  renderer.render(scene, camera);
  updateBalloons();
  roTimer -= dt;
  if (roTimer <= 0) { roTimer = 0.1; updateStatus(); updateReadouts(); syncRates(); }
  requestAnimationFrame(frame);
}

function boot() {

    initScene($('#stage'));
  } catch (e) {

  }

  initPhases();
  buildAxes();
  TOTAL_PARTS = PARTS.reduce((s, p) => s + p.count, 0); TOTAL_JEWELS = JEWELS;
  buildDock(); syncSound();
  themeColors();
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', themeColors);
  new MutationObserver(themeColors).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  const ro = new ResizeObserver(() => { document.documentElement.style.setProperty('--sheet-h', $('#sheet').offsetHeight + 'px'); resize(); });
  ro.observe($('#sheet')); ro.observe($('#dock'));
  window.addEventListener('resize', resize);
  document.documentElement.style.setProperty('--sheet-h', $('#sheet').offsetHeight + 'px');
  resize();
  let start = 0;
  const h = location.hash.match(/plate(\d+)/);
  if (h) start = +h[1] - 1; else { try { start = +(localStorage.getItem('gca-plate') || 0); } catch (e) { } }
  UI.go(start, { silent: true });
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) CAM.auto = 0;
  // start already in place
  CAM.yaw = CAM.goal.yaw; CAM.pitch = CAM.goal.pitch; CAM.target.copy(CAM.goal.target); CAM.dist = fitDist(CAM.goal.size);
  EXP.v = EXP.goal; EXP.sub = EXP.subGoal;
  for (const p of PARTS) p.opacity = p.target;
  requestAnimationFrame(frame);
  const L = $('#loading'); L.classList.add('done'); setTimeout(() => { L.hidden = true; }, 700);
  if (document.fonts && document.fonts.load) {
    Promise.all(['500 40px "Bodoni Moda"', '600 40px "Bodoni Moda"', 'italic 500 40px "Bodoni Moda"', '600 40px Barlow'].map(f => document.fonts.load(f).catch(() => null)))
      .then(() => { const c = TEX.dial.userData.canvas; drawDial(c.getContext('2d'), c.width); TEX.dial.needsUpdate = true; resize(); });
  }
