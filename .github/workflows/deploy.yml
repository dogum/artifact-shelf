name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check artifacts and writeups
        run: node tools/check.mjs

      # Posters are normally committed from your machine. If any artifact is new or
      # changed without a fresh capture, take its screenshots here so the site never
      # ships a placeholder. (They aren't committed back; run `npm run capture` locally.)
      - name: Find artifacts that need posters
        id: posters
        run: echo "slugs=$(node tools/capture.mjs --list)" >> "$GITHUB_OUTPUT"

      - name: Capture missing posters
        if: steps.posters.outputs.slugs != ''
        run: |
          npm ci
          npx playwright install --with-deps chromium
          node tools/capture.mjs

      - name: Build and smoke-test
        run: node tools/smoke.mjs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
